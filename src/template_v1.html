<title>Line Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one column scouting sheet. Header + league tabs, then one card per game; each card stacks lines, Crossroads, team patterns, injury report and a drawer for the SGP builder. Parlay slip is a bottom bar. */
:root{
  --bg:#eef2f0; --surface:#ffffff; --surface2:#f4f7f5; --ink:#13201b; --muted:#566660; --line:#d7dfdb;
  --accent:#0c6a5a; --accent-ink:#ffffff; --accent-soft:#d8efe8;
  --over:#1e9a5e; --under:#d2443c; --safe:#2d6bd3; --hot:#d9581f; --cold:#2f7cc0; --warn:#a9700f;
  --over-soft:#dff3e8; --under-soft:#f9e0de; --warn-soft:#f7ecd2; --safe-soft:#dde8f9; --hot-soft:#fbe5d8; --cold-soft:#dcebf8;
  --shadow:0 1px 2px rgba(19,32,27,.06);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1412; --surface:#151f1c; --surface2:#1b2723; --ink:#e5eee9; --muted:#97a8a1; --line:#273732;
  --accent:#3fc7a8; --accent-ink:#06211b; --accent-soft:#16342d;
  --over:#38c586; --under:#ef6d65; --safe:#6ea4ff; --hot:#ff8a4d; --cold:#69b2f0; --warn:#e0a838;
  --over-soft:#14352a; --under-soft:#3a1f1e; --warn-soft:#352b12; --safe-soft:#17284a; --hot-soft:#3a2315; --cold-soft:#162b3d;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1412; --surface:#151f1c; --surface2:#1b2723; --ink:#e5eee9; --muted:#97a8a1; --line:#273732;
  --accent:#3fc7a8; --accent-ink:#06211b; --accent-soft:#16342d;
  --over:#38c586; --under:#ef6d65; --safe:#6ea4ff; --hot:#ff8a4d; --cold:#69b2f0; --warn:#e0a838;
  --over-soft:#14352a; --under-soft:#3a1f1e; --warn-soft:#352b12; --safe-soft:#17284a; --hot-soft:#3a2315; --cold-soft:#162b3d;
  --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:18px 120px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
.disp{font-family:var(--f-display);letter-spacing:.01em}
.muted{color:var(--muted)}
.small{font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-size:36px;line-height:1;font-weight:700;letter-spacing:.01em}
.brand .asof{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:500;font-size:13px}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.how{border:1px solid var(--line);background:var(--surface);border-radius:10px}
.how summary{padding:10px 14px;cursor:pointer;font-weight:500}
.how .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:13px}
.how b{color:var(--ink);font-weight:600}

/* game card */
.game{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.ghead{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.lg{font-family:var(--f-mono);font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--ink)}
.matchup{display:flex;align-items:center;justify-content:space-between;gap:12px}
.team{display:flex;align-items:center;gap:10px;min-width:0}
.chip{width:38px;height:38px;flex:none;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px;color:#fff;border:2px solid transparent}
.tn{min-width:0}
.tn .n{font-family:var(--f-display);font-size:22px;line-height:1.05;font-weight:600}
.tn .r{font-size:12px;color:var(--muted)}
.at{color:var(--muted);font-family:var(--f-mono);font-size:12px}
.sec{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.sec>h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec>h3 .hint{letter-spacing:0;text-transform:none;font-weight:400}

/* lines */
.lines{width:100%;border-collapse:collapse;font-size:13px}
.lines th{font-weight:500;color:var(--muted);text-align:right;padding:2px 0 6px;font-size:12px}
.lines th:first-child,.lines td:first-child{text-align:left}
.lines td{padding:6px 0;border-top:1px solid var(--line);text-align:right}
.lines td:first-child{font-weight:600}
.lines .px{color:var(--muted);margin-left:6px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--surface2);white-space:nowrap}
.badge.lean{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.badge.hot{background:var(--hot-soft);border-color:transparent;color:var(--hot)}
.badge.cold{background:var(--cold-soft);border-color:transparent;color:var(--cold)}
.badge.ok{background:var(--over-soft);color:var(--over);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--under-soft);color:var(--under);border-color:transparent}
.badge.back{background:var(--safe-soft);color:var(--safe);border-color:transparent}
.badges{display:flex;gap:6px;flex-wrap:wrap}

/* crossroads */
.cr-row{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.cr-title{font-weight:600;font-size:13px}
.cr-vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.meter{height:8px;border-radius:99px;background:var(--line);position:relative;overflow:visible}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent)}
.meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;border-radius:2px}
.cr-num{font-family:var(--f-mono);font-weight:600;font-size:15px}
.cr-lab{font-size:11px;color:var(--muted)}
.edge{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.edge.pos{background:var(--over-soft);color:var(--over)}
.edge.neg{background:var(--under-soft);color:var(--under)}
.proj{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kv{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface2)}
.kv .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kv .v{font-family:var(--f-mono);font-weight:600;font-size:15px;margin-top:2px}
.kv .s{font-size:11px;color:var(--muted)}
details.d{font-size:12px;color:var(--muted)}
details.d summary{cursor:pointer;color:var(--ink);font-weight:500}
details.d ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}

/* team patterns */
.pat{display:grid;grid-template-columns:1fr;gap:12px}
.strip{display:flex;gap:3px}
.strip .b{flex:1;min-width:0;text-align:center;border-radius:5px;padding:3px 0 2px;font-size:11px;line-height:1.15;font-family:var(--f-mono)}
.strip .b strong{display:block;font-size:12px}
.strip .w{background:var(--over-soft);color:var(--over)}
.strip .l{background:var(--under-soft);color:var(--under)}
.pat .row{display:flex;flex-direction:column;gap:6px}
.pat .cap{display:flex;justify-content:space-between;gap:8px;font-size:12px;flex-wrap:wrap}
.pat .cap b{font-weight:600}

/* injuries */
.inj{display:grid;grid-template-columns:1fr;gap:12px}
.inj .tm{display:flex;flex-direction:column;gap:6px}
.inj .tm h4{margin:0;font-size:13px;font-weight:600}
.ij{display:flex;flex-direction:column;gap:1px;padding:6px 0;border-top:1px solid var(--line)}
.ij .l1{display:flex;gap:8px;align-items:center;justify-content:space-between}
.ij .nm{font-weight:500}
.ij .nt{font-size:12px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:500;font-size:12px;text-align:left}

/* drawer */
.drawerbtn{width:100%;border:0;border-top:1px solid var(--line);background:var(--accent);color:var(--accent-ink);padding:14px 16px;font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.drawerbtn[aria-expanded="true"]{background:var(--ink);color:var(--surface)}
.drawer{border-top:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:14px;background:var(--surface2)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:500;font-size:13px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.legs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
.leg{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.leg .t{font-weight:600;font-size:13px}
.leg .pr{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.leg.on{background:var(--accent-soft);border-color:var(--accent)}
.leg.on .t{color:var(--accent)}
.leg:disabled{opacity:.45;cursor:not-allowed}
.safelist{display:flex;flex-direction:column;gap:4px}
.safelist .it{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%;text-align:left}
.safelist .it span:first-child{min-width:0}
h4.sub{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* player */
.pl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pl-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.pl-n{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.1}
.pl-n small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.tabs2{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.tabs2 button{flex:none;border:1px solid var(--line);background:var(--surface2);border-radius:7px;padding:5px 10px;font-size:12px;font-weight:500}
.tabs2 button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:var(--f-mono);fill:var(--muted)}
svg.chart text.val{fill:var(--ink);font-weight:600}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .over{fill:var(--over)}
svg.chart .under{fill:var(--under)}
svg.chart .sel{stroke:var(--ink);stroke-width:2}
svg.chart .bk{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 3;opacity:.8}
svg.chart .sf{stroke:var(--safe);stroke-width:2;stroke-dasharray:1.5 3.5;stroke-linecap:round}
svg.chart text.bkl{fill:var(--ink)}
svg.chart text.sfl{fill:var(--safe);font-weight:600}
svg.chart text.bkl,svg.chart text.sfl{paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:6px}
.pnotes{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.pnotes .w{color:var(--warn)}
.grade{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;font-family:var(--f-display);font-weight:700;font-size:17px;color:#fff}
.g-A{background:#1f9a5f}.g-B{background:#64a935}.g-C{background:#c8962a}.g-D{background:#d4682b}.g-F{background:#c9423b}.g-x{background:#7f8c87}
.alt{display:flex;gap:6px;flex-wrap:wrap}
.alt .leg{padding:5px 8px}
.alt .leg .t{font-size:12px}

/* slip */
.slipbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--surface);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;box-shadow:0 -6px 18px rgba(0,0,0,.18)}
.slipbar .in{max-width:760px;width:100%;margin-inline:auto;display:flex;flex-direction:column;gap:8px}
.slipsum{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:none;border:0;color:inherit;padding:0;text-align:left;width:100%}
.slipsum .a{font-weight:600}
.slipsum .b{font-family:var(--f-mono);font-size:13px}
.slipbody{max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.sl{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid rgba(127,127,127,.35);padding:6px 0;font-size:13px}
.sl .x{background:none;border:1px solid rgba(127,127,127,.5);color:inherit;border-radius:6px;padding:2px 8px;font-size:12px}
.slipbar .btn{background:transparent;color:inherit;border-color:rgba(127,127,127,.5)}
.slipnote{font-size:11px;opacity:.75}
.foot{color:var(--muted);font-size:12px;display:flex;flex-direction:column;gap:6px;padding-block:4px}
@media (min-width:640px){.pat,.inj{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:no-preference){.leg,.btn,.tab{transition:background .12s,border-color .12s}}
</style>

<div class="wrap" id="app"></div>
<div class="slipbar" id="slip" hidden></div>

<script>
const DATA = __DATA__;
</script>
<script>
(function(){
"use strict";
const G = {}; DATA.games.forEach(g=>{G[g.id]=g;});
const LEAGUE_N = {nfl:32,wnba:15,mlb:30};
const LOGI = {nfl:7.9,wnba:6.5,mlb:2.5};
const TOTS = {nfl:5.6,wnba:9,mlb:3};
const S = {league:'all', slip:[], slipOpen:false, drawer:{}, pick:{}, bar:{}, allInj:{}, };

const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fo = a => a==null?'n/a':(a>0?'+'+a:String(a));
const n1 = x => (Math.round(x*10)/10).toString();
const sg = x => (x>0?'+':'')+n1(x);
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const decOf = a => a>0 ? 1+a/100 : 1+100/Math.abs(a);
const amerOfDec = d => d>=2 ? Math.round((d-1)*100) : -Math.round(100/(d-1));
const estPrice = p => { p=clamp(p*1.045,0.03,0.97); return p>=0.5 ? Math.max(-1000,-Math.round(100*p/(1-p))) : Math.round(100*(1-p)/p); };
const logistic = z => 1/(1+Math.exp(-z));
const pct = p => Math.round(p*100)+'%';
const surname = n => { const w=n.replace(/[.,]/g,'').split(' ').filter(x=>!/^(jr|sr|ii|iii|iv)$/i.test(x)); return w[w.length-1]||n; };
const fmtDate = d => { const [y,m,dd]=d.split('-'); return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+' '+(+dd); };

function findPlayer(g,pid){ return g.players.find(p=>p.id===pid); }
function visMiles(st){
  if(!st.miles||!st.miles.length) return [];
  const arr = st.miles.map(m=>({m, d:Math.abs(m.t-st.line)})).sort((a,b)=>a.d-b.d).slice(0,5).map(x=>x.m);
  return arr.sort((a,b)=>a.t-b.t);
}

/* ---------- legs ---------- */
function legFor(tok){
  const parts = tok.split(':'); const k=parts[0]; const g=G[parts[1]]; if(!g) return null;
  const cr=g.crossroads, L=g.lines, lg=g.lg;
  if(k==='g'){
    const kind=parts[2], side=parts[3];
    if(kind==='ml'){
      const t=g.teams[side]; const price= side==='home'?L.mlHome:L.mlAway;
      const p = side==='home'?cr.pHome:1-cr.pHome;
      return {id:tok,gid:g.id,group:g.id+':ml',label:t.abbr+' moneyline',p,avail:1,price,src:'DraftKings'};
    }
    if(kind==='spr'){
      const t=g.teams[side]; const line= side==='home'?L.sprHome:L.sprAway; const price= side==='home'?L.prHome:L.prAway;
      const ph = logistic((cr.projMargin+L.sprHome)/LOGI[lg]); const p = side==='home'?ph:1-ph;
      return {id:tok,gid:g.id,group:g.id+':spr',label:t.abbr+' '+sg(line),p,avail:1,price,src:'DraftKings'};
    }
    if(kind==='tot'){
      const po = logistic((cr.projTotal-L.total)/TOTS[lg]);
      const over = side==='over';
      return {id:tok,gid:g.id,group:g.id+':tot',label:(over?'Over ':'Under ')+L.total,p:over?po:1-po,avail:1,price:over?L.over:L.under,src:'DraftKings'};
    }
  }
  if(k==='p'){
    const pl=findPlayer(g,parts[2]); if(!pl) return null;
    const st=pl.stats.find(s=>s.key===parts[3]); if(!st) return null;
    const kind=parts[4]; const nm=surname(pl.name);
    const group=g.id+':'+pl.id+':'+st.key;
    if(kind==='over') return {id:tok,gid:g.id,group,pid:pl.id,label:nm+' Over '+st.line+' '+st.label.toLowerCase(),p:st.pOver,avail:pl.avail,price:st.overPrice,src:'est.'};
    if(kind==='safe' && st.safeAdj!=null) return {id:tok,gid:g.id,group,pid:pl.id,label:nm+' '+st.safeAdj+'+ '+st.label.toLowerCase(),p:st.pSafe,avail:pl.avail,price:st.safePrice,src:st.safeSrc};
    if(kind==='m'){
      const t=parseFloat(parts[5]); const m=st.miles.find(x=>x.t===t); if(!m) return null;
      const p=clamp(((m.hit+1)/(m.n+2))*(1+0.5*st.matchup),0.03,0.95);
      return {id:tok,gid:g.id,group,pid:pl.id,label:nm+' '+t+'+ '+st.label.toLowerCase(),p,avail:pl.avail,price:m.price!=null?m.price:estPrice(p),src:m.price!=null?'DraftKings':'est.'};
    }
  }
  return null;
}
const inSlip = tok => S.slip.some(l=>l.id===tok);
function toggleLeg(tok){
  const i=S.slip.findIndex(l=>l.id===tok);
  if(i>=0){S.slip.splice(i,1);return;}
  const leg=legFor(tok); if(!leg) return;
  const j=S.slip.findIndex(l=>l.group===leg.group); if(j>=0) S.slip.splice(j,1);
  S.slip.push(leg);
}
function countSelections(g){
  let n=6;
  g.players.forEach(pl=>pl.stats.forEach(st=>{ n+=1; if(st.safeAdj!=null) n+=1; n+=visMiles(st).length; }));
  return n;
}
function legBtn(tok,title,sub,dis){
  const on=inSlip(tok);
  return '<button class="leg'+(on?' on':'')+'" data-act="leg" data-tok="'+esc(tok)+'" aria-pressed="'+on+'"'+(dis?' disabled':'')+'><span class="t">'+esc(title)+'</span><span class="pr">'+esc(sub)+'</span></button>';
}
function legSub(tok){ const l=legFor(tok); if(!l) return ''; return fo(l.price)+(l.src==='est.'?' est.':' DK')+' · '+pct(l.p); }

/* ---------- pieces ---------- */
function chipOf(t){ return '<div class="chip" style="background:'+esc(t.color)+';border-color:'+esc(t.alt)+'">'+esc(t.abbr.length>3?t.abbr.slice(0,3):t.abbr)+'</div>'; }

function linesTable(g){
  const L=g.lines,a=g.teams.away,h=g.teams.home;
  const lgName = g.lg==='mlb'?'Run line':'Spread';
  const row=(t,side)=>{
    const sp=side==='home'?L.sprHome:L.sprAway, pr=side==='home'?L.prHome:L.prAway, ml=side==='home'?L.mlHome:L.mlAway;
    const tot=side==='away'?('O '+L.total):('U '+L.total), tp=side==='away'?L.over:L.under;
    return '<tr><td>'+esc(t.abbr)+'</td><td class="mono">'+sg(sp)+'<span class="px">'+fo(pr)+'</span></td><td class="mono">'+tot+'<span class="px">'+fo(tp)+'</span></td><td class="mono">'+fo(ml)+'</td></tr>';
  };
  return '<table class="lines"><thead><tr><th></th><th>'+lgName+'</th><th>Total</th><th>Moneyline</th></tr></thead><tbody>'+row(a,'away')+row(h,'home')+'</tbody></table>';
}

function crossroads(g){
  const cr=g.crossroads,a=g.teams.away,h=g.teams.home,N=LEAGUE_N[g.lg];
  const unit = g.lg==='mlb'?'runs':'pts';
  const matchup = m=>{
    const gap=m.gap, cls=gap>=0?'pos':'neg';
    const [oa,ob]=[m.offBase,m.off];
    return '<div class="cr-row"><div class="cr-title">'+esc(m.title)+'</div>'+
      '<div class="cr-vs"><div><div class="cr-lab">Offense · #'+m.offRank+'/'+N+'</div><div class="cr-num">'+m.off+(oa!==ob?' <span class="muted small">was '+oa+'</span>':'')+'</div>'+
      '<div class="meter"><i style="width:'+m.off+'%"></i><b style="left:'+m.offBase+'%"></b></div></div>'+
      '<span class="edge '+cls+'">'+(gap>=0?'+':'')+Math.round(gap)+'</span>'+
      '<div><div class="cr-lab">Defense · #'+m.dfnRank+'/'+N+'</div><div class="cr-num">'+m.dfn+(m.dfnBase!==m.dfn?' <span class="muted small">was '+m.dfnBase+'</span>':'')+'</div>'+
      '<div class="meter"><i style="width:'+m.dfn+'%"></i><b style="left:'+m.dfnBase+'%"></b></div></div></div></div>';
  };
  const leans = cr.leans.length ? '<div class="badges">'+cr.leans.map(l=>'<span class="badge lean" title="'+esc(l.why)+'">'+esc(l.text)+'</span>').join('')+'</div><div class="small muted">'+cr.leans.map(l=>esc(l.why)).join(' · ')+'</div>'
    : '<div class="small muted">No lean: the model and the book agree within the threshold for this sport.</div>';
  const notes = [].concat((a.injImpact.notes||[]).map(x=>a.abbr+': '+x),(h.injImpact.notes||[]).map(x=>h.abbr+': '+x));
  const notesHtml = notes.length ? '<details class="d"><summary>Injury adjustments used ('+a.abbr+' −'+n1(a.injImpact.off)+' '+unit+', '+h.abbr+' −'+n1(h.injImpact.off)+' '+unit+')</summary><ul>'+notes.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></details>'
    : '<div class="small muted">No injury adjustment applied: nothing on either report moves the numbers.</div>';
  return '<div class="sec"><h3>Crossroads <span class="hint">offense vs defense, with injuries</span></h3>'+
    matchup(cr.matchups[0])+matchup(cr.matchups[1])+
    '<div class="proj">'+
      '<div class="kv"><div class="k">Model score</div><div class="v">'+n1(cr.projAway)+' – '+n1(cr.projHome)+'</div><div class="s">'+esc(a.abbr)+' – '+esc(h.abbr)+' · before injuries '+n1(cr.projAwayNoInj)+' – '+n1(cr.projHomeNoInj)+'</div></div>'+
      '<div class="kv"><div class="k">Model total</div><div class="v">'+n1(cr.projTotal)+'</div><div class="s">book '+g.lines.total+'</div></div>'+
      '<div class="kv"><div class="k">'+esc(h.abbr)+' win chance</div><div class="v">'+pct(cr.pHome)+'</div><div class="s">book '+pct(cr.bookHome)+' (no vig)</div></div>'+
    '</div>'+leans+notesHtml+
  '</div>';
}

function patterns(g){
  const one = t=>{
    const rec=t.recent||[];
    const pf=rec.length?rec.reduce((s,x)=>s+x.pf,0)/rec.length:0, pa=rec.length?rec.reduce((s,x)=>s+x.pa,0)/rec.length:0;
    const w=rec.filter(x=>x.win).length;
    return '<div class="row"><div class="cap"><b>'+esc(t.name)+'</b><span class="muted">last '+rec.length+': '+w+'-'+(rec.length-w)+' · avg '+n1(pf)+' for, '+n1(pa)+' against</span></div>'+
      '<div class="strip" role="img" aria-label="Last '+rec.length+' results, oldest to newest">'+rec.map(x=>'<div class="b '+(x.win?'w':'l')+'" title="'+esc(fmtDate(x.date)+' '+(x.home?'vs ':'@ ')+x.opp+': '+x.pf+'-'+x.pa)+'"><strong>'+(x.win?'W':'L')+'</strong>'+Math.round(x.pf)+'-'+Math.round(x.pa)+'</div>').join('')+'</div></div>';
  };
  return '<div class="sec"><h3>Team patterns <span class="hint">oldest to newest</span></h3><div class="pat">'+one(g.teams.away)+one(g.teams.home)+'</div>'+
    '<div class="small muted">ESPN does not publish past betting lines, so cover and over/under history is not shown. These strips use real results.</div></div>';
}

function injuries(g){
  const one = side=>{
    const t=g.teams[side]; const key=g.id+side;
    const order={out:0,doubtful:1,questionable:2,dtd:3,probable:4,returning:5,inactive:6,info:7};
    let list=t.injuries.slice().sort((a,b)=>(order[a.kind]??9)-(order[b.kind]??9));
    const limit=6; const show = S.allInj[key]?list:list.slice(0,limit);
    const cls=k=>({out:'bad',doubtful:'bad',questionable:'warn',dtd:'warn',probable:'ok',returning:'back',inactive:'',info:''})[k]||'';
    const rows=show.map(i=>'<div class="ij"><div class="l1"><span class="nm">'+esc(i.name)+' <span class="muted">'+esc(i.pos||'')+'</span></span><span class="badge '+cls(i.kind)+'">'+esc(i.label)+(i.reason&&i.kind==='out'?' · '+esc(i.reason):'')+'</span></div>'+
      (i.note?'<div class="nt">'+esc(i.note.length>150?i.note.slice(0,147)+'...':i.note)+'</div>':'')+'</div>').join('');
    const more = list.length>limit ? '<button class="linkbtn" data-act="allinj" data-key="'+key+'">'+(S.allInj[key]?'Show fewer':'Show all '+list.length)+'</button>' : '';
    return '<div class="tm"><h4>'+esc(t.name)+'</h4>'+(rows||'<div class="small muted">Nothing reported.</div>')+more+'</div>';
  };
  return '<div class="sec"><h3>Injury report <span class="hint">ESPN, as of the last data refresh</span></h3><div class="inj">'+one('away')+one('home')+'</div></div>';
}

/* ---------- chart ---------- */
function chart(pl,st,pid){
  const W=340,H=170,pL=8,pR=8,pT=18,pB=30;
  const vals=st.vals, n=vals.length;
  const top=Math.max.apply(null,vals.concat([st.line,st.safeAdj||0,1]))*1.2;
  const iw=W-pL-pR, ih=H-pT-pB, bw=iw/n;
  const y=v=>pT+ih-(v/top)*ih;
  const selKey=pid+st.key; const sel = S.bar[selKey]!=null?S.bar[selKey]:n-1;
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(pl.name+' '+st.label+', last '+n+' games, oldest to newest: '+vals.join(', ')+'. Line '+st.line+(st.safeAdj!=null?', safe point '+st.safeAdj:''))+'">';
  [0.5,1].forEach(f=>{ const yy=y(top*f/1.2); s+='<line class="grid" x1="'+pL+'" x2="'+(W-pR)+'" y1="'+yy+'" y2="'+yy+'"/>'; });
  s+='<line class="grid" x1="'+pL+'" x2="'+(W-pR)+'" y1="'+y(0)+'" y2="'+y(0)+'"/>';
  vals.forEach((v,i)=>{
    const g=pl.games[i]||{}; const x=pL+i*bw+bw*0.14, w=bw*0.72, h=Math.max(1.5,(v/top)*ih);
    const cls=v>st.line?'over':'under';
    s+='<g data-act="bar" data-pid="'+pid+'" data-stat="'+st.key+'" data-i="'+i+'" style="cursor:pointer"><rect class="'+cls+(i===sel?' sel':'')+'" x="'+x+'" y="'+(y(0)-h)+'" width="'+w+'" height="'+h+'" rx="2"><title>'+esc((g.date?fmtDate(g.date)+' '+(g.home?'vs ':'@ ')+g.opp+': ':'')+v)+'</title></rect>'+
      '<rect x="'+(pL+i*bw)+'" y="'+pT+'" width="'+bw+'" height="'+(ih+pB-4)+'" fill="transparent"/>'+
      '<text class="val" x="'+(x+w/2)+'" y="'+(y(0)-h-3)+'" font-size="9.5" text-anchor="middle">'+v+'</text>'+
      '<text x="'+(x+w/2)+'" y="'+(H-14)+'" font-size="8" text-anchor="middle">'+esc(g.opp||'')+'</text>'+
      '<text x="'+(x+w/2)+'" y="'+(H-5)+'" font-size="7.5" text-anchor="middle">'+(g.home?'home':'away')+'</text></g>';
  });
  s+='<line class="bk" x1="'+pL+'" x2="'+(W-pR)+'" y1="'+y(st.line)+'" y2="'+y(st.line)+'"/>';
  s+='<text class="bkl" x="'+(W-pR)+'" y="'+(y(st.line)-3)+'" font-size="9" text-anchor="end">'+(st.lineSrc==='DraftKings'?'book ':'model ')+st.line+'</text>';
  if(st.safeAdj!=null){
    s+='<line class="sf" x1="'+pL+'" x2="'+(W-pR)+'" y1="'+y(st.safeAdj)+'" y2="'+y(st.safeAdj)+'"/>';
    const near=Math.abs(y(st.safeAdj)-y(st.line))<12;
    s+='<text class="sfl" x="'+pL+'" y="'+(y(st.safeAdj)+(near?11:-3))+'" font-size="9">safe '+st.safeAdj+'</text>';
  }
  s+='</svg>';
  const g=pl.games[sel]||{};
  const detail = g.date ? fmtDate(g.date)+' '+(g.home?'vs ':'@ ')+g.opp+(g.res?' ('+g.res+')':'')+(g.post?' · playoffs':'')+': '+vals[sel]+' '+st.label.toLowerCase() : '';
  return s+'<div class="small muted mono">'+esc(detail)+'</div>';
}
function gradeEl(g){ return '<span class="grade g-'+(/[A-F]/.test(g)?g:'x')+'">'+esc(g)+'</span>'; }

function playerCard(g,pl){
  const key=g.id+pl.id; const sk = S.pick[key]&&pl.stats.some(s=>s.key===S.pick[key]) ? S.pick[key] : pl.stats[0].key;
  const st=pl.stats.find(s=>s.key===sk);
  const kind=pl.status.kind; const bcls={ok:'ok',probable:'ok',questionable:'warn',dtd:'warn',doubtful:'bad',out:'bad',returning:'back'}[kind]||'';
  const dis = pl.avail===0;
  const hc = st.hot==='hot'?'<span class="badge hot" title="'+esc(st.hotNote)+'">Hot streak</span>':st.hot==='cold'?'<span class="badge cold" title="'+esc(st.hotNote)+'">Cold streak</span>':'<span class="badge">Steady</span>';
  const streak = st.streak>=2 ? st.streak+' straight '+(st.streakDir==='over'?'overs':'unders') : 'no run of 2+';
  const tabs = pl.stats.map(s=>'<button data-act="stat" data-key="'+key+'" data-stat="'+s.key+'" aria-pressed="'+(s.key===sk)+'">'+esc(s.label)+'</button>').join('');
  const tOver='p:'+g.id+':'+pl.id+':'+st.key+':over', tSafe='p:'+g.id+':'+pl.id+':'+st.key+':safe';
  const safeTxt = st.safe==null ? 'None (a zero in the window)' : (st.safeAdj!==st.safe ? st.safeAdj+'+ (raw '+st.safe+'+)' : st.safe+'+')+' · '+st.n+' of '+st.n;
  const alts = visMiles(st).map(m=>legBtn('p:'+g.id+':'+pl.id+':'+st.key+':m:'+m.t, m.t+'+', legSub('p:'+g.id+':'+pl.id+':'+st.key+':m:'+m.t)+' · '+m.hit+'/'+m.n, dis)).join('');
  const bookPrices = st.prices&&st.prices.length ? ' · DK prices '+st.prices.map(fo).join(' / ') : '';
  const notes=[];
  notes.push(esc(st.matchupNote));
  if(st.boost>0) notes.push('Teammate usage boost +'+Math.round(st.boost*100)+'% ('+esc(pl.boostNotes.join(', '))+')');
  if(st.anchorNote) notes.push('<span class="w">'+esc(st.anchorNote)+'</span>');
  pl.flags.forEach(f=>notes.push('<span class="w">'+esc(f)+'</span>'));
  if(pl.status.note && kind!=='ok') notes.push('<span class="w">'+esc(pl.status.label)+': '+esc(pl.status.note.length>170?pl.status.note.slice(0,167)+'...':pl.status.note)+'</span>');
  if(st.lineSrc!=='DraftKings') notes.push('No book line for this stat. The line shown is a model line from recent games.');
  return '<div class="pl" id="pl-'+key+'"><div class="pl-h"><div class="pl-n">'+esc(pl.name)+'<small>'+esc(pl.pos)+' · '+esc(pl.abbr)+(pl.jersey?' #'+esc(pl.jersey):'')+'</small></div>'+
    '<div class="badges"><span class="badge '+bcls+'">'+(kind==='ok'?'Active':esc(pl.status.label))+'</span></div></div>'+
    '<div class="tabs2" role="group" aria-label="Stat">'+tabs+'</div>'+
    chart(pl,st,pl.id)+
    '<div class="legend"><span><i style="background:var(--over)"></i>cleared the line</span><span><i style="background:var(--under)"></i>missed</span><span><i style="background:var(--ink);opacity:.7"></i>book line</span><span><i style="background:var(--safe)"></i>safe point</span></div>'+
    '<div class="mgrid">'+
      '<div class="kv"><div class="k">Line</div><div class="v">'+st.line+'</div><div class="s">'+(st.lineSrc==='DraftKings'?'DraftKings':'model')+bookPrices+'</div></div>'+
      '<div class="kv"><div class="k">Safe point</div><div class="v">'+(st.safeAdj!=null?st.safeAdj+'+':'none')+'</div><div class="s">'+esc(safeTxt)+'</div></div>'+
      '<div class="kv"><div class="k">Consistency</div><div class="v">'+gradeEl(st.grade)+'</div><div class="s">'+(st.gradePct!=null?st.gradePct+'% of games near his median':'small sample')+'</div></div>'+
      '<div class="kv"><div class="k">Form</div><div class="v" style="font-family:var(--f-body)">'+hc+'</div><div class="s">'+esc(st.hotNote)+'</div></div>'+
      '<div class="kv"><div class="k">Last '+st.n+' vs line</div><div class="v">'+st.overHits+'/'+st.n+' over</div><div class="s">'+streak+'</div></div>'+
      '<div class="kv"><div class="k">Projection</div><div class="v">'+st.proj+'</div><div class="s">avg '+st.avg+(st.season!=null&&st.season!==st.avg?' · season '+st.season:'')+' · lean '+esc(st.lean)+'</div></div>'+
    '</div>'+
    '<div class="btnrow">'+legBtn(tOver,'Over '+st.line,legSub(tOver),dis)+(st.safeAdj!=null?legBtn(tSafe,'Safe '+st.safeAdj+'+',legSub(tSafe),dis):'')+'</div>'+
    (alts?'<div class="small muted">Alternate lines (hit count is for the last '+st.n+')</div><div class="alt">'+alts+'</div>':'')+
    '<div class="pnotes">'+notes.map(x=>'<div>'+x+'</div>').join('')+'</div></div>';
}

function bestSafe(g){
  const arr=[];
  g.players.forEach(pl=>{ if(pl.avail===0) return; pl.stats.forEach(st=>{ if(st.safeAdj!=null && st.line>0) arr.push({pl,st,r:st.safeAdj/st.line}); }); });
  return arr.sort((a,b)=>b.r-a.r).slice(0,5);
}
function buildEight(g){
  const cands=[];
  g.players.forEach(pl=>{
    if(pl.avail<0.7) return;
    let best=null;
    pl.stats.forEach(st=>{
      if(st.safeAdj!=null && st.pSafe!=null && st.safeAdj/st.line>=0.4){ const sc=st.pSafe*Math.min(1,st.safeAdj/st.line); if(!best||sc>best.sc) best={tok:'p:'+g.id+':'+pl.id+':'+st.key+':safe',sc}; }
    });
    if(!best){
      pl.stats.forEach(st=>{ if(st.lean==='Over' && !st.anchorNote){ const sc=st.pOver*0.8; if(!best||sc>best.sc) best={tok:'p:'+g.id+':'+pl.id+':'+st.key+':over',sc}; } });
    }
    if(best) cands.push(Object.assign({pid:pl.id},best));
  });
  cands.sort((a,b)=>b.sc-a.sc);
  const pick=cands.slice(0,8);
  S.slip = S.slip.filter(l=>!(l.gid===g.id && l.pid));
  pick.forEach(c=>{ const leg=legFor(c.tok); if(leg){ const j=S.slip.findIndex(l=>l.group===leg.group); if(j>=0) S.slip.splice(j,1); S.slip.push(leg);} });
  return pick.length;
}

function drawer(g){
  const gl=(kind,side,title)=>{ const tok='g:'+g.id+':'+kind+':'+side; return legBtn(tok,title,legSub(tok)); };
  const a=g.teams.away,h=g.teams.home;
  const bs=bestSafe(g).map(x=>{ const tok='p:'+g.id+':'+x.pl.id+':'+x.st.key+':safe'; return '<button class="it" data-act="leg" data-tok="'+esc(tok)+'"><span><b>'+esc(surname(x.pl.name))+'</b> '+esc(x.st.label.toLowerCase())+' safe '+x.st.safeAdj+'+ <span class="muted">(line '+x.st.line+')</span></span><span class="mono">'+(inSlip(tok)?'added':fo(x.st.safePrice))+'</span></button>'; }).join('');
  const byTeam = side=>'<h4 class="sub">'+esc(g.teams[side].name)+'</h4>'+g.players.filter(p=>p.side===side).map(p=>playerCard(g,p)).join('');
  return '<div class="drawer"><div class="small muted">Lines and player numbers come from ESPN (DraftKings lines). Prices marked est. are my own estimates from the model, not sportsbook prices.</div>'+
    '<h4 class="sub">Game lines</h4><div class="legs">'+
      gl('ml','away',a.abbr+' moneyline')+gl('ml','home',h.abbr+' moneyline')+

      gl('tot','over','Over '+g.lines.total)+gl('tot','under','Under '+g.lines.total)+'</div>'+
    '<h4 class="sub">Highest safe points vs the line</h4><div class="safelist">'+(bs||'<div class="small muted">No player has a safe point in this window.</div>')+'</div>'+
    '<div class="btnrow"><button class="btn pri" data-act="build" data-gid="'+g.id+'">Build 8-player SGP</button><button class="btn" data-act="clear">Clear slip</button></div>'+
    byTeam('away')+byTeam('home')+'</div>';
}

function slipHtml(){
  const legs=S.slip;
  if(!legs.length) return '';
  const dec=legs.reduce((d,l)=>d*decOf(l.price),1);
  const pall=legs.reduce((p,l)=>p*l.p*l.avail,1);
  const am=amerOfDec(dec);
  const games=new Set(legs.map(l=>l.gid)).size;
  const body = S.slipOpen ? '<div class="slipbody">'+legs.map(l=>'<div class="sl"><span>'+esc(l.label)+' <span class="mono" style="opacity:.75">'+fo(l.price)+' '+(l.src==='est.'?'est.':'DK')+'</span></span><button class="x" data-act="rm" data-tok="'+esc(l.id)+'" aria-label="Remove '+esc(l.label)+'">Remove</button></div>').join('')+'</div>'+
    '<div class="slipnote">Estimated combined odds multiply each leg\'s price. Same-game legs are correlated, so a sportsbook will price this differently. The all-legs chance multiplies each leg\'s model probability (and the chance the player is active) as if legs were independent.'+(games>1?' These legs span '+games+' games, so this is a regular parlay.':'')+'</div>'+
    '<div class="btnrow"><button class="btn" data-act="clear">Clear slip</button></div>' : '';
  return '<div class="in"><button class="slipsum" data-act="slip" aria-expanded="'+S.slipOpen+'"><span class="a">Slip · '+legs.length+' leg'+(legs.length>1?'s':'')+'</span><span class="b">est. '+fo(am)+' · $10 pays $'+(10*dec).toFixed(2)+' · all hit ~'+(pall<0.01?'<1%':Math.round(pall*100)+'%')+'</span></button>'+body+'</div>';
}

function infoBlock(){
  return '<details class="how"><summary>How the numbers work</summary><div class="body">'+
    '<div><b>Safe point</b> is the highest number a player reached in every game of the window (the last 10 games, or every game played this season in the NFL). If he had a zero in that stretch, there is no safe point. When the matchup is tough or he is coming back from a missed game, a lower matchup-adjusted safe point is used. It is never raised.</div>'+
    '<div><b>Crossroads</b> rates each team\'s offense and defense from 0 to 100 using ESPN scoring numbers, then lowers a rating when key players are out or doubtful. It lines up each offense against the other side\'s defense, projects a score, and compares it with the book. A player\'s projection moves up to about 18% with the strength of the defense he faces, more for dominant players.</div>'+
    '<div><b>Injuries</b> come from the latest ESPN report. Out players cost their team points in proportion to how much of its production they carry, questionable players cost a share of that, and teammates of an absent player get a usage bump. Absences that began before a team\'s last game are already in its recent results, so they are not counted twice. Players who missed games and then returned are flagged. The per-player numbers are my estimates.</div>'+
    '<div><b>Consistency grade</b> (A to F) blends how many games landed close to the player\'s median with how far the games swing around his average. <b>Hot / cold</b> compares the last 3 games (the last game when fewer than 6 are available) with his earlier games.</div>'+
    '<div><b>Limits</b>: the NFL has only 3 games played, so a safe point there means 3 of 3. DraftKings publishes a price on both sides of a line but the feed does not say which is the Over, so Over and Safe prices marked est. are mine. Lines move, and this is a snapshot. Leans are model output, not advice, and past games do not guarantee the next one.</div>'+
  '</div></details>';
}

function render(){
  const gs = DATA.games.filter(g=>S.league==='all'||g.lg===S.league);
  const counts={all:DATA.games.length}; DATA.games.forEach(g=>{counts[g.lg]=(counts[g.lg]||0)+1;});
  const tabs=[['all','All'],['nfl','NFL'],['wnba','WNBA'],['mlb','MLB']].map(([k,l])=>'<button class="tab" data-act="league" data-k="'+k+'" aria-pressed="'+(S.league===k)+'">'+l+' '+(counts[k]||0)+'</button>').join('');
  $app.innerHTML = '<header class="top"><div class="brand"><h1>Line Scout</h1><span class="asof">Today\'s slate · data pulled '+esc(DATA.asOf)+' from ESPN</span></div><div class="tabs" role="group" aria-label="League">'+tabs+'</div>'+infoBlock()+'</header>'+
    gs.map(gameCard).join('')+
    '<div class="foot"><div>Source: ESPN game logs, standings, injury reports and DraftKings lines. This page is a static snapshot, so lines and injury news will change before game time.</div><div>For information only. Sports betting involves risk, so only stake what you can afford to lose.</div></div>';
  renderSlip();
}
function renderGame(gid){
  const el=document.getElementById('game-'+gid); if(!el){render();return;}
  const tmp=document.createElement('div'); tmp.innerHTML=gameCard(G[gid]); el.replaceWith(tmp.firstElementChild);
}
function renderSlip(){
  const h=slipHtml(); const el=document.getElementById('slip');
  el.innerHTML=h; el.hidden=!h;
}
function rerenderAll(){ // keep scroll
  const y=window.scrollY; DATA.games.forEach(g=>{ if(document.getElementById('game-'+g.id)) renderGame(g.id); }); renderSlip(); window.scrollTo(0,y);
}

const $app=document.getElementById('app');
document.addEventListener('click',function(e){
  const t=e.target.closest('[data-act]'); if(!t) return;
  const act=t.getAttribute('data-act');
  if(act==='league'){S.league=t.getAttribute('data-k');render();return;}
  if(act==='drawer'){const gid=t.getAttribute('data-gid');S.drawer[gid]=!S.drawer[gid];renderGame(gid);return;}
  if(act==='allinj'){const k=t.getAttribute('data-key');S.allInj[k]=!S.allInj[k];const gid=k.replace(/(away|home)$/,'');renderGame(gid);return;}
  if(act==='stat'){const key=t.getAttribute('data-key');S.pick[key]=t.getAttribute('data-stat');    // key = gameId + playerId; find the owning game
    const g=DATA.games.find(x=>key.indexOf(x.id)===0); renderGame(g.id);return;}
  if(act==='bar'){const pid=t.getAttribute('data-pid'),stt=t.getAttribute('data-stat'),i=+t.getAttribute('data-i');S.bar[pid+stt]=i;
    const g=DATA.games.find(x=>x.players.some(p=>p.id===pid)); const y=window.scrollY; renderGame(g.id); window.scrollTo(0,y); return;}
  if(act==='leg'){toggleLeg(t.getAttribute('data-tok'));const gid=t.getAttribute('data-tok').split(':')[1];const y=window.scrollY;renderGame(gid);renderSlip();window.scrollTo(0,y);return;}
  if(act==='rm'){toggleLeg(t.getAttribute('data-tok'));rerenderAll();return;}
  if(act==='clear'){S.slip=[];rerenderAll();return;}
  if(act==='slip'){S.slipOpen=!S.slipOpen;renderSlip();return;}
  if(act==='build'){const gid=t.getAttribute('data-gid');const n=buildEight(G[gid]);S.slipOpen=false;const y=window.scrollY;renderGame(gid);renderSlip();window.scrollTo(0,y);return;}
});
render();
})();
</script>
