/* ---------- broadcaster-style callouts ---------- */
const ABAL={CLV:'CLE',JAC:'JAX',WAS:'WSH',LVR:'LV',ARZ:'ARI',BLT:'BAL',HST:'HOU',SD:'LAC',STL:'LAR',OAK:'LV'};
function penTeam(g,tx){ const m=String(tx||'').match(/penalty on ([A-Z]{2,4})/i); if(!m) return ''; let ab=m[1].toUpperCase(); ab=ABAL[ab]||ab; return ab===g.teams.away.abbr?'a':ab===g.teams.home.abbr?'h':''; }

const lastName=n=>String(n||'').replace(/^[A-Z]\.\s?/,'').trim();
function cleanTx(tx){ return String(tx||'').replace(/\([^)]*\)/g,' ').replace(/\bto\s+([A-Z]{2,4})\s+(\d+)/g,'to the $1 $2').replace(/\s+/g,' ').trim(); }
function teamName(g,abbr){ abbr=(typeof ABAL!=='undefined'&&ABAL[abbr])||abbr; const a=g.teams.away,h=g.teams.home; return abbr===a.abbr?a.short:abbr===h.abbr?h.short:abbr||''; }
function scoreLine(g,p){ const a=g.teams.away,h=g.teams.home; if(p['as']==null||p.hs==null) return ''; return ' '+a.short+' '+p['as']+', '+h.short+' '+p.hs+'.'; }
function nflCall(g,p){
  const f=nflFlags(p), tx=String(p.tx||''); const y=+p.y; const ay=Math.abs(isNaN(y)?0:y);
  const qb=lastName(nflName(tx,'qb')), rec=lastName(nflName(tx,'to'));
  const fd=/\b1st down\b|first down/i.test(tx); const team=teamName(g,p.tm);
  const yd=n=>n+' yard'+(n===1?'':'s');
  if(/timeout/i.test(p.ty||tx)){ const tb=(tx.match(/by ([A-Z]{2,4})/)||[])[1]; return /official|two-minute|2-minute/i.test((p.ty||'')+tx)?'Official timeout.':'Timeout, '+(tb?teamName(g,tb):team)+'.'; }
  if(f.ko){ if(/touchback/i.test(tx)) return 'Kickoff, touchback.'; const m=tx.match(/(?:returned|return)\s+by\s+([A-Za-z.'\-\s]+?)\s+for\s+(\d+)/i)||tx.match(/\.\s*[A-Z]\.[A-Za-z'\-]+\s+to\s+[A-Z]{2,4}\s+\d+\s+for\s+(\d+)\s+yards?/i)&&[0,tx.match(/\.\s*([A-Z]\.[A-Za-z'\-]+)\s+to\s+[A-Z]{2,4}\s+\d+\s+for/)[1],tx.match(/\.\s*[A-Z]\.[A-Za-z'\-]+\s+to\s+[A-Z]{2,4}\s+\d+\s+for\s+(\d+)/)[1]]; if(p.sc) return 'Kickoff returned all the way back for a touchdown!'+scoreLine(g,p); return m?'Kickoff, returned by '+lastName(m[1])+' for '+yd(+m[2])+'.':'Kickoff.'; }
  if(f.punt){ const m=tx.match(/punts\s+(\d+)/i); return m?team+' punt, '+yd(+m[1])+'.':team+' punt.'; }
  if(f.fg) return (p.sc&&!f.miss)?'The field goal is good!'+scoreLine(g,p):'The kick is no good.';
  if(f.xp) return p.sc?'The extra point is good.'+scoreLine(g,p):'No good on the try.';
  if(f.td){ const who=rec||lastName(nflName(tx,'qb')); const how=f.pass?(qb&&rec?qb+' finds '+rec+' for a '+yd(ay)+' touchdown!':'Touchdown, '+team+'!'):(who?who+' runs it in from '+yd(ay)+'! Touchdown!':'Touchdown, '+team+'!'); return how+scoreLine(g,p); }
  if(f.int) return 'Intercepted! '+team+' turn it over.';
  if(f.fum) return 'Fumble! The ball is loose, and it is a turnover.';
  if(f.sack){ return (qb?qb:'The quarterback')+' is sacked'+(ay?' for a loss of '+yd(ay):'')+'.'; }
  if(f.pass&&f.inc) return rec?qb?qb+' throws incomplete, intended for '+rec+'.':'Incomplete, intended for '+rec+'.':'Pass incomplete.';
  if(f.pass){ const who=rec||'the receiver'; return (qb?qb+' to ':'')+who+', '+yd(ay)+(y<0?' loss':'')+'.'+(ay>=10?' What a catch!':'')+(fd?' First down.':''); }
  if(f.run){ const who=lastName(nflName(tx,'qb')); if(!y) return (who?who+' is stopped for no gain.':'Stopped for no gain.'); return (who?who+' ':'Run ')+(y<0?'loses '+yd(ay)+'.':'carries for '+yd(ay)+'.')+(ay>=10?' Nice burst.':'')+(fd?' First down.':''); }
  if(f.pen){ const pm=tx.match(/penalty on ([A-Z]{2,4})-?([A-Za-z.'\-]*),\s*([^,]+?),\s*(\d+) yards?/i); if(pm){ const pt=penTeam(g,tx); const nm=pt==='a'?g.teams.away.short:pt==='h'?g.teams.home.short:pm[1]; return 'Flag on the play. '+nm+' penalized, '+pm[3].toLowerCase()+', '+pm[4]+' yards.'; } const t=cleanTx(tx); return 'Flag on the play. '+t.slice(0,110); }
  return cleanTx(tx).slice(0,120);
}
function otherCall(g,p){
  const t=cleanTx(p.tx); if(!t) return '';
  if(g.lg==='mlb'){ if(/^(ball|strike|foul|pitch)\b/i.test(t)&&!p.sc) return ''; if(!/struck out|strikes out|grounds|flies|lines|pops|single|double|triple|homer|walk|hit by pitch|out at|scores|steal|stole|double play|reaches|fouled out|sacrifice|lined|fanned/i.test(t)) return ''; }
  if(g.lg==='wnba'){ if(!p.sc&&!/block|steal|turnover|foul/i.test(t)) return ''; }
  if(g.lg==='nhl'){ if(!p.sc&&!/save|penalty|hit|block/i.test(t)) return ''; }
  return t.slice(0,130);
}
/* called when a play starts in big screen mode: voice, effects, pace */
function announce(g,p,backlog){
  if(!SND.on||FSV.gid!==g.id) return 0; sndCtx();
  const isTO=/timeout|two-minute warning|2-minute warning/i.test((p.ty||'')+' '+(p.tx||''));
  if(isTO){ musicStart('to'); sfx('whistle',0); } else if(MUS.on&&MUS.kind==='to') musicStop();
  let text=''; const f=g.lg==='nfl'?nflFlags(p):null;
  if(g.lg==='nfl'){
    text=nflCall(g,p); const y=+p.y;
    if(f.ko){ sfx('whistle',0); sfx('kick',350); if(p.sc) sfx('crowd',1800,true); }
    else if(f.punt||f.fg||f.xp){ sfx('kick',0); if(p.sc&&!f.miss) sfx('crowd',1100,f.fg); }
    else if(f.sack){ sfx('sack',650); sfx('whistle',1100); }
    else if(f.pass&&f.inc){ sfx('throw',0); sfx('groan',900); }
    else if(f.pass){ sfx('throw',0); const d1=(y>5?900:380); sfx('catch',d1); sfx('tackle',d1+Math.min(1200,300+Math.abs(y)*24)); if(+y>=10&&!p.sc) sfx('big',d1+100); sfx('whistle',d1+Math.min(1400,500+Math.abs(y)*24)); }
    else if(f.run){ sfx('rush',0); sfx('tackle',Math.min(1500,520+Math.abs(y||0)*30)); sfx('whistle',Math.min(1700,720+Math.abs(y||0)*30)); }
    else if(f.pen){ sfx('whistle2',0); const pt=penTeam(g,p.tx); if(pt==='a') sfx('boo',900); else if(pt==='h') sfx('cheer',900); }
    if(f.td) sfx('crowd',900,true);
    if(f.int||/fumble/i.test(p.tx||'')&&p.to){ sfx('groan',300); }
  } else {
    text=otherCall(g,p);
    if(g.lg==='mlb'){ if(/single|double|triple|homer/i.test(p.tx||'')) sfx('crack',0); if(p.sc) sfx('crowd',400,/homer/i.test(p.tx||'')); }
    else if(g.lg==='wnba'){ if(p.sc) { sfx('swish',0); sfx('crowd',250,false); } }
    else if(g.lg==='nhl'){ if(p.sc){ sfx('horn',0); sfx('crowd',300,true); } else if(p.sh) sfx('crack',0); }
  }
  if(!text||backlog>10) return 0;
  const hi=!!p.sc;
  if(backlog>5&&!hi&&!(g.lg==='nfl'&&+p.y>=10)) return 0;
  return say(text,hi);
}

const SGPT={
  nfl:[['py','pass yds',[200,250,300],1],['ry','rush yds',[50,75,100],1.1],['ly','rec yds',[50,75,100],1.1],['rec','rec',[4,6,8],0.9]],
  wnba:[['pts','pts',[10,15,20,25],1],['reb','reb',[5,7,9],1.1],['ast','ast',[4,6,8],1.1],['fg3','3PM',[2,3,4],1.2]],
  mlb:[['h','hits',[1,2,3],1],['rbi','RBI',[1,2,3],1.1],['hr','HR',[1],2.5],['r','runs',[1,2],0.8],['k','K',[5,7,9],1.1]]
};
function sgpLegs(g){
  const rows=PASTP[g.id]; if(!rows||!rows.length) return null;
  const best={};
  rows.forEach(p=>{
    (SGPT[g.lg]||[]).forEach(([k,lab,tiers,w])=>{
      const v=p[k]; if(v==null) return; let idx=-1; tiers.forEach((t,i)=>{ if(v>=t) idx=i; }); if(idx<0) return;
      if(g.lg==='mlb'&&k==='k'&&p.outs!=null&&p.outs<9) return;
      const sc=(idx+1)*w+(tiers.length>1?idx*0.25:0);
      const o=best[p.i]; if(!o||sc>o.sc) best[p.i]={sc,p,txt:tiers[idx]+'+ '+lab,had:v,k};
    });
    if(g.lg==='nfl'){ const td=(p.rtd||0)+(p.ltd||0); if(td>=1){ const sc=2.2; const o=best[p.i]; if(!o||sc>o.sc) best[p.i]={sc,p,txt:'anytime TD',had:td+' TD',k:'td'}; } }
  });
  const list=Object.keys(best).map(k=>best[k]).sort((a,b)=>b.sc-a.sc);
  if(list.length<2) return null;
  return {legs:list.slice(0,4),more:list.slice(4,7)};
}
function sgpRecapHtml(g){
  const r=sgpLegs(g); if(!r) return '';
  const chip=o=>'<span class="vc ok" title="Had '+esc(String(o.had))+'">✓ '+esc(o.p.n)+' '+esc(o.txt)+' <span class="muted">('+esc(String(o.had))+')</span></span>';
  return '<div class="sgpr"><div class="small"><b>Player SGP that hit</b> <span class="muted">'+r.legs.length+' legs, '+esc(g.away)+' @ '+esc(g.home)+'</span></div><div class="vcs">'+r.legs.map(chip).join('')+'</div>'+
    (r.more.length?'<div class="small muted">Also cleared: '+r.more.map(o=>esc(o.p.n)+' '+esc(o.txt)).join(' · ')+'</div>':'')+'</div>';
}

const LN_DEF={nfl:32,wnba:15,mlb:30,nhl:32};
const lnOf=lg=>((LEARN.leagues[lg]||{}).nTeams)||LN_DEF[lg]||30;
const LGN={nfl:'NFL',wnba:'WNBA',mlb:'MLB',nba:'NBA',cfb:'College football',cbb:'College basketball',nhl:'NHL',tennis:'Tennis'};
const LGT=[['all','All'],['nfl','NFL'],['cfb','CFB'],['nba','NBA'],['cbb','CBB'],['wnba','WNBA'],['mlb','MLB'],['nhl','NHL'],['tennis','Tennis']];
const keyOf=g=>g.key||g.lg;
function fmtLine(x){ return x==null?'n/a':(x>0?'+'+x:String(x)); }
function chipOk(label,ok,tip){ const cls=ok===true?'ok':ok===false?'bad':''; return '<span class="vc '+cls+'" title="'+esc(tip||'')+'">'+(ok===true?'✓ ':ok===false?'✗ ':'– ')+esc(label)+'</span>'; }
function dayTally(games){
  const t={ml:[0,0],spr:[0,0],tot:[0,0],mll:[0,0],close:[0,0],ups:[0,0],upf:[0,0]};
  games.forEach(g=>{
    const v=g.v; t.ml[1]++; if(v.ml.ok) t.ml[0]++;
    if(v.spr&&v.spr.ok!==null){ t.spr[1]++; if(v.spr.ok) t.spr[0]++; }
    if(v.tot&&v.tot.ok!==null){ t.tot[1]++; if(v.tot.ok) t.tot[0]++; }
    if(v.mlLean){ t.mll[1]++; if(v.mlLean.ok) t.mll[0]++; }
    if(v.close.called){ t.close[1]++; if(v.close.actual) t.close[0]++; }
    const homeFav=g.pH>=0.5; const underWon=homeFav?(g.hs<g.as_):(g.hs>g.as_);
    if(underWon){ t.ups[0]++; if(Math.min(g.pH,1-g.pH)>=0.35) t.upf[0]++; }
    t.ups[1]++;
  });
  return t;
}
function tallyHtml(t){
  const row=(lab,a)=>'<div class="kv"><div class="k">'+lab+'</div><div class="v">'+a[0]+'/'+a[1]+'</div></div>';
  return '<div class="proj">'+row('Winner picks',t.ml)+(t.spr[1]?row('Spread leans',t.spr):'')+(t.tot[1]?row('Total leans',t.tot):'')+(t.mll[1]?row('ML leans',t.mll):'')+(t.close[1]?row('Close-game calls',t.close):'')+
    '<div class="kv"><div class="k">Upsets</div><div class="v">'+t.ups[0]+' of '+t.ups[1]+'</div><div class="s">flagged ahead (35%+): '+t.upf[0]+'</div></div></div>';
}
function reportGame(g){
  const hn=g.home, an=g.away; const win=g.hs>g.as_?hn:an; const margin=Math.abs(g.hs-g.as_);
  const v=g.v; const N=lnOf(g.lg); const chips=[];
  chips.push(chipOk('Pick '+v.ml.pick+' '+Math.round(v.ml.p*100)+'%',v.ml.ok,'Moneyline pick from the blended win chance'));
  if(v.spr) chips.push(chipOk('Spread lean '+v.spr.pick+' '+fmtLine(v.spr.line),v.spr.ok,'Model margin differed from the closing line by '+v.spr.gap));
  if(v.tot) chips.push(chipOk('Total lean '+v.tot.pick+' '+v.tot.line,v.tot.ok,'Model total differed from the line by '+v.tot.gap));
  if(v.mlLean) chips.push(chipOk('ML lean '+v.mlLean.pick,v.mlLean.ok,'Model chance beat the book by '+Math.round(v.mlLean.gap*100)+' points'));
  if(v.close.called) chips.push(chipOk('Called close',v.close.actual,'Final margin '+v.close.margin));
  const homeFav=g.pH>=0.5, underWon=homeFav?(g.hs<g.as_):(g.hs>g.as_), pu=Math.min(g.pH,1-g.pH);
  if(underWon) chips.push(chipOk('Upset '+Math.round(pu*100)+'% chance',pu>=0.35,'Underdog won. Flagged ahead of time when the chance was 35% or more.'));
  const rk=g.rk||{}; const hr=rk.home, ar=rk.away;
  const why=(hr&&ar)?'As of that day: '+an+' offense #'+ar[0]+'/'+N+', defense #'+ar[1]+'. '+hn+' offense #'+hr[0]+', defense #'+hr[1]+'. '+(g.mt?'Model total '+g.ft+(g.book&&g.book.total?' (book '+g.book.total+')':'')+', actual '+(g.hs+g.as_)+'.':''):'';
  return '<div class="rg"><div class="rgh"><b>'+esc(an)+' @ '+esc(hn)+'</b><span class="mono">'+g.as_+'–'+g.hs+'</span><span class="badge">'+g.lg.toUpperCase()+'</span></div>'+
    '<div class="small muted">Model: '+esc(hn)+' '+sg(-g.fm)+' · '+Math.round(g.pH*100)+'% '+esc(hn)+(g.book?' · book '+(g.book.spr!=null?esc(hn)+' '+fmtLine(g.book.spr)+', ':'')+(g.book.total?'O/U '+g.book.total:''):'')+' · result: '+esc(win)+' by '+margin+'</div>'+
    '<div class="vcs">'+chips.join('')+'</div>'+(why?'<div class="small muted">'+esc(why)+'</div>':'')+sgpRecapHtml(g)+'</div>';
}

      '<div class="proj"><div class="kv"><div class="k">Picks winners</div><div class="v">'+pc(s.accFinal)+'</div><div class="s">book alone '+pc(s.accBook)+(s.n?' · '+s.n+' games':'')+'</div></div>'+

      '<div class="kv"><div class="k">Total error</div><div class="v">'+(s.maeFinalT!=null?n1(s.maeFinalT):'n/a')+'</div><div class="s">book '+(s.maeBookT!=null?n1(s.maeBookT):'n/a')+'</div></div></div>'+
      '<div class="small muted">Weight on the model vs the book: margin '+(x.blend.m==null?'n/a':Math.round(x.blend.m*100)+'%')+', total '+(x.blend.t==null?'n/a':Math.round(x.blend.t*100)+'%')+', win chance '+(x.blend.p==null?'n/a':Math.round(x.blend.p*100)+'%')+' (fitted on past games, never below 15%). Tuning changed the squared error from '+x.mse0+' to '+x.mse1+'.</div>'+
      (leans?'<div class="small muted">Lean record vs the closing line: '+esc(leans)+'. Lean types under 52% over 50+ games are switched off.</div>':'')+
      (mon_?'<div class="mos" role="img" aria-label="Winner-pick accuracy by month">'+mon_+'</div>':'')+'</div>';
  }).join('');

  return '<section class="game"><div class="sec"><h3>How the model learns <button class="linkbtn" data-act="learn">'+(open?'Hide':'Show')+'</button></h3>'+(open?

    liveRecordHtml()+
    '<div class="small muted">What it can and cannot do: the model is rated against the closing line over past games, and it does not call upsets reliably; the book was about as accurate as the model across the season. The honest goal is calibrated chances, not certainty.</div>'
    :'<div class="small muted">Accuracy against the closing line, lean records, and how much weight the model gets.</div>')+'</div></section>';
}

  const row=(t,side)=>{
    const sp=side==='home'?L.sprHome:L.sprAway, pr=side==='home'?L.prHome:L.prAway, ml=side==='home'?L.mlHome:L.mlAway;
    const tot=side==='away'?'O '+L.total:'U '+L.total, tp=side==='away'?L.over:L.under;
    return '<div class="orow"><div class="team">'+chipOf(t)+'<div class="tn"><div class="n">'+esc(t.short)+'</div><div class="r">'+esc(t.record)+(side==='away'?' · away':' · home')+'</div></div></div>'+

/* ---------- sportsbook comparison (data/odds.json, written by the bot from the SportsGameOdds key) ---------- */
const BK_NAME={draftkings:'DraftKings',fanduel:'FanDuel',betmgm:'BetMGM',caesars:'Caesars',espnbet:'ESPN BET',bovada:'Bovada',pointsbet:'PointsBet',unibet:'Unibet',williamhill:'William Hill',fanatics:'Fanatics',betrivers:'BetRivers',hardrock:'Hard Rock',betonline:'BetOnline',mybookie:'MyBookie',fliff:'Fliff',prizepicks:'PrizePicks',underdog:'Underdog'};
const BK_LG={nfl:'NFL',nba:'NBA',mlb:'MLB',cfb:'NCAAF',cbb:'NCAAB',wnba:'WNBA',nhl:'NHL'};
/* team names: lower case, no accents, a trailing "St" is "State" ("Florida St" = "Florida State"), letters and digits only */
const bkNorm=s=>{ let x=String(s||''); try{ x=x.normalize('NFD').replace(/[\u0300-\u036f]/g,''); }catch(e){} return x.toLowerCase().trim().replace(/\bst\.?$/,'state').replace(/[^a-z0-9]/g,''); };
/* does the odds feed's home/away side match this team? The feed often has no short code and names colleges without the mascot ("Louisville"),
   so compare its name with the slate team's full name, short name and location, and its code with the slate abbreviation */
function bkTeamEq(e,side,t){ if(!t||!e) return false; const ab=bkNorm(e[side]), nm=bkNorm(e[side+'Name']);
  if(ab&&ab===bkNorm(t.abbr)) return true;
  if(!nm) return false; return nm===bkNorm(t.name)||nm===bkNorm(t.short)||(!!t.loc&&nm===bkNorm(t.loc)); }
function bkEvent(g){
  try{ const O=window.__LSDATA&&window.__LSDATA.odds; if(!O||!Array.isArray(O.events)) return null;
    if(g.oddsId) return O.events.find(e=>e.id===g.oddsId)||null;     /* tennis cards come from the feed itself */
    const lg=BK_LG[g.key||g.lg]; const gt=Date.parse(g.iso);
    return O.events.find(e=>{ if(lg&&e.league!==lg) return false; const st=Date.parse(e.start); if(isFinite(gt)&&isFinite(st)&&Math.abs(st-gt)>30*3600e3) return false;
      return bkTeamEq(e,'home',g.teams.home)&&bkTeamEq(e,'away',g.teams.away); })||null;
  }catch(e){ return null; }
}
/* the odds feed gives BetMGM and Caesars links for ONE state (New Jersey). Those pages do not open from anywhere else, so the state is swapped for yours */
const BK_STATES=[['az','Arizona'],['co','Colorado'],['ct','Connecticut'],['dc','Washington DC'],['ia','Iowa'],['il','Illinois'],['in','Indiana'],['ks','Kansas'],['ky','Kentucky'],['la','Louisiana'],['ma','Massachusetts'],['md','Maryland'],['mi','Michigan'],['nc','North Carolina'],['nh','New Hampshire'],['nj','New Jersey'],['ny','New York'],['oh','Ohio'],['pa','Pennsylvania'],['tn','Tennessee'],['va','Virginia'],['vt','Vermont'],['wv','West Virginia'],['wy','Wyoming']];
function bkState(){ let s=''; try{ s=localStorage.getItem('ls_state')||''; }catch(e){} if(!s){ try{ const tz=(Intl.DateTimeFormat().resolvedOptions()||{}).timeZone||''; if(tz==='America/Detroit') s='mi'; }catch(e){} } return BK_STATES.some(x=>x[0]===s)?s:''; }
function bkSetState(v){ try{ localStorage.setItem('ls_state',v||''); }catch(e){} }
function bkRegion(u){ const st=bkState(); if(!st||typeof u!=='string') return u;
  return u.replace(/(\/\/sports\.)[a-z]{2}(\.betmgm\.com)/i,'$1'+st+'$2').replace(/(sportsbook\.caesars\.com\/us\/)[a-z]{2}(\/)/i,'$1'+st+'$2'); }
function bkBlock(g){
  const e=bkEvent(g); if(!e||!e.main) return '';
  const M=e.main, names={}; ['ml','spread','total'].forEach(k=>Object.keys(M[k]||{}).forEach(s=>Object.keys(M[k][s].books||{}).forEach(b=>{ names[b]=1; })));
  const books=Object.keys(names).sort((x,y)=>(BK_NAME[x]||x).localeCompare(BK_NAME[y]||y)); if(!books.length) return '';
  const cell=(k,s,b,withLine)=>{ const x=M[k]&&M[k][s]&&M[k][s].books&&M[k][s].books[b]; if(!x) return '<td class="mono muted">–</td>';
    const ln=withLine&&x.line!=null?(k==='total'?(s==='over'?'O ':'U ')+x.line:sg(x.line))+' ':''; return '<td class="mono">'+ln+fo(x.odds)+'</td>'; };
  const link=b=>{ const l=bkRegion((e.eventLinks||{})[b]||''); const name=esc(BK_NAME[b]||b); return /^https:\/\//.test(l)?'<a href="'+esc(l)+'" target="_blank" rel="noopener noreferrer">'+name+'</a>':name; };
  const rows=books.map(b=>'<tr><td class="bkn">'+link(b)+'</td>'+cell('ml','away',b)+cell('ml','home',b)+cell('spread','away',b,1)+cell('spread','home',b,1)+cell('total','over',b,1)+cell('total','under',b,1)+'</tr>').join('');
  const when=window.__LSDATA.odds.generatedAt?new Date(window.__LSDATA.odds.generatedAt):null;
  return '<details class="bkbox"><summary>Sportsbook lines <span class="muted small">'+books.length+' books'+(when&&isFinite(when)?' · '+Math.max(0,Math.round((Date.now()-when)/60000))+' min old':'')+'</span></summary><div class="xscroll"><table class="bkt"><thead><tr><th>Book</th><th>'+esc(g.teams.away.abbr)+' ML</th><th>'+esc(g.teams.home.abbr)+' ML</th><th>'+esc(g.teams.away.abbr)+' spread</th><th>'+esc(g.teams.home.abbr)+' spread</th><th>Over</th><th>Under</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="small muted">Real sportsbook prices for comparison only. Practice coins only: this page cannot place a bet.</div></details>';
}
function linesTable(g){ return oddsGrid(g)+bkBlock(g); }

/* ================= safe slips, pick of the day, tracked calls, self-check ================= */
const POTD_P=0.80, POTD_PRICE=-140, MIN_SAFE=0.55, KEEP_DAYS=24, MAX_CALLS=700, MAX_LIVE_PER_GAME=8;

/* ---------- helpers ---------- */
const wallStarted=g=>{ const t=Date.parse(g.iso||''); return isFinite(t)&&Date.now()>=t-120000; };

/* ---------- self-check: how well did past calls do, and how much to trust new ones ---------- */
let CALV=0;
function legsGraded(kinds){
  const out=[]; P.calls.forEach(c=>{ if(kinds&&kinds.indexOf(c.kind)<0) return; (c.legs||[]).forEach(l=>{ if(l.res==='W'||l.res==='L') out.push({l:l,c:c}); }); });
  return out;
}
function calStats(){
  const r={}; ['prop','team'].forEach(k=>{
    const xs=legsGraded().filter(o=>legKind(o.l)===k&&o.c.kind!=='live'&&o.l.p>=0.5);
    const n=xs.length, said=n?xs.reduce((s,o)=>s+o.l.p,0)/n:0, got=n?xs.filter(o=>o.l.res==='W').length/n:0;
    let f=1; if(n>=25&&said>0) f=clamp(got/said,0.6,1.05);

  });

}
let CAL=calStats(), CALSIG='';
function calSigOf(c){ return ['prop','team'].map(k=>c[k].n+':'+c[k].f.toFixed(3)).join('|'); }
function calRefresh(){ CAL=calStats(); const g=calSigOf(CAL); if(g!==CALSIG){ CALSIG=g; CALV++; } }
function adjP(p,kind){ const c=CAL[kind]; return c&&c.n>=25?clamp(p*c.f,0.01,0.99):p; }

/* ---------- enumerate the pregame legs of a game ---------- */
function preToks(g){
  const out=[], L=g.lines||{};
  if(L.mlHome!=null&&L.mlAway!=null) ['home','away'].forEach(s=>out.push('g:'+g.id+':ml:'+s));
  if(L.sprHome!=null&&L.prHome!=null) ['home','away'].forEach(s=>out.push('g:'+g.id+':spr:'+s));
  if(L.total!=null&&L.over!=null) ['over','under'].forEach(d=>out.push('g:'+g.id+':tot:'+d));
  (g.players||[]).forEach(pl=>{
    if(pl.status&&pl.status.kind==='out') return;
    (pl.stats||[]).forEach(st=>{
      if(st.safeAdj!=null&&st.pSafe!=null) out.push('p:'+g.id+':'+pl.id+':'+st.key+':safe');
      (st.miles||[]).forEach(m=>out.push('p:'+g.id+':'+pl.id+':'+st.key+':m:'+m.t));

}
function preLegs(g){
  const seen={}, out=[];
  preToks(g).forEach(t=>{
    const l=legFor(t); if(!l||l.price==null||!isFinite(l.price)||!l.spec) return;
    if(seen[l.label]) return; seen[l.label]=1;
    l.ps=adjP(clamp(l.p*(l.avail==null?1:l.avail),0,0.99),legKind(l)); out.push(l);

/* ---------- safe 2 / 4 / 8 ---------- */
const SAFE_CACHE={};
function safeSlip(g,n,legs){
  const pick=[], grp={}, per={}; let side=null;
  for(const l of legs){
    if(pick.length>=n) break; if(l.ps<MIN_SAFE) break;
    if(grp[l.group]) continue;
    const k=l.spec.k;
    if(k==='prop'){ if((per[l.pid]||0)>=2) continue; }
    else if(k==='ml'||k==='spr'){ if(side&&side!==l.spec.side) continue; }
    pick.push(l); grp[l.group]=1;
    if(k==='prop') per[l.pid]=(per[l.pid]||0)+1; else if(k!=='tot') side=l.spec.side;
  }
  const dec=pick.reduce((d,l)=>d*decOf(l.price),1), pAll=pick.reduce((p,l)=>p*l.ps,1);
  return {n:n,legs:pick,dec:dec,pAll:pAll,short:pick.length<n};
}
function safeAll(g){
  const key=g.id+':'+CALV; if(SAFE_CACHE[key]) return SAFE_CACHE[key];
  const legs=preLegs(g).sort((a,b)=>b.ps-a.ps||decOf(b.price)-decOf(a.price));
  const r={2:safeSlip(g,2,legs),4:safeSlip(g,4,legs),8:safeSlip(g,8,legs)};
  Object.keys(SAFE_CACHE).forEach(k=>{ if(k.indexOf(g.id+':')===0) delete SAFE_CACHE[k]; });
  SAFE_CACHE[key]=r; return r;
}
function slipIsSafe(g,n){
  const s=safeAll(g)[n]; if(!s.legs.length||S.slip.length!==s.legs.length) return false;
  const ids={}; S.slip.forEach(l=>ids[l.id]=1); return s.legs.every(l=>ids[l.id]);
}

    :'No player props are published for this league, so only the game lines can be used; slips are capped at the lines that clear '+Math.round(MIN_SAFE*100)+'%.';
  const shown=[2,4,8].map(n=>all[n]).filter(s=>s.legs.length);

/* ---------- pick of the day, per sport ---------- */
function potdFor(key){
  const gs=DATA.games.filter(g=>keyOf(g)===key&&preOK(g)); if(!gs.length) return null;
  let best=null, near=null;
  gs.forEach(g=>{
    preLegs(g).forEach(l=>{
      if(l.src!=='DraftKings') return;                      // price must be a real book price, not the model's own
      const ev=l.ps*decOf(l.price)-1; const o={g:g,l:l,ev:ev};
      if(l.ps>=POTD_P&&l.price>=POTD_PRICE){ if(!best||ev>best.ev) best=o; }
      else if(l.ps>=0.7&&l.price>=-200){ if(!near||ev>near.ev) near=o; }
    });
  });
  return {key:key,best:best,near:near,games:gs.length};
}
function potdRecord(key){
  const cs=P.calls.filter(c=>c.kind==='potd'&&c.key===key&&c.status!=='pending'&&c.status!=='void');

        const parts={}; (pl.participants||[]).forEach(pa=>{ if(pa.athlete) parts[pa.type]=pa.athlete.id; });
        const per=pl.period||{}, rc=pl.resultCount||{};
        plays.push({i:pl.id,q:per.number,h:per.type,tx:(pl.text||'').trim(),ty:(pl.type||{}).text||'',sc:!!pl.scoringPlay,v:pl.scoreValue||0,
          pt:(pl.pitchCoordinate?[pl.pitchCoordinate.x,pl.pitchCoordinate.y]:null),pv:pl.pitchVelocity,pk:(pl.pitchType||{}).abbreviation,
          hc:(pl.hitCoordinate?[pl.hitCoordinate.x,pl.hitCoordinate.y]:null),ct:[rc.balls,rc.strikes],o:pl.outs,bt:parts.batter,pi:parts.pitcher,ab:pl.atBatId,hs:sToi(pl.homeScore),as:sToi(pl.awayScore)});
      });
    }
    doc.plays=plays;
    doc.ts=sTeamStats(lg,s,home,away);
    doc.nm={};
    if(lg==='mlb'){ Object.keys(nm).forEach(k=>{ if(plays.some(pp=>pp.bt===k||pp.pi===k)) doc.nm[k]=nm[k]; }); }
    doc.ab={home:home.team.abbreviation,away:away.team.abbreviation};
    if(lg==='nfl'){ doc.sit={dn:sit.downDistanceText||'',sdn:sit.shortDownDistanceText||'',poss:ab[String(sit.possession)]||'',rz:!!sit.isRedZone,lp:((sit.lastPlay||{}).text||'').slice(0,160)}; }
    else if(lg==='mlb'){ doc.sit={b:sit.balls||0,s:sit.strikes||0,o:sit.outs||0,on:[!!sit.onFirst,!!sit.onSecond,!!sit.onThird],bat:(((sit.batter||{}).athlete)||{}).shortName||'',pit:(((sit.pitcher||{}).athlete)||{}).shortName||''}; }
    else doc.sit={};
    let wp=(s.winprobability||[]).filter(x=>'homeWinPercentage' in x).map(x=>Math.round(1000*x.homeWinPercentage)/10);
    if(wp.length>90){ const step=wp.length/90; const w2=[]; for(let i=0;i<90;i++) w2.push(wp[Math.floor(i*step)]); w2.push(wp[wp.length-1]); wp=w2; }
    doc.wp=wp;
    return doc;
  });
}

/* ---- tennis: ESPN's tennis scoreboards (ATP + WTA). The match is found by the players' surnames; games won are added up over all sets.
   If the match is not on the boards (or the feed shape is different) nothing is returned and the practice bets on it simply stay pending. ---- */
function tnSur(s){ const w=String(s||'').toLowerCase().replace(/[^a-z ]/g,' ').split(/\s+/).filter(Boolean); return w.length?w[w.length-1]:''; }
function tennisBuild(gid){
  const g=G[gid]; if(!g) return Promise.resolve(null);
  const hs_=tnSur(g.teams.home.name), as_=tnSur(g.teams.away.name); if(!hs_||!as_) return Promise.resolve(null);
  return Promise.all(['atp','wta'].map(t=>sGet(ESPB+'tennis/'+t+'/scoreboard').catch(()=>null))).then(bs=>{
    let found=null;
    bs.forEach(b=>{ ((b&&b.events)||[]).forEach(ev=>{ ((ev.groupings)||[{competitions:ev.competitions}]).forEach(gr=>{ (gr.competitions||[]).forEach(c=>{
      const cs=c.competitors||[]; if(cs.length!==2) return;
      const nm=cs.map(x=>tnSur(((x.athlete||{}).displayName)||((x.team||{}).displayName)||''));
      if(nm.indexOf(hs_)>=0&&nm.indexOf(as_)>=0) found={c:c,cs:cs,nm:nm};
    }); }); }); });
    if(!found) return null;
    const c=found.c, ty=(c.status&&c.status.type)||{}; const games=x=>(x.linescores||[]).reduce((a,l)=>a+sToi(l.value!=null?l.value:l.displayValue),0);
    const hi=found.nm.indexOf(hs_), ai=found.nm.indexOf(as_);
    const doc={gid:gid,lg:'tennis',st:{s:ty.state||'pre',per:(c.status&&c.status.period)||0,clk:'',det:ty.detail||'',pre:''},hs:games(found.cs[hi]),as:games(found.cs[ai]),p:{},dnp:[],plays:[],nm:{},ts:{},ab:{home:g.teams.home.abbr,away:g.teams.away.abbr},sit:{},wp:[]};
    if(doc.st.s==='post'&&doc.hs===doc.as){ const w=found.cs[hi].winner?'h':found.cs[ai].winner?'a':''; if(w==='h') doc.hs++; else if(w==='a') doc.as++; }
    return doc;
  }).catch(()=>null);
}

const POLL={sig:{},sb:{},timer:null,fails:0,stop:{}};
function pollGames(){ return Object.keys(G).map(id=>G[id]).filter(g=>ESP[g.key||g.lg]); }
const POLL_LEAD=20*60e3, POLL_OLD=18*3600e3;
function pollOnce(){
  /* only games that are within 20 minutes of kickoff, live, or just finished are polled: a slate of 20+ games costs a handful of requests, not 20 every few seconds */
  const now=Date.now();
  const cand=pollGames().filter(g=>!POLL.stop[g.id]).filter(g=>{ const t=Date.parse(g.iso); return !isFinite(t)||t-now<POLL_LEAD; });
  if(!cand.length){ if(FS.conn!=='err') FS.conn=Object.keys(FEED).length?'on':'idle'; if(S.view==='live') RF('lv-status',statusHtml()); return Promise.resolve(60000); }
  const lgs=[...new Set(cand.map(g=>g.key||g.lg))];
  return Promise.all(lgs.map(lg=>sGet(ESPB+ESP[lg]+'/scoreboard'+(ESPQ[lg]||'')).then(j=>{ POLL.sb[lg]=j; }).catch(()=>{}))).then(()=>
    Promise.all(cand.map(g=>{
      const ev=((POLL.sb[g.key||g.lg]||{}).events||[]).find(e=>e.id===g.id);
      return espnBuild(g.key||g.lg,g.id,ev).then(doc=>{
        if(!doc) return null;
        const h=JSON.stringify(doc);
        if(POLL.sig[g.id]===h){ FS.last=Date.now(); FS.conn='on'; return doc; }
        POLL.sig[g.id]=h; doc.t=Date.now();
        try{ feedIn(g.id,doc); }catch(e){ FS.err=String(e&&e.message||e); }
        return doc;
      });
    }))
  ).then(docs=>{
    POLL.fails=0; FS.conn='on';
    let anyLiveNow=false;
    docs.forEach(d=>{
      if(!d) return;
      if(d.st.s==='in') anyLiveNow=true;
      const g=G[d.gid], t=g?Date.parse(g.iso):NaN;
      if(d.st.s==='post'||(isFinite(t)&&t<now-POLL_OLD&&d.st.s!=='in')) POLL.stop[d.gid]=true;      // finished, or postponed/abandoned long ago: stop asking
    });
    if(S.view==='live') RF('lv-status',statusHtml());
    return anyLiveNow?6000:30000;
  }).catch(e=>{
    POLL.fails++; FS.err=(e&&e.message)||''; if(POLL.fails>=3) FS.conn='err';
    if(S.view==='live') RF('lv-status',statusHtml());
    return Math.min(30000,6000*POLL.fails);
  });
}
function startPoll(){
  if(POLL.timer) return; POLL.timer=1;
  const loop=()=>{ pollOnce().then(ms=>{ if(document.hidden) ms=Math.max(ms,30000); POLL.timer=setTimeout(loop,ms); }); };
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ clearTimeout(POLL.timer); loop(); } });
  loop();
}

/* ===== keep the cards of games with open practice bets =====
   The slate rolls forward as the bot refreshes. A game that has left data/slate.json would leave its open bets unsettleable (and crash the bets list),
   so the card of every game that has a pending bet is remembered on this phone and put back (flagged ghost) until the bet is settled. */
const KC_KEY='linescout.cards.v1';
function kcRead(){ try{ return JSON.parse(localStorage.getItem(KC_KEY)||'{}')||{}; }catch(e){ return {}; } }
function kcWrite(o){ try{ localStorage.setItem(KC_KEY,JSON.stringify(o)); }catch(e){} }
function kcNeed(bets){ const s={}; (bets||[]).forEach(b=>{ if(b&&b.status==='pending') (b.legs||[]).forEach(l=>{ if(l&&!l.res&&l.gid) s[String(l.gid)]=1; }); }); return s; }
(function kcRestore(){
  let saved=null; try{ saved=JSON.parse(localStorage.getItem('linescout.practice.v1')||'null'); }catch(e){}
  const need=kcNeed(saved&&saved.bets), cards=kcRead(); let changed=false;
  Object.keys(cards).forEach(id=>{ if(!need[id]){ delete cards[id]; changed=true; } });
  Object.keys(need).forEach(id=>{ if(!G[id]&&cards[id]&&cards[id].teams){ const c=cards[id]; c.ghost=true; G[id]=c; DATA.games.push(c); } });
  if(changed) kcWrite(cards);
})();
function kcSave(){
  try{
    const need=kcNeed(P.bets), cards=kcRead(); let changed=false;
    Object.keys(cards).forEach(id=>{ if(!need[id]){ delete cards[id]; changed=true; } });
    Object.keys(need).forEach(id=>{ if(G[id]&&!cards[id]){ cards[id]=G[id]; changed=true; } });
    if(changed) kcWrite(cards);
  }catch(e){}
}

document.addEventListener('visibilitychange',()=>{ if(document.hidden) kcSave(); });

/* ---------- sign in / sign up / username ---------- */
function openModal(kind){ SOC.modal={kind:kind,msg:'',busy:false,avail:null}; drawModal(); }
function closeModal(){ SOC.modal=null; const m=document.getElementById('socmodal'); if(m) m.remove(); }
function drawModal(){
  let m=document.getElementById('socmodal');
  if(!SOC.modal){ if(m) m.remove(); return; }
  if(!m){ m=document.createElement('div'); m.id='socmodal'; m.className='modal'; document.body.appendChild(m); }
  const k=SOC.modal.kind; const v=id=>{ const e=document.getElementById(id); return e?e.value:''; };
  const keep={em:v('su-email'),pw:v('su-pass'),un:v('su-name')};
  const nameFld='<label class="fld">Username <input id="su-name" class="num wide" maxlength="18" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="3-18 letters, numbers or _" value="'+esc(keep.un)+'"><span class="small" id="su-avail">'+(SOC.modal.avail==null?'Shown to other players. Letters, numbers and _ only.':SOC.modal.avail?'<span class="okt">Available</span>':'<span class="badt">Taken or not allowed</span>')+'</span></label>';
  let body='';
  if(k==='name'){
    body='<h2>Pick a username</h2><div class="small">Your account has no username yet (the one you chose may have been taken a moment earlier). Pick one to get your 1,000 practice coins.</div>'+nameFld+
      '<div class="btnrow"><button class="btn solid" data-act="su-claim">Save username</button><button class="btn" data-act="su-out">Sign out</button></div>';
  } else {
    const up=k==='up';
    body='<div class="seg" role="group" aria-label="Account"><button data-act="su-tab" data-k="in" aria-pressed="'+!up+'">Sign in</button><button data-act="su-tab" data-k="up" aria-pressed="'+up+'">Create account</button></div>'+
      '<label class="fld">Email <input id="su-email" class="num wide" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" value="'+esc(keep.em)+'"></label>'+
      '<label class="fld">Password <input id="su-pass" class="num wide" type="password" autocomplete="'+(up?'new-password':'current-password')+'" minlength="6" value="'+esc(keep.pw)+'"></label>'+
      (up?nameFld:'')+
      '<div class="btnrow"><button class="btn solid" data-act="'+(up?'su-up':'su-in')+'">'+(up?'Create account':'Sign in')+'</button><button class="btn" data-act="su-close">Not now</button></div>'+
      (up?'<div class="small muted">New accounts get 1,000 practice coins.</div>':'');
  }
  m.innerHTML='<div class="mbox" role="dialog" aria-modal="true" aria-label="Account"><button class="mx" data-act="su-close" aria-label="Close">×</button>'+body+
    '<div class="slipnote warnt" id="su-msg" role="status">'+esc(SOC.modal.msg||'')+'</div>'+PRACTICE_NOTE+'</div>';
  const f=m.querySelector(k==='name'?'#su-name':'#su-email'); if(f&&!f.value) setTimeout(()=>{ try{ f.focus(); }catch(e){} },30);
}
function suMsg(t){ if(SOC.modal) SOC.modal.msg=t; const e=document.getElementById('su-msg'); if(e) e.textContent=t; }
const nameOk=n=>/^[A-Za-z0-9_]{3,18}$/.test(n);
let availT=null;
function checkAvail(){
  clearTimeout(availT); const e=document.getElementById('su-name'); if(!e||!SOC.sb) return; const n=e.value.trim();
  const a=document.getElementById('su-avail');
  if(!nameOk(n)){ if(SOC.modal) SOC.modal.avail=null; if(a) a.innerHTML=n?'<span class="badt">3-18 letters, numbers or _</span>':'Shown to other players. Letters, numbers and _ only.'; return; }
  availT=setTimeout(()=>{ SOC.sb.rpc('username_available',{p_name:n}).then(r=>{ if(!SOC.modal) return; SOC.modal.avail=!!r.data; const a2=document.getElementById('su-avail'); if(a2) a2.innerHTML=r.data?'<span class="okt">Available</span>':'<span class="badt">Taken</span>'; }); },350);
}
async function doSignUp(){
  const em=(document.getElementById('su-email')||{}).value||'', pw=(document.getElementById('su-pass')||{}).value||'', un=((document.getElementById('su-name')||{}).value||'').trim();
  if(!/^\S+@\S+\.\S+$/.test(em)) return suMsg('Enter your email address.');
  if(pw.length<6) return suMsg('Use a password of at least 6 characters.');
  if(!nameOk(un)) return suMsg('Usernames are 3 to 18 letters, numbers or _.');
  suMsg('Checking the username…');
  const av=await SOC.sb.rpc('username_available',{p_name:un}); if(av.data===false) return suMsg('That username is taken. Try another.');
  suMsg('Creating your account…');
  const r=await SOC.sb.auth.signUp({email:em.trim(),password:pw,options:{data:{username:un}}});
  if(r.error) return suMsg(r.error.message||'Could not create the account.');
  if(!r.data.session){ SOC.modal.kind='in'; drawModal(); return suMsg('Account created. Check your email for a confirmation link, then sign in here. (Site owner: turn off "Confirm email" in Supabase so this step is not needed.)'); }
  closeModal(); S.flash='Welcome, '+un+'! You have 1,000 practice coins.'; renderBank();
}
async function doSignIn(){
  const em=(document.getElementById('su-email')||{}).value||'', pw=(document.getElementById('su-pass')||{}).value||'';
  if(!em||!pw) return suMsg('Enter your email and password.');
  suMsg('Signing in…');
  const r=await SOC.sb.auth.signInWithPassword({email:em.trim(),password:pw});
  if(r.error) return suMsg(r.error.message==='Invalid login credentials'?'Wrong email or password.':r.error.message);
  closeModal();
}
async function doClaim(){
  const un=((document.getElementById('su-name')||{}).value||'').trim();
  if(!nameOk(un)) return suMsg('Usernames are 3 to 18 letters, numbers or _.');
  const r=await SOC.sb.rpc('claim_username',{p_name:un});
  if(r.error) return suMsg(r.error.message);
  closeModal(); refreshMe().then(()=>render());
}
async function signOut(){ stopChat(); try{ await SOC.sb.auth.signOut(); }catch(e){} SOC.user=null; SOC.me=null; SOC.bets=null; SOC.mentions=[]; S.view='pre'; render(); }

  if(!SOC.sb) return; if(!force&&SOC.lb&&Date.now()-SOC.lbT<20000) return; SOC.lbT=Date.now();
  SOC.sb.rpc('leaderboard').then(r=>{ if(r.error){ SOC.err=r.error.message; return; } const sig=JSON.stringify(r.data); if(sig===SOC.lbSig) return; SOC.lbSig=sig; SOC.lb=r.data; if(S.view==='board'){ const b=document.getElementById('board-body'); if(b) b.innerHTML=boardBodyHtml(); } });

function badgeChip(kind,count,sport,title){ const b=BADGE[kind]; if(!b) return ''; return '<span class="bdg bdg-'+kind+'" title="'+esc(b.n+(sport?' ('+sport.toUpperCase()+')':'')+': '+b.d+(title?' · '+title:''))+'"><i aria-hidden="true">'+b.e+'</i>'+esc(b.n)+(sport?' '+esc(sport.toUpperCase()):'')+(count>1?' <b>×'+count+'</b>':'')+'</span>'; }
function badgeLegend(){ return '<details class="d"><summary>What the badges mean</summary><div class="legend">'+Object.keys(BADGE).map(k=>'<div class="lg1">'+badgeChip(k,1)+'<span class="small muted">'+esc(BADGE[k].d)+'</span></div>').join('')+'<div class="small muted">Badges stack: each award is kept with its date (and sport for King), and profiles show ×count. Days run midnight to midnight Eastern time.</div></div></details>'; }

/* ---------- chat (signed-in), realtime with a polling fallback ---------- */
const CHAT_MAX=120, IMG_MAX=122880;
function chatView(){
  const h='<section class="game"><div class="sec">';
  if(!SOC.on||SOC.state!=='ready') return h+'<h3>Chat</h3>'+socNote()+'</div></section>';
  if(!SOC.user) return h+'<h3>Chat</h3><div class="small">Chat is for signed-in players. Sign in to read and write messages, @mention people, see who is online and who visited your profile.</div><div class="btnrow"><button class="btn solid" data-act="signin">Sign in</button></div></div></section>';
  return h+'<div class="seg" id="sh-tabs" role="group" aria-label="Chat">'+chTabs()+'</div><div id="sh-body">'+chBody()+'</div></div></section>';
}
function chatModeText(){ return SOC.chatMode==='rt'?'<span class="livedot"></span> live':SOC.chatMode==='poll'?'updates every 4 s':''; }
function mentionHtml(t){
  const me=SOC.me?SOC.me.username.toLowerCase():'';
  return esc(t).replace(/(^|[^A-Za-z0-9_@])@([A-Za-z0-9_]{3,18})/g,(m,pre,n)=>pre+'<button class="mention'+(n.toLowerCase()===me?' you':'')+'" data-act="profile" data-u="'+n+'">@'+n+'</button>');
}
const okImg=s=>typeof s==='string'&&/^data:image\/(png|jpeg|gif|webp);base64,[A-Za-z0-9+\/=]+$/.test(s)&&s.length<=IMG_MAX;
function msgHtml(m){
  const mine=SOC.user&&m.user_id===SOC.user.id; const me=SOC.me?SOC.me.username.toLowerCase():'';
  const hits=!mine&&me&&new RegExp('@'+me+'(?![A-Za-z0-9_])','i').test(m.body||'');
  if(m.deleted) return '<div class="msg del" data-id="'+m.id+'"><div class="mh">'+uLink(m.username)+'<span class="muted">'+esc(fmtClock(Date.parse(m.created_at)))+'</span></div><div class="mt muted small">message deleted</div></div>';
  return '<div class="msg'+(mine?' mine':'')+(hits?' atme':'')+'" data-id="'+m.id+'"><div class="mh">'+uLink(m.username)+'<span class="muted">'+esc(fmtClock(Date.parse(m.created_at)))+'</span>'+(hits?'<span class="mbadge">mentioned you</span>':'')+(mine?'<button class="linkbtn" data-act="chat-del" data-id="'+m.id+'">Delete</button>':'')+'</div>'+
    (m.body?'<div class="mt">'+mentionHtml(m.body)+'</div>':'')+(okImg(m.img)?'<img class="cimg" alt="Picture from '+esc(m.username)+'" src="'+m.img+'">':'')+'</div>';
}
function fmtClock(t){ return new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function chatBodyHtml(){
  const un=socUnseen(); const lastM=SOC.mentions[0];
  return '<div class="small muted" style="margin:2px 0 6px">Everyone chat <span id="chatmode">'+chatModeText()+'</span></div>'+(SOC.chatErr?'<div class="flash">'+esc(SOC.chatErr)+'</div>':'')+
    (un&&lastM?'<div class="menbar">'+lastM.from_name+' mentioned you'+(un>1?' (+'+(un-1)+' more)':'')+'</div>':'')+
    '<div class="chatbox" id="chatbox" aria-live="polite">'+(SOC.chat.length?SOC.chat.map(msgHtml).join(''):'<div class="small muted">No messages yet. Say hi.</div>')+'</div>'+
    '<div class="sugg" id="chatsugg" role="listbox" aria-label="Usernames"></div>'+
    '<div class="composer"><label class="attach" title="Attach a small picture">'+IC.clip+'<input type="file" accept="image/png,image/jpeg,image/webp,image/gif" data-in="chatfile" hidden aria-label="Attach a picture"></label><input class="num wide" id="chatin" data-in="chattext" maxlength="500" placeholder="Message · type @ to mention" aria-label="Message" autocomplete="off" value="'+esc(SOC.draft)+'"><button class="btn pri" data-act="chat-send">Send</button></div>'+
    '<div class="small muted" id="chatnote">Up to 500 characters, one message every 2 seconds. Pictures are shrunk to about 120 KB. Tap a name to see a profile.</div>';
}
function renderChat(scroll){
  const bx=document.getElementById('chatbox'); if(!bx){ return; }
  const atBottom=bx.scrollHeight-bx.scrollTop-bx.clientHeight<60;
  bx.innerHTML=SOC.chat.length?SOC.chat.map(msgHtml).join(''):'<div class="small muted">No messages yet. Say hi.</div>';
  if(scroll||atBottom) bx.scrollTop=bx.scrollHeight;
  const md=document.getElementById('chatmode'); if(md) md.innerHTML=chatModeText();
}
function mergeMsgs(list){
  const by={}; SOC.chat.forEach(m=>by[m.id]=m); list.forEach(m=>by[m.id]=m);
  SOC.chat=Object.keys(by).map(k=>by[k]).sort((a,b)=>a.id-b.id).slice(-CHAT_MAX);
  SOC.lastId=SOC.chat.length?SOC.chat[SOC.chat.length-1].id:SOC.lastId;
}
function startChat(){
  if(!SOC.sb||!SOC.user||SOC.chatTimer||SOC.chan) return;
  SOC.sb.from('chat_messages').select('*').order('id',{ascending:false}).limit(60).then(r=>{ if(r.error){ SOC.chatErr=r.error.message; return; } mergeMsgs((r.data||[]).reverse()); renderChat(true); });
  let decided=false;
  const fallback=()=>{ if(decided&&SOC.chatMode==='poll') return; decided=true; SOC.chatMode='poll'; if(SOC.chan){ try{ SOC.sb.removeChannel(SOC.chan); }catch(e){} SOC.chan=null; } if(!SOC.chatTimer) SOC.chatTimer=setInterval(pollChat,4000); renderChat(false); };
  try{
    SOC.chan=SOC.sb.channel('ls-chat').on('postgres_changes',{event:'*',schema:'public',table:'chat_messages'},p=>{ if(p.new&&p.new.id){ mergeMsgs([p.new]); renderChat(false); } })
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'mentions',filter:'user_id=eq.'+SOC.user.id},p=>{ if(p.new){ SOC.mentions.unshift(p.new); navRefresh(); } })
      .subscribe(st=>{ if(st==='SUBSCRIBED'){ decided=true; SOC.chatMode='rt'; renderChat(false); } else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED') fallback(); });
  }catch(e){ fallback(); }
  setTimeout(()=>{ if(SOC.chatMode!=='rt') fallback(); },5000);
}
let pollN=0;
function pollChat(){
  if(!SOC.sb||!SOC.user||document.hidden) return;
  pollN++;
  const q=(pollN%4===0||!SOC.lastId)?SOC.sb.from('chat_messages').select('*').order('id',{ascending:false}).limit(60):SOC.sb.from('chat_messages').select('*').gt('id',SOC.lastId).order('id',{ascending:false}).limit(60);
  q.then(r=>{ if(r.error) return; if(r.data&&r.data.length){ mergeMsgs(r.data.reverse()); renderChat(false); } });
  if(pollN%4===0) loadMentions();
}
function stopChat(){ if(SOC.chatTimer){ clearInterval(SOC.chatTimer); SOC.chatTimer=null; } if(SOC.chan&&SOC.sb){ try{ SOC.sb.removeChannel(SOC.chan); }catch(e){} } SOC.chan=null; SOC.chatMode='off'; }
function loadMentions(){ if(!SOC.sb||!SOC.user) return; SOC.sb.from('mentions').select('id,msg_id,from_name,created_at').order('id',{ascending:false}).limit(20).then(r=>{ if(!r.error){ SOC.mentions=r.data||[]; navRefresh(); if(S.view==='chat') markMentionsSeen(); } }); }
function markMentionsSeen(){ const top=SOC.mentions.length?SOC.mentions[0].id:0; if(top>SOC.seenMention){ setTimeout(()=>{ SOC.seenMention=top; try{ localStorage.setItem('linescout.mention.seen',String(top)); }catch(e){} navRefresh(); },4000); } }
function navRefresh(){ const n=document.getElementById('nav'); if(n) n.innerHTML=navHtml(); }
async function sendChatMsg(){
  const inp=document.getElementById('chatin'); const text=((inp&&inp.value)||SOC.draft||'').trim();
  if(!text&&!SOC.img) return; if(SOC.sending) return; SOC.sending=true;
  const r=await SOC.sb.rpc('send_chat',{p_body:text,p_img:SOC.img||null}); SOC.sending=false;
  const note=document.getElementById('chatnote');
  if(r.error){ if(note) note.textContent=r.error.message; return; }
  SOC.draft=''; SOC.img=null; if(inp) inp.value=''; clearTimeout(suggT); hideSugg(); if(note) note.textContent='Sent.';
  if(SOC.chatMode!=='rt') pollChat();
}
/* @mention autocomplete */
let suggT=null;
function mentionQuery(){ const inp=document.getElementById('chatin'); if(!inp) return null; const pos=inp.selectionStart==null?inp.value.length:inp.selectionStart; const m=inp.value.slice(0,pos).match(/(^|[^A-Za-z0-9_])@([A-Za-z0-9_]{0,18})$/); return m?{q:m[2],end:pos,start:pos-m[2].length-1}:null; }
function updateSugg(){
  clearTimeout(suggT); const mq=mentionQuery(); if(!mq){ hideSugg(); return; }
  suggT=setTimeout(()=>{
    let q=SOC.sb.from('profiles').select('username').order('username').limit(6); if(mq.q) q=q.ilike('username',mq.q.replace(/_/g,'\\_')+'%');
    q.then(r=>{ const el=document.getElementById('chatsugg'); if(!el||r.error||!mentionQuery()) return; const mine=SOC.me?SOC.me.username:''; const list=(r.data||[]).map(x=>x.username).filter(n=>n!==mine);
      el.innerHTML=list.map(n=>'<button class="sg" role="option" data-act="mention-pick" data-u="'+esc(n)+'">@'+esc(n)+'</button>').join(''); el.classList.toggle('on',list.length>0); });
  },180);
}
function hideSugg(){ const el=document.getElementById('chatsugg'); if(el){ el.innerHTML=''; el.classList.remove('on'); } }
function pickMention(n){ const inp=document.getElementById('chatin'); const mq=mentionQuery(); if(!inp||!mq) return; inp.value=inp.value.slice(0,mq.start)+'@'+n+' '+inp.value.slice(mq.end); SOC.draft=inp.value; const p=mq.start+n.length+2; inp.focus(); try{ inp.setSelectionRange(p,p); }catch(e){} hideSugg(); }
function fileToDataUri(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error('Could not read that file.')); r.readAsDataURL(f); }); }
async function prepImage(f){
  if(f.type==='image/gif'){ const u=await fileToDataUri(f); if(u.length>IMG_MAX) throw new Error('That GIF is too big (the limit is about 90 KB).'); return u; }
  const src=await fileToDataUri(f);
  const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('Could not open that picture.')); i.src=src; });
  let max=560, q=0.7, out='';
  for(let k=0;k<7;k++){
    const sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.width*sc)); c.height=Math.max(1,Math.round(img.height*sc));
    const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
    out=c.toDataURL('image/jpeg',q); if(out.length<=IMG_MAX) return out; max*=0.8; q=Math.max(0.45,q-0.06);
  }
  throw new Error('That picture is too large even after shrinking.');
}

/* ================= BATTLE: simulated NFL / NBA / WNBA / MLB / college football / college basketball games between two players (practice coins) =================
   Flow: create (wager escrowed; format Parlay or Same Game Parlay) -> someone accepts (matching wager) -> both build + lock a parlay from the battle's markets
   -> the database simulates the whole game and reveals it play by play over ~3 minutes -> the slip that pays more wins the pot.
   Spectators can bet on the game lines and on who wins the battle until the game starts. Rosters and injuries are frozen into the battle when it is created. */
const BT={lobby:null,id:null,det:null,timer:null,tick:null,sim:null,simTried:false,form:{sport:'nfl',home:'',pick:'',wager:'50',fmt:'parlay',q:'',vs:'players'},
  draft:{},saveT:null,spec:{tok:'',stake:'25'},msg:'',busy:false,seen:{},html:{},lastTick:0,skew:0,quote:{},acc:{},all:{},sawLive:{},flashed:{}};
const SPORTS3_ALL=[['nfl','NFL'],['nba','NBA'],['wnba','WNBA'],['mlb','MLB'],['nhl','NHL'],['tennis','Tennis'],['cfb','CFB'],['cbb','CBB']];
const SPLONG={nfl:'NFL',nba:'NBA',wnba:'WNBA',mlb:'MLB',nhl:'NHL hockey',tennis:'Tennis (games won)',cfb:'College football',cbb:"Men's college basketball"};
/* hockey and tennis are offered once the bot has published their teams / players (and they need the one-time database update, supabase/patch_hockey_tennis.sql) */
function sports3(){ return SPORTS3_ALL.filter(([k])=>(k!=='nhl'&&k!=='tennis')||(typeof simTeams==='function'&&simTeams(k).length)); }
function btLiveDot(){ return !!(BT.lobby&&BT.lobby.live&&BT.lobby.live.length); }
function btNow(){ return Date.now()+BT.skew; }
function loadSim(){
  if(BT.sim||BT.simTried) return; BT.simTried=true;
  fetch('data/sim.json?v='+encodeURIComponent((window.__LSDATA&&window.__LSDATA.meta&&window.__LSDATA.meta.generatedAt)||Date.now())).then(r=>r.ok?r.json():null).catch(()=>null).then(j=>{
    if(j&&j.sports&&Object.keys(j.sports).length){ BT.sim=j; btFormDefaults(); btRender(); return; }
    if(!SOC.sb) return;
    SOC.sb.from('sim_teams').select('sport,abbr,name,short,color').order('abbr').then(r=>{ if(r.error||!r.data) return; const sp={}; r.data.forEach(t=>{ (sp[t.sport]=sp[t.sport]||{teams:[]}).teams.push(t); }); BT.sim={sports:sp}; btFormDefaults(); btRender(); });
  });
}
function simTeams(sport){ return ((BT.sim&&BT.sim.sports[sport])||{teams:[]}).teams; }
function teamOf(sport,ab){ return simTeams(sport).find(t=>t.abbr===ab)||{abbr:ab,name:ab,color:'#334155'}; }
function btFormDefaults(){ const f=BT.form, ts=simTeams(f.sport); if(!ts.length) return; const pr=ts.filter(t=>t.props!==false); const pool=pr.length>=1?pr:ts;
  if(!ts.some(t=>t.abbr===f.home)) f.home=pool[0].abbr; }
function tchip(name,color){ return '<span class="tchip" style="background:'+esc(color||'#334155')+'">'+esc((name||'').slice(0,4))+'</span>'; }

/* ---------- the computer opponent ---------- */
const CPU_NAME='SportsLineCPU';

function cpuNote(){

  if(c){ const you=c.you; learn=' It learns from every battle: '+cn(c.legs_learned||0)+' legs studied so far'+(c.battles?', '+cn(c.battles)+' battle'+(c.battles===1?'':'s')+' played':'')+'.'+(you&&(you.w+you.l+you.t)?' Your record against it: '+you.w+'-'+you.l+(you.t?'-'+you.t:'')+'.':''); }
  else if(BT.cpuMissing) learn=' (The computer needs the v6 database patch: run supabase/patch_battle_v6.sql once.)';

}

/* ---------- data ---------- */
function loadLobby(){
  if(!SOC.sb) return;
  const now=Date.now(); if(now-BT.lastTick>30000){ BT.lastTick=now; SOC.sb.rpc('battle_tick').then(()=>{},()=>{}); }
  SOC.sb.rpc('battle_lobby').then(r=>{ if(r.error){ BT.msg=r.error.message; btRender(); return; } BT.lobby=r.data; if(r.data&&r.data.now) BT.skew=Date.parse(r.data.now)-Date.now(); btRender(); navRefresh(); btCheckAlerts(r.data); });
}
function loadDetail(){
  if(!SOC.sb||!BT.id) return;
  const id=BT.id;
  SOC.sb.rpc('battle_detail',{p_id:id}).then(r=>{
    if(BT.id!==id) return;
    if(r.error){ BT.msg=r.error.message; btRender(); return; }
    BT.det=r.data; btCum(r.data&&r.data.events); if(r.data&&r.data.now) BT.skew=Date.parse(r.data.now)-Date.now();
    const b=r.data&&r.data.battle;
    if(b&&b.status==='open'&&SOC.user&&b.creator===SOC.user.id) BT.alerts.until=Date.now()+30*60000;      // keep watching for a challenger from other screens
    if(b&&b.status==='live'&&Date.parse(b.ends_at)<=btNow()+500&&!BT.settling){ BT.settling=true; SOC.sb.rpc('settle_battle',{p_id:id}).then(()=>{ BT.settling=false; loadDetail(); refreshMe(); },()=>{ BT.settling=false; }); }
    if(b&&BT.draft[id]==null){ const mine=(r.data.parlays||[]).find(p=>SOC.user&&p.user_id===SOC.user.id); if(mine){ BT.draft[id]=(mine.legs||[]).map(l=>l.tok);
      if(b.status==='building'&&!mine.locked&&!BT.draft[id].length&&b.max_legs!==undefined){ const my=(SOC.user.id===b.creator)?b.creator_side:(b.creator_side==='home'?'away':'home'); BT.draft[id]=['ml:'+my]; setTimeout(()=>saveParlay(id),50); } } }
    btRender();
  });
}
/* each play row carries only the player totals that changed on that play; add them up so every row holds the running totals */
function btCum(evs){ let acc={}; (evs||[]).forEach(e=>{ const s=e.stats; if(s&&typeof s==='object'){ const n=Object.assign({},acc); for(const pid in s) n[pid]=Object.assign({},acc[pid]||{},s[pid]); acc=n; } e.stats=acc; }); }
/* ---------- box score ---------- */
const BX_COLS={nfl:{QB:[['passYds','Pass'],['passTD','PaTD'],['rushYds','Rush']],RB:[['rushYds','Rush'],['rec','Rec'],['recYds','RecYd'],['tdany','TD']],WR:[['rec','Rec'],['recYds','RecYd'],['tdany','TD']]},
  nba:{P:[['pts','PTS'],['reb','REB'],['ast','AST'],['fg3','3PM'],['pra','PRA']]},
  mlb:{H:[['hits','H'],['runs','R'],['rbi','RBI'],['hr','HR'],['tb','TB'],['hrr','H+R+RBI']],SP:[['outs','IP'],['k','K']]}};
BX_COLS.cfb=BX_COLS.nfl; BX_COLS.cbb=BX_COLS.nba; BX_COLS.wnba=BX_COLS.nba;
const BX_GROUPS={nfl:[['QB','RB','WR']],nba:[['P']],mlb:[['H'],['SP']]}; BX_GROUPS.cfb=BX_GROUPS.nfl; BX_GROUPS.cbb=BX_GROUPS.nba; BX_GROUPS.wnba=BX_GROUPS.nba;
function btBox(b,d,last){
  const ro=b.markets&&b.markets.roster; if(!ro||!last) return '<div class="small muted">The box score fills in once the first play happens.</div>';
  const st=last.stats||{}, cols=BX_COLS[b.sport]||{}, groups=BX_GROUPS[b.sport]||[];
  const star=new Set(); (d.parlays||[]).forEach(p=>(p.graded||p.legs||[]).forEach(l=>{ if(l.pid) star.add(l.pid); }));
  const fmtv=(k,v)=>k==='outs'?Math.floor(v/3)+'.'+(v%3):String(v);
  const people=Object.keys(ro).map(pid=>({pid:pid,n:ro[pid][0]||pid,side:ro[pid][1],role:ro[pid][2],rk:+ro[pid][3]||0}));
  let out='';
  ['away','home'].forEach(side=>{
    const T=teamOf(b.sport,side==='home'?b.home:b.away);
    out+='<div class="bxh">'+tchip(T.abbr,T.color)+' <b>'+esc(T.name||T.abbr)+'</b> <span class="muted small">'+(side==='home'?last.hs:last.as_)+'</span></div>';
    groups.forEach(g=>{
      const rows=people.filter(x=>x.side===side&&g.indexOf(x.role)>=0).sort((x,y)=>g.indexOf(x.role)-g.indexOf(y.role)||x.rk-y.rk); if(!rows.length) return;
      const ks=[]; g.forEach(r=>(cols[r]||[]).forEach(c=>{ if(!ks.some(q=>q[0]===c[0])) ks.push(c); }));
      out+='<div class="xscroll"><table class="bxt"><thead><tr><th>Player</th>'+ks.map(c=>'<th>'+esc(c[1])+'</th>').join('')+'</tr></thead><tbody>'+
        rows.map(x=>{ const have=(cols[x.role]||[]).map(c=>c[0]); const s=st[x.pid]||{};
          return '<tr'+(star.has(x.pid)?' class="mine"':'')+'><td class="bxn">'+esc(surname(x.n))+(star.has(x.pid)?' <span title="In a slip">★</span>':'')+'</td>'+ks.map(c=>'<td class="mono">'+(have.indexOf(c[0])<0?'<span class="muted">–</span>':fmtv(c[0],s[c[0]]||0))+'</td>').join('')+'</tr>'; }).join('')+'</tbody></table></div>';
    });
  });
  return '<div class="small muted bxkey">★ = in a slip</div>'+out;
}
function btSchedule(){
  clearTimeout(BT.timer); BT.timer=null;
  if(S.view!=='battle'||!SOC.sb||document.hidden) return;
  const b=BT.det&&BT.det.battle; const live=BT.id&&b&&b.status==='live';
  const ms=BT.id?(live?1000:(b&&(b.status==='final'||b.status==='cancelled')?15000:4000)):6000;
  BT.timer=setTimeout(()=>{ if(BT.id) loadDetail(); else loadLobby(); btSchedule(); },ms);
}
function btAfterRender(){
  if(S.view!=='battle'){ clearTimeout(BT.timer); BT.timer=null; try{ if(AMB.on) ambStop(); }catch(e){} return; }
  if(!SOC.sb) return;
  loadSim();
  if(BT.id){ if(!BT.det||BT.det.battle.id!==BT.id) loadDetail(); } else { loadLobby(); btSliderFix(null); }
  btSchedule();
  if(!BT.tick) BT.tick=setInterval(btTickClocks,1000);
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&S.view==='battle') { if(BT.id) loadDetail(); else loadLobby(); btSchedule(); } });
function btTickClocks(){
  document.querySelectorAll('[data-until]').forEach(el=>{ const ms=Date.parse(el.getAttribute('data-until'))-btNow(); el.textContent=ms<=0?'now':Math.floor(ms/60000)+':'+String(Math.floor(ms%60000/1000)).padStart(2,'0'); });
}

/* the sport picker is a swipeable strip: keep its scroll position across re-renders and bring the chosen sport into view */

  const head='<div class="bh"><b>'+uLink(p.username||'?')+'</b>'+(b.fmt==='sgp'?'<span class="sgpb">SGP</span>':'')+(p.payout!=null?'<span class="badge '+(+p.payout>0?'ok':'bad')+'">pays '+cn(p.payout)+' · '+(p.hits||0)+' hit</span>':'<span class="muted small">100 pays '+cn(100*pay)+' ('+fo(amerOfDec(pay))+')'+(sg2&&dec>pay*1.005?' · straight '+cn(100*dec):'')+'</span>')+'</div>';
  const mine=SOC.user&&p.user_id===SOC.user.id&&p.payout!=null&&+p.payout>0;
  return '<div class="bet pcard">'+head+(mine?'<div class="btnrow"><button class="shbtn" data-act="sh-open" data-k="slip" data-src="bparl" data-uid="'+esc(p.user_id)+'">Share my winning slip</button></div>':'')+legs.map(l=>{ const st=l.res?{s:l.res,t:''}:legNow(b,l,ev,fin); return '<div class="bl">'+legStatusIcon({res:st.s||null})+'<span>'+esc(l.label)+' <span class="mono muted">'+fo(l.price)+'</span>'+(st.t?' <span class="small muted">· '+esc(st.t)+'</span>':'')+'</span></div>'; }).join('')+'</div>';
}
/* the slip's price while building: straight multiplication (Parlay) or the server's correlated price (Same Game Parlay) next to it */
function btPriceBox(b,sel){
  if(!sel.length) return '';
  const nv=sel.reduce((x,t)=>x*decOf(legPrice(b,t)),1);
  if(b.fmt!=='sgp') return '<div class="pricebox"><div>Parlay price <b class="mono">'+fo(amerOfDec(nv))+'</b> · 100 coins pay <b class="mono">'+cn(100*nv)+'</b></div></div>';
  if(sel.length<2) return '<div class="pricebox sgpbox"><span class="sgpb">SGP</span> Add at least 2 legs for the Same Game Parlay price.</div>';
  const q=BT.quote[b.id]; const fresh=q&&JSON.stringify((q.toks||[]))===JSON.stringify(sel.slice().sort());
  if(!fresh) return '<div class="pricebox sgpbox"><span class="sgpb">SGP</span> Pricing these legs…<div class="small muted">Straight multiplication would pay '+cn(100*nv)+' for 100 coins.</div></div>';
  const less=1-q.mult/nv;
  return '<div class="pricebox sgpbox"><div><span class="sgpb">SGP</span> price <b class="mono">'+fo(amerOfDec(+q.mult))+'</b> · 100 coins pay <b class="mono">'+cn(100*q.mult)+'</b>'+(q.capped?' <span class="small muted">(payout cap)</span>':'')+'</div>'+
    '<div class="small muted">Straight multiplication: '+fo(amerOfDec(nv))+' · pays '+cn(100*nv)+'. '+(less>0.005?'The SGP pays '+Math.round(less*100)+'% less because these legs tend to happen together.':'These legs barely affect each other, so the price is about the same.')+'</div></div>';
}

/* ---------- who is winning: the two slips compared live (a busted slip is out; otherwise expected payout = chance the legs still hold x what the slip pays) ---------- */
function btSlipState(b,p,ev,fin){
  const legs=(p.graded||p.legs||[]); const dec=btNaive(legs); const q=p.quote; const mult=(b.fmt==='sgp'&&q&&q.mult!=null)?+q.mult:dec;
  let hit=0,miss=0,live=0,prob=1;
  legs.forEach(l=>{ const st=l.res?{s:l.res,t:''}:legNow(b,l,ev,fin);
    if(st.s==='W') hit++; else if(st.s==='L'){ miss++; prob=0; } else if(st.s==='V'){ /* push: leg drops out */ }
    else { live++; const t=st.t||''; prob*=/leading|covering/.test(t)?0.66:/trailing|not covering/.test(t)?0.34:0.5; } });
  return {name:p.username||'?',uid:p.user_id,n:legs.length,hit:hit,miss:miss,live:live,prob:prob,mult:mult,ex:prob*mult};
}
function btStanding(b,d,ev,fin){
  const ps=d.parlays||[]; const pc=ps.find(p=>p.user_id===b.creator), po=ps.find(p=>p.user_id===b.opponent); if(!pc||!po) return null;
  const c=btSlipState(b,pc,ev,fin), o=btSlipState(b,po,ev,fin); let share; // share = creator's side of the bar, 0..100
  if(fin&&b.result&&b.result.creator){ share=b.result.split?50:(b.winner===b.creator?100:0); }
  else if(c.ex+o.ex>0) share=100*c.ex/(c.ex+o.ex);
  else share=100*(c.hit+.5)/(c.hit+o.hit+1);
  if(!fin) share=Math.min(96,Math.max(4,share));
  return {c:c,o:o,share:share,tie:fin&&b.result&&b.result.split};
}
function btSlipLine(s,dead){ return dead?'slip busted ('+s.miss+' missed)':s.hit+' hit · '+s.live+' to play'+(s.miss?' · '+s.miss+' missed':''); }
function btStandHtml(b,d,ev,fin){
  const st=btStanding(b,d,ev,fin); if(!st) return '';
  const c=st.c, o=st.o, sh=Math.round(st.share);
  const lead=fin?(st.tie?'Tied':(sh>50?c.name:o.name)+' won'):(Math.abs(sh-50)<4?'Too close to call':(sh>50?c.name:o.name)+' is winning');
  const pill=(x,pct)=>pct>=18?esc(x.name)+' '+pct+'%':'';
  return '<div class="sec standing" role="group" aria-label="Who is winning"><h3>Who is winning <span class="hint">'+esc(lead)+'</span></h3>'+
    '<div class="stbar" role="img" aria-label="'+esc(c.name+' '+sh+' percent, '+o.name+' '+(100-sh)+' percent')+'"><div class="sb1" style="width:'+sh+'%">'+pill(c,sh)+'</div><div class="sb2" style="width:'+(100-sh)+'%">'+pill(o,100-sh)+'</div></div>'+
    '<div class="stcols"><div class="stc"><b class="c1">'+esc(c.name)+'</b><span class="small muted">'+esc(btSlipLine(c,c.miss>0))+'</span></div><div class="stc r"><b class="c2">'+esc(o.name)+'</b><span class="small muted">'+esc(btSlipLine(o,o.miss>0))+'</span></div></div>'+
    (fin?'':'<div class="small muted">Live read of both slips: a missed leg busts a slip; otherwise it weighs how each open leg is tracking against what the slip pays.</div>')+'</div>';
}

function btAnimate(){
  const d=BT.det; if(!d||!d.battle) return; const b=d.battle; const evs=d.events||[]; const last=evs[evs.length-1];
  if(b.status==='live') BT.sawLive[b.id]=true;
  if(b.status==='final'&&b.result&&b.result.creator&&!BT.flashed[b.id]){ BT.flashed[b.id]=true; // the finish flash: when you watched it end, or opened a battle that ended in the last 10 minutes
    const fresh=BT.sawLive[b.id]||(b.ends_at&&btNow()-Date.parse(b.ends_at)<600000); if(fresh) setTimeout(()=>{ if(S.view==='battle'&&BT.id===b.id) vsfShow(); },BT.sawLive[b.id]?1500:300); }
  if(b.status==='live'||b.status==='final') anEnsureStage(b);
  btAmbience();
  if(!last) return;
  const seen=BT.seen[b.id]; BT.seen[b.id]=last.seq;
  if(seen==null||seen>=last.seq) return;
  const news=evs.filter(e=>e.seq>seen);
  anBump(b,news); anEnqueue(b,news);
}

/* ---------- battle v2 helpers: leg cap, nav counts, 5-second countdown ---------- */
/* unlimited Same Game Parlay: every option is selectable; only picks that can never both happen replace each other */
function btFree(b){ return b.fmt==='sgp'&&b.max_legs===0; }
function btBand(b,tok){ const p=tok.split(':'); if(p[0]==='x') return {k:p[1]+':'+p[2],ge:+p[3]};
  if(p[0]==='p'){ const pr=((b.markets&&b.markets.props)||[]).find(x=>x.pid===p[1]&&x.stat===p[2]); if(!pr) return null; const k=Math.floor(+pr.line)+1; return p[3]==='over'?{k:p[1]+':'+p[2],ge:k}:{k:p[1]+':'+p[2],lt:k}; } return null; }
function btClash(b,a,c){ if(a===c) return true; const pa=a.split(':'), pc=c.split(':');
  if(pa[0]===pc[0]&&(pa[0]==='ml'||pa[0]==='spr'||pa[0]==='tot')) return pa[1]!==pc[1];
  if(pa[0]==='tt'&&pc[0]==='tt') return pa[1]===pc[1]&&pa[2]!==pc[2];
  const x=btBand(b,a), y=btBand(b,c); if(x&&y&&x.k===y.k) return (x.ge!=null&&y.lt!=null&&x.ge>=y.lt)||(y.ge!=null&&x.lt!=null&&y.ge>=x.lt); return false; }
function capN(b){ return b.max_legs===0?40:(b.max_legs||6); }
function capTxt(b,min){ return b.max_legs===0?'tap '+min+' or more legs (no limit)':'tap '+min+' to '+capN(b)+' legs'; }
function btPending(){ const L=BT.lobby; return L&&L.open?L.open.length:0; }              // battles waiting for an opponent or for parlays
function chatNew(){ try{
  const me=SOC.user&&SOC.user.id, msgs=SOC.chat||[]; if(!me||!msgs.length) return 0;
  const top=msgs.reduce((a,m)=>Math.max(a,m.id||0),0);
  if(S.view==='chat'){ localStorage.setItem('ls_chat_seen',String(top)); return 0; }
  const seen=parseInt(localStorage.getItem('ls_chat_seen')||'-1',10); if(seen<0){ localStorage.setItem('ls_chat_seen',String(top)); return 0; }
  return msgs.filter(m=>(m.id||0)>seen&&m.user_id!==me).length; }catch(e){ return 0; } }

/* ---------- battle sound: unlock on any tap, constant crowd noise while a battle is live ---------- */
/* Browsers (and iPhones most of all) only let sound start from a tap, and suspend it again when the page is hidden or the phone sleeps.

function btAudioGesture(){
  try{ if(S.view!=='battle'||!SND.on) return; const c=SND.ctx; if(!c||c.state!=='running') sndUnlock(); else sndSilentKeep(); setTimeout(btAmbience,120); setTimeout(btAmbience,700); }catch(e){}
}

function btSndHint(show){

  if(!show||!st){ if(cur) cur.remove(); return; }
  if(cur) return; st.insertAdjacentHTML('beforeend','<button type="button" id="btsnd" class="sndtap" data-act="bt-sndgo">&#128266; Tap for stadium sound</button>');
}
function btAmbience(){
  try{
    const d=BT.det, b=d&&d.battle; const want=S.view==='battle'&&BT.id&&b&&b.status==='live'&&!document.hidden;
    if(!want||!SND.on){ if(AMB.on) ambStop(); btSndHint(false); return; }
    const c=SND.ctx; if(!c||c.state!=='running'){ btSndHint(true); if(c&&c.resume){ try{ c.resume(); }catch(e){} } return; }
    btSndHint(false); if(!AMB.on) ambStart(b.sport);

/* ---- classify an event into an animation ---- */
function anClassify(sport,e){
  const k=e.kind, t=e.text||'', f=anFam(sport);
  if(k==='final') return {type:'final',pri:3};
  if(k==='fd'||k==='flag'||k==='sack'||k==='foul'||k==='steal'||k==='block'||k==='strikeout'||k==='walk'||k==='safe'||k==='out') return {type:k,pri:(k==='steal'||k==='block'||k==='safe')?2:1};
  if(k==='run') return {type:'run',pri:2};
  if(k==='score'){
    if(f==='fb') return /touchdown/i.test(t)?{type:'td',pri:3}:/field goal/i.test(t)?{type:'fg',pri:2}:{type:'td',pri:3};
    if(f==='hk') return {type:'goal',pri:3};
    if(f==='tn') return {type:'game',pri:2};
    if(f==='bk') return /three/i.test(t)?{type:'three',pri:3}:/throws it down/i.test(t)?{type:'dunk',pri:2}:/at the line/i.test(t)?{type:'ft',pri:1}:{type:'bucket',pri:2};
    return /walk-off/i.test(t)?{type:'walkoff',pri:3}:/homers|grand slam/i.test(t)?{type:'hr',pri:3}:{type:'runscore',pri:3};
  }
  if(k==='play'){
    if(f==='fb'){ if(/interception/i.test(t)) return {type:'int',pri:2}; if(/fumble/i.test(t)) return {type:'fumble',pri:2}; if(/punts/i.test(t)) return {type:'punt',pri:1}; if(/misses/i.test(t)) return {type:'fgmiss',pri:1}; if(/stopped/i.test(t)) return {type:'stop',pri:1}; }
    if(f==='bb'){ if(/singles/i.test(t)) return {type:'hit1',pri:2}; if(/doubles/i.test(t)) return {type:'hit2',pri:2}; if(/triples/i.test(t)) return {type:'hit3',pri:2}; }
  }
  return null;
}

/* ---- tiny animation helpers ---- */
function anMove(node,pts,ms,ease,cb){

  const fr=pts.map(p=>({transform:'translate('+p[0]+'px,'+p[1]+'px)'})); const a=node.animate(fr,{duration:ms,easing:ease||'linear',fill:'forwards'}); if(cb) a.onfinish=cb;
}
function anArc(a,b,peak,n){ const o=[]; for(let i=0;i<=(n||16);i++){ const u=i/(n||16); o.push([a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u-4*peak*u*(1-u)]); } return o; }
function anPop(node,keys,ms){ if(anReduced()) return; node.animate(keys,{duration:ms,easing:'cubic-bezier(.2,1.4,.4,1)',fill:'forwards'}); }
function anBanner(st,text,cls){

/* ---- the plays ---- */
/* who gained from a play: +1 the home team, -1 the visitors, 0 nobody in particular.  e.side is the team the play is about. */
const AN_LOSS={sack:1,int:1,fumble:1,fgmiss:1,stop:1,strikeout:1,out:1,foul:1};
const AN_BIG={td:1,hr:1,walkoff:1,three:1,dunk:1,final:1};
function anGainer(b,ty,e){
  if(ty==='final') return 0;
  if(ty==='flag'){ const m=/flag!?\s+([A-Z]{2,4})\b/i.exec(String(e&&e.text||'')); if(m){ const ab=m[1].toUpperCase(); if(ab===String(b.home).toUpperCase()) return -1; if(ab===String(b.away).toUpperCase()) return 1; } return 0; }
  const side=e&&e.side; if(side!=='home'&&side!=='away') return 0; const sg=side==='home'?1:-1;
  return AN_LOSS[ty]?-sg:sg;
}
/* the crowd: constant murmur (see ambStart), a roar when the home team gains, boos when the visitors do */
function anCrowd(b,ty,e){
  const g=anGainer(b,ty,e); if(!g) return; const big=!!AN_BIG[ty], minor=ty==='fd'||ty==='ft'||ty==='walk'||ty==='safe'||ty==='strikeout'||ty==='out'||ty==='foul'||ty==='punt'||ty==='hit1';
  if(g>0){ if(minor){ sfx('crowd',0,false); ambSwell(1.5,1.8); } else crowdFor(true,big); }
  else { if(minor){ sfx('groan',0); ambSwell(1.3,1.6); } else crowdFor(false,big); }
}
/* sound for each kind of play: stadium sounds that fit the sport (football: kicks, whistles, pads; basketball: swish, rim, buzzer; baseball: bat crack, mitt, organ) */
function anSound(b,ty,e){
  if(typeof sfx!=='function'||!SND.on) return; const f=anFam(b.sport);
  const S=(n,ms)=>sfx(n,ms||0);
  if(ty==='final'){ if(f==='bk') S('buzzer'); else S('whistle2'); S('fanfare',500); crowdFor(true,true); return; }
  if(f==='hk'){ if(ty==='goal'){ S('buzzer'); S('fanfare',300); crowdFor(true,true); } return; }
  if(f==='tn'){ if(ty==='game'){ S('crack'); } return; }
  if(f==='fb'){
    if(ty==='td'){ S('fanfare'); }
    else if(ty==='fg'){ S('kick'); }
    else if(ty==='fgmiss'||ty==='stop'){ S('groan'); }
    else if(ty==='fd'){ S('chime'); }
    else if(ty==='flag'){ S('whistle2'); }
    else if(ty==='sack'){ S('sack'); }
    else if(ty==='int'||ty==='fumble'){ S('catch'); S('tackle',250); }
    else if(ty==='punt'){ S('kick'); }
  } else if(f==='bk'){
    if(ty==='three'){ S('swish',650); }
    else if(ty==='dunk'){ S('squeak'); S('doorslam',380); }
    else if(ty==='bucket'){ S('swish',500); }
    else if(ty==='ft'){ S('dribble',0); S('swish',650); }
    else if(ty==='foul'){ S('whistle'); }
    else if(ty==='steal'){ S('squeak'); S('pass',150); }
    else if(ty==='block'){ S('crack',250); }
    else if(ty==='run'){ S('horn'); }
  } else {
    if(ty==='hit1'||ty==='hit2'||ty==='hit3'){ S('batcrack'); if(ty!=='hit1') S('organ',700); }
    else if(ty==='hr'||ty==='walkoff'){ S('batcrack'); S('big',200); S('organ',900); }
    else if(ty==='runscore'){ S('organ'); }
    else if(ty==='steal'){ S('slide'); }
    else if(ty==='safe'){ S('slide'); }
    else if(ty==='out'){ S('mitt'); }
    else if(ty==='strikeout'){ S('mitt',380); S('chime',450); }
    else if(ty==='walk'){ S('chime'); }
  }
  anCrowd(b,ty,e);
}
/* a short spoken call for scoring plays and period breaks (uses the same voice as the big screen) */
function anSay(b,e){

}

/* ================= Battle filler scenes =================

   Scenes are pure decoration: they never touch the score or the plays.  Reduced motion: no scenes. */

/* ================= SHARE: result cards (rivalry, tie, badge, winning slip) + the finish flash =================
   Cards are drawn on a canvas (1080x1350, the 4:5 shape Instagram, Facebook, X and Reddit all show well) and shared three ways:
   - phones/Safari/Chrome that can share files: the system share sheet (pick Instagram, Snapchat, Facebook, X, Reddit, Twitch ... from there)
   - X, Facebook and Reddit: a pre-filled web post (text + link); the card image is put on the clipboard when the browser allows it
   - Instagram, Snapchat, Twitch have no "post from a web page" link: the card is saved, the caption is copied, and the app/site opens
   Nothing is uploaded anywhere; the picture is made on the device. */
const SH={spec:null,blob:null,file:null,url:'',note:''};

  while(c.measureText(t).width>maxW&&t.length>1) t=t.slice(0,-1).replace(/\s+$/,''); if(t!==orig) t+='…';

function shSlipSpec(src,ds){
  let user=shMe(), legs=[], stake=null, payout=null, sub='', mult=null;
  if(src==='bet'){ const b=(SOC.bets||[]).find(x=>String(x.id)===ds.id); if(!b||b.status!=='won') return null; legs=shSlipRows((b.bet_legs||[]).slice().sort((x,y)=>x.id-y.id)); stake=+b.stake; payout=+b.payout; sub=legs.length>1?legs.length+'-leg parlay':'straight bet'; }
  else if(src==='local'){ const b=P.bets[+ds.i]; if(!b||b.status!=='won') return null; user='my picks'; legs=shSlipRows(b.legs); stake=+b.stake; payout=+b.payout; sub=legs.length>1?legs.length+'-leg parlay':'straight bet'; }
  else if(src==='prof'){ const pc=SOC.prof[(ds.u||'').toLowerCase()]; const s=pc&&pc.d&&pc.d.slips&&(pc.d.slips.recent||[])[+ds.i]; if(!s||s.status!=='won') return null; user=ds.u; legs=shSlipRows(s.legs); stake=+s.stake; payout=+s.payout; sub=legs.length>1?legs.length+'-leg parlay':'straight bet'; }
  else if(src==='spec'){ const b=BT.det&&(BT.det.bets||[]).find(x=>String(x.id)===ds.id); if(!b||b.status!=='won') return null; legs=[{label:b.label,price:b.price,res:'W'}]; stake=+b.stake; payout=+b.payout; sub='battle bet'; }
  else if(src==='bparl'){ const d=BT.det; const p=d&&(d.parlays||[]).find(x=>String(x.user_id)===ds.uid); if(!p||!(+p.payout>0)) return null; user=p.username||user; legs=shSlipRows(p.graded||p.legs); stake=100; payout=+p.payout; sub='battle parlay'; }
  else return null;
  if(!legs.length) return null; legs.forEach(l=>{ if(l.res==='') l.res='W'; });
  const dec=legs.filter(l=>l.res!=='V').reduce((a,l)=>a*(l.price!=null?decOf(l.price):1),1); const am=legs.every(l=>l.price!=null)?fo(amerOfDec(dec)):'';
  const meta=(stake!=null?'Stake '+cn(stake)+' coins':'')+(am?' · odds '+am:'')+(legs.length>1?' · all '+legs.length+' legs hit':'');
  return {kind:'slip',user:user,sub:sub,payout:cn(payout),legs:legs,meta:meta,cta:'Beat my slip on Line Scout',caption:'✅ '+(user===shMe()||user==='my picks'?'My':user+'’s')+' '+sub+' just cashed on Line Scout: '+legs.slice(0,3).map(l=>l.label).join(' + ')+(legs.length>3?' + '+(legs.length-3)+' more':'')+' paid '+cn(payout)+' coins'+(stake!=null?' on a '+cn(stake)+' stake':'')+'. Practice coins only.',file:'line-scout-slip'};
}

document.addEventListener('click',function(e){
  const t=e.target.closest&&e.target.closest('[data-act]'); if(!t) return; const act=t.getAttribute('data-act');
  if(act.indexOf('sh-')!==0&&act.indexOf('vsf-')!==0) return;
  e.stopPropagation(); e.preventDefault();
  if(act==='vsf-close'){ vsfClose(); return; }
  if(act==='vsf-open'){ vsfShow(); return; }
  if(act==='sh-close'){ shClose(); return; }
  if(act==='sh-go'){ shGo(t.getAttribute('data-p')); return; }
  if(act==='sh-open'){ const k=t.getAttribute('data-k'); let sp=null;
    if(k==='battle') sp=shBattleSpec();
    else if(k==='badge') sp=shBadgeSpec(t.getAttribute('data-u'),t.getAttribute('data-b'),t.getAttribute('data-sp'));
    else if(k==='slip') sp=shSlipSpec(t.getAttribute('data-src'),{id:t.getAttribute('data-id'),i:t.getAttribute('data-i'),u:t.getAttribute('data-u'),uid:t.getAttribute('data-uid')});

},true);
