<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4fc4">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Line Scout">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png">
<meta name="description" content="Line Scout: practice sports-betting scouting with play money. Not a sportsbook.">
<title>Line Scout</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one column scouting sheet. Header + league tabs, then one card per game; each card stacks lines, Crossroads, team patterns, injury report and a drawer for the SGP builder. Parlay slip is a bottom bar. */
/* palette: blue sportsbook look; every colour is a token */
:root{
  --bg:#eef2f7; --surface:#ffffff; --surface2:#f3f6fb; --ink:#0e1a2b; --muted:#566880; --line:#dbe3ee;
  --accent:#1766e6; --accent-ink:#ffffff; --accent-soft:#dcebff;
  --over:#12915a; --under:#d6403a; --safe:#1766e6; --hot:#d9541a; --cold:#2b7fd1; --warn:#9a6200;
  --over-soft:#dcf3e6; --under-soft:#fbe1df; --warn-soft:#fbefd0; --safe-soft:#dce8fb; --hot-soft:#fbe3d5; --cold-soft:#dcebf8;
  --hdr:#0b4fc4; --hdr-ink:#ffffff;
  --shadow:0 1px 2px rgba(14,26,43,.07);
  --f-display:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09101c; --surface:#121b2d; --surface2:#182339; --ink:#e6edf8; --muted:#93a4bd; --line:#26344d;
  --accent:#4d98ff; --accent-ink:#04122b; --accent-soft:#14284a;
  --over:#2fcb7e; --under:#f06d66; --safe:#7db0ff; --hot:#ff8d52; --cold:#6db6f5; --warn:#e3ae3f;
  --over-soft:#12352a; --under-soft:#3a1f1e; --warn-soft:#352b12; --safe-soft:#17284a; --hot-soft:#3a2315; --cold-soft:#162b3d;
  --hdr:#0f2a5c; --hdr-ink:#ffffff;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09101c; --surface:#121b2d; --surface2:#182339; --ink:#e6edf8; --muted:#93a4bd; --line:#26344d;
  --accent:#4d98ff; --accent-ink:#04122b; --accent-soft:#14284a;
  --over:#2fcb7e; --under:#f06d66; --safe:#7db0ff; --hot:#ff8d52; --cold:#6db6f5; --warn:#e3ae3f;
  --over-soft:#12352a; --under-soft:#3a1f1e; --warn-soft:#352b12; --safe-soft:#17284a; --hot-soft:#3a2315; --cold-soft:#162b3d;
  --hdr:#0f2a5c; --hdr-ink:#ffffff;
  --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;padding-inline:0;padding-block:0 170px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:14px;padding-inline:16px;padding-block:14px 0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
.disp{font-family:var(--f-display);letter-spacing:.01em}
.muted{color:var(--muted)}
.small{font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-size:36px;line-height:1;font-weight:700;letter-spacing:.01em}
.brand .asof{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:500;font-size:13px}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.how{border:1px solid var(--line);background:var(--surface);border-radius:10px}
.how summary{padding:10px 14px;cursor:pointer;font-weight:500}
.how .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:13px}
.how b{color:var(--ink);font-weight:600}

/* game card */
.game{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.ghead{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.lg{font-family:var(--f-mono);font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--ink)}
.matchup{display:flex;align-items:center;justify-content:space-between;gap:12px}
.team{display:flex;align-items:center;gap:10px;min-width:0}
.chip{width:38px;height:38px;flex:none;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px;color:#fff;border:2px solid transparent}
.tn{min-width:0}
.tn .n{font-family:var(--f-display);font-size:22px;line-height:1.05;font-weight:600}
.tn .r{font-size:12px;color:var(--muted)}
.at{color:var(--muted);font-family:var(--f-mono);font-size:12px}
.sec{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.sec>h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec>h3 .hint{letter-spacing:0;text-transform:none;font-weight:400}

/* lines */
.lines{width:100%;border-collapse:collapse;font-size:13px}
.lines th{font-weight:500;color:var(--muted);text-align:right;padding:2px 0 6px;font-size:12px}
.lines th:first-child,.lines td:first-child{text-align:left}
.lines td{padding:6px 0;border-top:1px solid var(--line);text-align:right}
.lines td:first-child{font-weight:600}
.lines .px{color:var(--muted);margin-left:6px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--surface2);white-space:nowrap}
.badge.lean{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.badge.hot{background:var(--hot-soft);border-color:transparent;color:var(--hot)}
.badge.cold{background:var(--cold-soft);border-color:transparent;color:var(--cold)}
.badge.ok{background:var(--over-soft);color:var(--over);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--under-soft);color:var(--under);border-color:transparent}
.badge.back{background:var(--safe-soft);color:var(--safe);border-color:transparent}
.badges{display:flex;gap:6px;flex-wrap:wrap}

/* crossroads */
.cr-row{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.cr-title{font-weight:600;font-size:13px}
.cr-vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.meter{height:8px;border-radius:99px;background:var(--line);position:relative;overflow:visible}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent)}
.meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;border-radius:2px}
.cr-num{font-family:var(--f-mono);font-weight:600;font-size:15px}
.cr-lab{font-size:11px;color:var(--muted)}
.edge{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.edge.pos{background:var(--over-soft);color:var(--over)}
.edge.neg{background:var(--under-soft);color:var(--under)}
.proj{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kv{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface2)}
.kv .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kv .v{font-family:var(--f-mono);font-weight:600;font-size:15px;margin-top:2px}
.kv .s{font-size:11px;color:var(--muted)}
details.d{font-size:12px;color:var(--muted)}
details.d summary{cursor:pointer;color:var(--ink);font-weight:500}
details.d ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}

/* team patterns */
.pat{display:grid;grid-template-columns:1fr;gap:12px}
.strip{display:flex;gap:3px}
.strip .b{flex:1;min-width:0;text-align:center;border-radius:5px;padding:3px 0 2px;font-size:11px;line-height:1.15;font-family:var(--f-mono)}
.strip .b strong{display:block;font-size:12px}
.strip .w{background:var(--over-soft);color:var(--over)}
.strip .l{background:var(--under-soft);color:var(--under)}
.pat .row{display:flex;flex-direction:column;gap:6px}
.pat .cap{display:flex;justify-content:space-between;gap:8px;font-size:12px;flex-wrap:wrap}
.pat .cap b{font-weight:600}

/* injuries */
.inj{display:grid;grid-template-columns:1fr;gap:12px}
.inj .tm{display:flex;flex-direction:column;gap:6px}
.inj .tm h4{margin:0;font-size:13px;font-weight:600}
.ij{display:flex;flex-direction:column;gap:1px;padding:6px 0;border-top:1px solid var(--line)}
.ij .l1{display:flex;gap:8px;align-items:center;justify-content:space-between}
.ij .nm{font-weight:500}
.ij .nt{font-size:12px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:500;font-size:12px;text-align:left}

/* drawer */
.drawerbtn{width:100%;border:0;border-top:1px solid var(--line);background:var(--accent);color:var(--accent-ink);padding:14px 16px;font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.drawerbtn[aria-expanded="true"]{background:var(--ink);color:var(--surface)}
.drawer{border-top:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:14px;background:var(--surface2)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:500;font-size:13px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.legs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
.leg{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.leg .t{font-weight:600;font-size:13px}
.leg .pr{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.leg.on{background:var(--accent-soft);border-color:var(--accent)}
.leg.on .t{color:var(--accent)}
.leg:disabled{opacity:.45;cursor:not-allowed}
.safelist{display:flex;flex-direction:column;gap:4px}
.safelist .it{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%;text-align:left}
.safelist .it span:first-child{min-width:0}
h4.sub{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* player */
.pl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pl-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.pl-n{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.1}
.pl-n small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.tabs2{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.tabs2 button{flex:none;border:1px solid var(--line);background:var(--surface2);border-radius:7px;padding:5px 10px;font-size:12px;font-weight:500}
.tabs2 button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:var(--f-mono);fill:var(--muted)}
svg.chart text.val{fill:var(--ink);font-weight:600}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .over{fill:var(--over)}
svg.chart .under{fill:var(--under)}
svg.chart .sel{stroke:var(--ink);stroke-width:2}
svg.chart .bk{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 3;opacity:.8}
svg.chart .sf{stroke:var(--safe);stroke-width:2;stroke-dasharray:1.5 3.5;stroke-linecap:round}
svg.chart text.bkl{fill:var(--ink)}
svg.chart text.sfl{fill:var(--safe);font-weight:600}
svg.chart text.bkl,svg.chart text.sfl{paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:6px}
.pnotes{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.pnotes .w{color:var(--warn)}
.grade{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;font-family:var(--f-display);font-weight:700;font-size:17px;color:#fff}
.g-A{background:#1f9a5f}.g-B{background:#64a935}.g-C{background:#c8962a}.g-D{background:#d4682b}.g-F{background:#c9423b}.g-x{background:#7f8c87}
.alt{display:flex;gap:6px;flex-wrap:wrap}
.alt .leg{padding:5px 8px}
.alt .leg .t{font-size:12px}

/* slip */
.slipbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--surface);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;box-shadow:0 -6px 18px rgba(0,0,0,.18)}
.slipbar .in{max-width:760px;width:100%;margin-inline:auto;display:flex;flex-direction:column;gap:8px}
.slipsum{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:none;border:0;color:inherit;padding:0;text-align:left;width:100%}
.slipsum .a{font-weight:600}
.slipsum .b{font-family:var(--f-mono);font-size:13px}
.slipbody{max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.sl{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid rgba(127,127,127,.35);padding:6px 0;font-size:13px}
.sl .x{background:none;border:1px solid rgba(127,127,127,.5);color:inherit;border-radius:6px;padding:2px 8px;font-size:12px}
.slipbar .btn{background:transparent;color:inherit;border-color:rgba(127,127,127,.5)}
.slipnote{font-size:11px;opacity:.75}
.foot{color:var(--muted);font-size:12px;display:flex;flex-direction:column;gap:6px;padding-block:4px}
@media (min-width:640px){.pat,.inj{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:no-preference){.leg,.btn,.tab{transition:background .12s,border-color .12s}}

/* views, bank, live */
.brand{justify-content:space-between}
.bank{font-size:12px;color:var(--muted);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;white-space:nowrap}
.bank b{color:var(--ink);font-size:13px}
.vtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.vtab{border:0;background:transparent;padding:10px 6px;font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:.02em}
.vtab+.vtab{border-left:1px solid var(--line)}
.vtab[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);max-width:100%}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.score .big{font-size:44px;font-weight:600;line-height:1}
.score .clk{font-size:15px;font-weight:600;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.wp{display:flex;height:26px;border-radius:8px;overflow:hidden;font-size:12px;font-weight:600;font-family:var(--f-mono)}
.wpa,.wph{display:flex;align-items:center;padding:0 8px;min-width:0;white-space:nowrap;overflow:hidden;transition:width .3s}
.wpa{background:var(--cold-soft);color:var(--cold)}
.wph{background:var(--over-soft);color:var(--over);justify-content:flex-end}
.flash{border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:13px}
.livenote{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px}
.it.best{align-items:flex-start;gap:10px}
.it.best .bt{display:flex;flex-direction:column;gap:2px;min-width:0}
.it.best .why{font-size:12px;color:var(--muted)}
.it.best .bp{text-align:right;white-space:nowrap;font-size:13px}
.it.best.on{background:var(--accent-soft);border-color:var(--accent)}
.feed{display:flex;flex-direction:column;gap:2px;font-size:13px}
.fi{padding:3px 0;border-top:1px solid var(--line)}
.fi.score{font-weight:600}
.fi.inj{color:var(--under)}
.manual{display:flex;flex-direction:column;gap:8px}
.mfields{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mfields label,.mst label{display:flex;align-items:center;gap:4px;font-size:12px}
input.num,select{font:inherit;font-family:var(--f-mono);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:5px 7px;min-width:0}
input.num.wide{width:100%;font-family:var(--f-body)}
.mrows{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.mrow{border-top:1px solid var(--line);padding-top:6px}
.mn{font-weight:600;font-size:13px}
.mst{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
.mst .sm{font-size:11px}
/* chart additions */
svg.chart .old{opacity:.5}
svg.chart rect.dnp{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:3 2}
svg.chart text.dnpt{font-size:6.5px}
/* slip additions */
.slipscroll{max-height:72vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:2px}
.slipbody{max-height:none;overflow:visible}
.slipbar .seg{background:transparent;border-color:rgba(127,127,127,.5);align-self:flex-start}
.slipbar .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.stakerow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sl-l{display:flex;align-items:center;gap:4px;font-weight:600}
.stk{width:96px;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.slipbar input.num{background:var(--surface);color:var(--ink)}
.calc{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px}
.warnt{color:#ffb4ae;opacity:1}
.slipbar .btn.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.slipbar .btn.bk{text-decoration:none;color:inherit;display:inline-block}
#toast{position:fixed;left:16px;right:16px;bottom:calc(150px + env(safe-area-inset-bottom,0px));max-width:560px;margin-inline:auto;z-index:30;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:500;box-shadow:0 6px 18px rgba(0,0,0,.25)}
/* slips view */
.bankbig{font-size:38px;font-weight:600;line-height:1.1}
.stakerow2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stakerow2 label{display:flex;align-items:center;gap:4px;font-weight:600}
.chips2{display:flex;gap:6px;flex-wrap:wrap}
.x2,.slipbar .x{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:500}
.slipbar .x{background:transparent;border-color:rgba(127,127,127,.5);color:inherit}

/* ===== v3: blue sportsbook look ===== */

.hd .tabs{gap:6px}

.dgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}

.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 14px rgba(5,20,60,.08)}

.nb{position:absolute;top:5px;left:calc(50% + 8px);background:var(--under);color:#fff;border-radius:999px;font-size:10px;font-style:normal;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px}

.ogrid{display:flex;flex-direction:column;gap:6px}

.booststrip{display:flex;flex-direction:column;gap:6px}
.bhead{font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:#ffb62e}
.bhead span{font-weight:400;color:#c9d6ee}
.boostrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity}
.boostc{flex:none;width:172px;scroll-snap-align:start;text-align:left;border:1px solid #3a4a6b;background:transparent;color:#eaf1ff;border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}

.bnm{font-size:12px;line-height:1.25}

.bst{color:#ffb62e;font-weight:700}

.rg{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}

.odds3{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}

.lrow{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}

.mos{display:flex;gap:6px;align-items:flex-end;height:64px}

.mos .mo i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.lbox ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}

.bt3{font-size:15px;font-weight:800;display:flex;justify-content:space-between;gap:8px;align-items:baseline;text-transform:none;letter-spacing:0;color:var(--ink)}
.brow{border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.brow.me{border-color:var(--accent)}
.brow summary{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 12px;cursor:pointer;list-style:none}
.brow summary::-webkit-details-marker{display:none}
.brow .rk{font-weight:800;color:var(--accent);text-align:center}
.brow .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .pf{font-weight:700}
.brow .pf.g{color:var(--over)}.brow .pf.r{color:var(--under)}
.brow .bd{padding:0 12px 12px;display:flex;flex-direction:column;gap:6px}
.brow .bs{border-top:1px solid var(--line);padding-top:6px;display:flex;flex-direction:column;gap:2px}
.selfcard{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}

.ctxk{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.02em;padding:1px 7px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);margin-right:2px}
.ctxk.star{background:var(--warn-soft);color:var(--warn);border-color:transparent}

/* ===== v4: live feed visuals ===== */
.livedot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff2d2d;box-shadow:0 0 0 0 rgba(255,45,45,.7);animation:lpulse 1.4s infinite;vertical-align:middle}
.livedot.dim{background:#8a97ad;animation:none;box-shadow:none}
@keyframes lpulse{0%{box-shadow:0 0 0 0 rgba(255,45,45,.65)}70%{box-shadow:0 0 0 9px rgba(255,45,45,0)}100%{box-shadow:0 0 0 0 rgba(255,45,45,0)}}
.liveb{display:inline-flex;align-items:center;gap:5px;background:#ff2d2d;color:#fff;font-weight:800;font-size:11px;letter-spacing:.08em;padding:2px 8px;border-radius:999px}
.liveb .livedot{background:#fff;width:7px;height:7px;animation:lblink 1s infinite;box-shadow:none}
@keyframes lblink{50%{opacity:.25}}
.game.islive{border-color:#ff2d2d;box-shadow:0 0 0 1px rgba(255,45,45,.35),0 6px 22px rgba(255,45,45,.12)}
.nv .livedot{position:absolute;top:8px;left:calc(50% + 7px);width:8px;height:8px}
.dcell .livedot{position:absolute;top:4px;right:4px;width:7px;height:7px}
.dcell{position:relative}
.posb{color:var(--accent);font-size:10px}
.age{text-align:right}
.age.stale{color:var(--warn);font-weight:600}
.viz{position:relative;display:flex;flex-direction:column;gap:8px;overflow:hidden;border-radius:12px}
.fld,.crt,.dia,.zn{width:100%;display:block;border-radius:10px}
.fld .gA{fill:#2f8a49}.fld .gB{fill:#2a7d42}
.fld .yl{stroke:rgba(255,255,255,.45);stroke-width:.25}.fld .yl.m{stroke:rgba(255,255,255,.75);stroke-width:.35}
.fld .yn{fill:rgba(255,255,255,.7);font-size:3.6px;font-weight:700;font-family:var(--f-body)}
.fld .ez{fill:#fff;font-size:5px;font-weight:800;letter-spacing:.2em;font-family:var(--f-body)}
.fld .ball{transition:transform 1s cubic-bezier(.2,.75,.2,1)}
.fld .los{stroke:#4d98ff;stroke-width:.7;transition:opacity .3s}
.fld .fdl{stroke:#ffd23a;stroke-width:.7;transition:opacity .3s}
.fld .drv{fill:none;stroke:rgba(255,255,255,.55);stroke-width:.6;stroke-dasharray:1.2 1.2;stroke-linecap:round}
.fld .trl{fill:none;stroke:#fff;stroke-width:1.1;stroke-linecap:round;opacity:0}
.fld .trl.run{stroke:#ffd23a;stroke-width:1.6}.fld .trl.sack,.fld .trl.turn{stroke:#ff5a52}.fld .trl.pen{stroke:#ffd23a}.fld .trl.score{stroke:#7dffb0;stroke-width:1.6}
.playchip{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 10px;font-size:12px;min-height:48px;border-left:4px solid var(--accent)}
.playchip b{font-size:13px;letter-spacing:.04em}
.playchip span{color:var(--muted);overflow-wrap:anywhere}
.playchip.score{border-left-color:#ffb62e;background:var(--warn-soft)}.playchip.turn,.playchip.sack{border-left-color:var(--under)}.playchip.pen{border-left-color:#ffb62e}.playchip.run{border-left-color:var(--over)}
.playchip.pop{animation:chpop .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes chpop{0%{transform:translateY(8px) scale(.96);opacity:0}100%{transform:none;opacity:1}}
.cel{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center;opacity:0}
.cel.go{animation:celfade 2.6s ease-out forwards}
@keyframes celfade{0%{opacity:0}8%{opacity:1}75%{opacity:1}100%{opacity:0}}
.cel .celt{font-size:30px;font-weight:900;letter-spacing:.06em;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6),0 0 24px #ffb62e;animation:celt 2.4s cubic-bezier(.2,1.5,.4,1)}
@keyframes celt{0%{transform:scale(.2) rotate(-6deg)}25%{transform:scale(1.15) rotate(2deg)}40%{transform:scale(1)}100%{transform:scale(1.06)}}
.cel i{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:2px;background:var(--c);animation:conf 1.8s ease-out var(--dl) forwards;opacity:0}
@keyframes conf{0%{opacity:1;transform:rotate(var(--a)) translateX(0)}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d)) translateY(60px)}}
.mlbviz{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:10px;align-items:start}
.dia .grs{fill:#2f8a49}.dia .drt{fill:#b07a4a}.dia .grs2{fill:#2a7d42}.dia .fl{stroke:#fff;stroke-width:1.2}
.dia .bs{fill:#fff;stroke:#7a5a3a;stroke-width:1.4;transition:fill .3s}
.dia .bs.on{fill:#ffd23a;stroke:#fff}
.dia .bs.bump{animation:bump .6s ease-out}
@keyframes bump{50%{transform:scale(1.5);transform-box:fill-box;transform-origin:center}}
.dia .hp{fill:#fff}.dia .hit{fill:#fff;stroke:#2a2a2a;stroke-width:1}.dia .hs{fill:#ff5a52;stroke:#fff;stroke-width:1}
.zwrap{display:flex;flex-direction:column;gap:6px}
.zn{background:var(--surface2);border:1px solid var(--line)}
.zn .zone{fill:none;stroke:var(--muted);stroke-width:1.5}.zn .zl{stroke:var(--line);stroke-width:.7}
.zn .pd{stroke:#fff;stroke-width:.8}.zn .pd.ball{fill:#4d98ff}.zn .pd.strike{fill:#ff5a52}.zn .pd.swing{fill:#ff9a3a}.zn .pd.foul{fill:#ffd23a}.zn .pd.inplay{fill:#fff;stroke:#333}
.zn .pd.pop{transform-box:fill-box;transform-origin:center;animation:dpop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes dpop{0%{transform:scale(0)}100%{transform:scale(1)}}
.zn .pv{font-size:7px;fill:var(--muted);text-anchor:middle;font-family:var(--f-mono)}
.cnt{display:flex;flex-direction:column;gap:4px;font-size:12px}
.cnt .cr{display:flex;gap:5px;align-items:center}.cnt .cr span{width:12px;font-weight:700;color:var(--muted)}
.cnt i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line);background:transparent}
.cnt i.cb.on{background:#4d98ff;border-color:#4d98ff}.cnt i.cs.on{background:#ff5a52;border-color:#ff5a52}.cnt i.co.on{background:#ffb62e;border-color:#ffb62e}
.cnt .who{color:var(--muted)}
.crt .cfl{fill:#c98f55}.crt .paint{fill:#b3722f;stroke:#fff;stroke-width:.3}.crt .cl{stroke:#fff;stroke-width:.3;fill:none}.crt .rim{fill:none;stroke:#ff6a2a;stroke-width:.5}
.crt .bb{fill:#ff8a3a;stroke:#6b2d00;stroke-width:.3}
.crt .sm{fill:#2fcb7e;stroke:#fff;stroke-width:.3}.crt .sx line{stroke:#ff5a52;stroke-width:.6;stroke-linecap:round}
.crt .pop{transform-box:fill-box;transform-origin:center;animation:dpop .45s cubic-bezier(.2,1.6,.4,1)}
.wpc{width:100%;height:auto;display:block;background:var(--surface2);border-radius:10px;border:1px solid var(--line)}
.wpc .mid{stroke:var(--line);stroke-dasharray:3 3}.wpc .espn{fill:none;stroke:var(--accent);stroke-width:2}.wpc .mine{fill:none;stroke:var(--hot);stroke-width:1.6;stroke-dasharray:4 2}.wpc .dotE{fill:var(--accent)}
.legend i.lg1{background:var(--accent)}.legend i.lg2{background:var(--hot)}
.feed2{display:flex;flex-direction:column;max-height:340px;overflow-y:auto}
.feed2 .pf{display:grid;grid-template-columns:62px minmax(0,1fr);gap:2px 8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.feed2 .pf .t{overflow-wrap:anywhere}
.feed2 .pf .sco{grid-column:2;font-weight:700;color:var(--accent);font-size:12px}
.feed2 .pf.sc{background:var(--warn-soft);border-radius:6px;padding-inline:6px;font-weight:600}
.feed2 .pf.fresh{animation:slidein .5s ease-out}
@keyframes slidein{0%{transform:translateY(-10px);opacity:0;background:var(--accent-soft)}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.fld .ball{transition:none}.livedot,.liveb .livedot{animation:none}.playchip.pop,.feed2 .pf.fresh{animation:none}}

/* ===== modern stadium look for the live field / diamond / court ===== */
.viz{background:radial-gradient(120% 90% at 50% 0%,#18304f 0%,#0a1322 70%);padding:6px 6px 8px;border-radius:18px;border:1px solid rgba(120,160,220,.25);box-shadow:0 12px 30px rgba(3,10,25,.45)}
.vz-field{position:relative;perspective:900px;padding-top:22px;overflow:hidden;border-radius:14px}

.vz-plate.home{justify-self:end}

.vz-plate span{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

/* finish flash */
.vsflash{position:fixed;inset:0;z-index:900;display:grid;place-items:center;padding:16px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#12203c,#040812);animation:vsfBg .3s ease-out;color:#fff}
.vsflash::before{content:"";position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:vsfWhite .7s ease-out}
.vsf-in{position:relative;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.vsf-t{font-size:34px;font-weight:900;letter-spacing:.14em;color:#ffc83d;animation:vsfT .7s cubic-bezier(.2,1.5,.4,1) both}
.vsf-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center;width:100%}

.vsf-av,.vsf-av.av{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:900;background:rgba(5,10,20,.55);border:4px solid rgba(255,255,255,.7);overflow:hidden;position:relative}
.vsf-nm{font-weight:800;font-size:17px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.vsf-p.win{border-color:#ffc83d;box-shadow:0 0 34px rgba(255,200,61,.55);transform:scale(1.07);animation:vsfWin .9s cubic-bezier(.2,1.4,.4,1) .2s both}

.vsf-p.tie{animation:vsfTie .7s ease-out .2s both}
.vsf-crown{position:absolute;top:-22px;width:44px;height:28px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));animation:vsfCrown .8s cubic-bezier(.2,1.6,.4,1) .7s both}
.vsf-sc{font-size:20px;font-weight:800}.vsf-line{font-size:15px;opacity:.9}

@keyframes vsfBg{from{opacity:0}to{opacity:1}}
@keyframes vsfWhite{0%{opacity:.95}100%{opacity:0}}
@keyframes vsfT{0%{transform:scale(2.4);opacity:0}100%{transform:scale(1);opacity:1}}

@keyframes vsfCrown{0%{transform:translateY(-40px) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes vsfConf{0%{transform:rotate(var(--a)) translateY(0) rotate(0);opacity:1}100%{transform:rotate(var(--a)) translateY(calc(-1 * var(--d))) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion: reduce){.vsflash,.vsflash::before,.vsflash *{animation:none!important}.vsf-conf{display:none}}

function visMiles(st){
  if(!st.miles||!st.miles.length) return [];
  const arr = st.miles.map(m=>({m, d:Math.abs(m.t-st.line)})).sort((a,b)=>a.d-b.d).slice(0,5).map(x=>x.m);
  return arr.sort((a,b)=>a.t-b.t);
}

const inSlip = tok => S.slip.some(l=>l.id===tok);
function toggleLeg(tok){
  const i=S.slip.findIndex(l=>l.id===tok);
  if(i>=0){S.slip.splice(i,1);return;}
  const leg=legFor(tok); if(!leg) return;
  const j=S.slip.findIndex(l=>l.group===leg.group); if(j>=0) S.slip.splice(j,1);
  S.slip.push(leg);
}
function countSelections(g){
  let n=6;
  g.players.forEach(pl=>pl.stats.forEach(st=>{ n+=1; if(st.safeAdj!=null) n+=1; n+=visMiles(st).length; }));
  return n;
}
/* ---------- pieces ---------- */
function chipOf(t){ const u=typeof logoUrl==='function'?logoUrl(t.lg,t):''; return '<div class="chip'+(u?' haslogo':'')+'" style="background:'+esc(t.color)+';border-color:'+esc(t.alt)+'">'+(u?'<img alt="" loading="lazy" src="'+esc(u)+'" onerror="this.remove()">':'')+'<span>'+esc(t.abbr.length>3?t.abbr.slice(0,3):t.abbr)+'</span></div>'; }

function crossroads(g){
  const cr=g.crossroads,a=g.teams.away,h=g.teams.home,N=g.n||LEAGUE_N[g.lg];
  if(g.bookOnly) return bookOnlyBox(g);
  const unit = g.lg==='mlb'?'runs':'pts';
  const matchup = m=>{
    const gap=m.gap, cls=gap>=0?'pos':'neg';
    const [oa,ob]=[m.offBase,m.off];
    return '<div class="cr-row"><div class="cr-title">'+esc(m.title)+'</div>'+
      '<div class="cr-vs"><div><div class="cr-lab">Offense · #'+m.offRank+'/'+N+'</div><div class="cr-num">'+m.off+(oa!==ob?' <span class="muted small">was '+oa+'</span>':'')+'</div>'+
      '<div class="meter"><i style="width:'+m.off+'%"></i><b style="left:'+m.offBase+'%"></b></div></div>'+
      '<span class="edge '+cls+'">'+(gap>=0?'+':'')+Math.round(gap)+'</span>'+
      '<div><div class="cr-lab">Defense · #'+m.dfnRank+'/'+N+'</div><div class="cr-num">'+m.dfn+(m.dfnBase!==m.dfn?' <span class="muted small">was '+m.dfnBase+'</span>':'')+'</div>'+
      '<div class="meter"><i style="width:'+m.dfn+'%"></i><b style="left:'+m.dfnBase+'%"></b></div></div></div></div>';
  };
  const leans = cr.leans.length ? '<div class="badges">'+cr.leans.map(l=>'<span class="badge lean" title="'+esc(l.why)+'">'+esc(l.text)+'</span>').join('')+'</div><div class="small muted">'+cr.leans.map(l=>esc(l.why)).join(' · ')+'</div>'
    : '<div class="small muted">No lean: the model and the book agree within the threshold for this sport.</div>';
  const notes = [].concat((a.injImpact.notes||[]).map(x=>a.abbr+': '+x),(h.injImpact.notes||[]).map(x=>h.abbr+': '+x));
  const notesHtml = notes.length ? '<details class="d"><summary>Injury adjustments used ('+a.abbr+' −'+n1(a.injImpact.off)+' '+unit+', '+h.abbr+' −'+n1(h.injImpact.off)+' '+unit+')</summary><ul>'+notes.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></details>'
    : '<div class="small muted">No injury adjustment applied: nothing on either report moves the numbers.</div>';
  return '<div class="sec"><h3>Crossroads <span class="hint">offense vs defense, with injuries</span></h3>'+
    matchup(cr.matchups[0])+matchup(cr.matchups[1])+
    '<div class="proj">'+
      '<div class="kv"><div class="k">Model score</div><div class="v">'+n1(cr.projAway)+' – '+n1(cr.projHome)+'</div><div class="s">'+esc(a.abbr)+' – '+esc(h.abbr)+' · before injuries '+n1(cr.projAwayNoInj)+' – '+n1(cr.projHomeNoInj)+'</div></div>'+
      '<div class="kv"><div class="k">Model total</div><div class="v">'+n1(cr.projTotal)+'</div><div class="s">book '+g.lines.total+'</div></div>'+
      '<div class="kv"><div class="k">'+esc(h.abbr)+' win chance</div><div class="v">'+pct(cr.pHome)+'</div><div class="s">book '+pct(cr.bookHome)+' (no vig)</div></div>'+
    '</div>'+leans+ctxBox(g)+learnedBox(g)+notesHtml+
  '</div>';
}

function patterns(g){
  const one = t=>{
    const rec=t.recent||[];
    const pf=rec.length?rec.reduce((s,x)=>s+x.pf,0)/rec.length:0, pa=rec.length?rec.reduce((s,x)=>s+x.pa,0)/rec.length:0;
    const w=rec.filter(x=>x.win).length;
    return '<div class="row"><div class="cap"><b>'+esc(t.name)+'</b><span class="muted">last '+rec.length+': '+w+'-'+(rec.length-w)+' · avg '+n1(pf)+' for, '+n1(pa)+' against</span></div>'+
      '<div class="strip" role="img" aria-label="Last '+rec.length+' results, oldest to newest">'+rec.map(x=>'<div class="b '+(x.win?'w':'l')+'" title="'+esc(fmtDate(x.date)+' '+(x.home?'vs ':'@ ')+x.opp+': '+x.pf+'-'+x.pa)+'"><strong>'+(x.win?'W':'L')+'</strong>'+Math.round(x.pf)+'-'+Math.round(x.pa)+'</div>').join('')+'</div></div>';
  };
  return '<div class="sec"><h3>Team patterns <span class="hint">oldest to newest</span></h3><div class="pat">'+one(g.teams.away)+one(g.teams.home)+'</div>'+
    '<div class="small muted">ESPN does not publish past betting lines, so cover and over/under history is not shown. These strips use real results.</div></div>';
}

function injuries(g){
  const one = side=>{
    const t=g.teams[side]; const key=g.id+side;
    const order={out:0,doubtful:1,questionable:2,dtd:3,probable:4,returning:5,inactive:6,info:7};
    let list=t.injuries.slice().sort((a,b)=>(order[a.kind]??9)-(order[b.kind]??9));
    const limit=6; const show = S.allInj[key]?list:list.slice(0,limit);
    const cls=k=>({out:'bad',doubtful:'bad',questionable:'warn',dtd:'warn',probable:'ok',returning:'back',inactive:'',info:''})[k]||'';
    const rows=show.map(i=>'<div class="ij"><div class="l1"><span class="nm">'+esc(i.name)+' <span class="muted">'+esc(i.pos||'')+'</span></span><span class="badge '+cls(i.kind)+'">'+esc(i.label)+(i.reason&&i.kind==='out'?' · '+esc(i.reason):'')+'</span></div>'+
      (i.note?'<div class="nt">'+esc(i.note.length>150?i.note.slice(0,147)+'...':i.note)+'</div>':'')+'</div>').join('');
    const more = list.length>limit ? '<button class="linkbtn" data-act="allinj" data-key="'+key+'">'+(S.allInj[key]?'Show fewer':'Show all '+list.length)+'</button>' : '';
    return '<div class="tm"><h4>'+esc(t.name)+'</h4>'+(rows||'<div class="small muted">Nothing reported.</div>')+more+'</div>';
  };
  return '<div class="sec"><h3>Injury report <span class="hint">ESPN, as of the last data refresh</span></h3><div class="inj">'+one('away')+one('home')+'</div></div>';
}

/* ---------- chart ---------- */
function chart(pl,st,pid){
  const W=340,H=176,pL=8,pR=8,pT=18,pB=34;
  const vals=st.v15, slots=pl.slots, n=vals.length;
  const nums=vals.filter(v=>v!=null);
  const top=Math.max.apply(null,nums.concat([st.line,st.safeAdj||0,1]))*1.2;
  const iw=W-pL-pR, ih=H-pT-pB, bw=iw/n;
  const y=v=>pT+ih-(v/top)*ih;
  const selKey=pid+st.key; const sel = (S.bar[selKey]!=null&&S.bar[selKey]<n)?S.bar[selKey]:n-1;
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(pl.name+' '+st.label+', last '+n+' games, oldest to newest: '+vals.map(v=>v==null?'did not play':v).join(', ')+'. Line '+st.line+(st.safeAdj!=null?', safe point '+st.safeAdj:''))+'">';
  [0.5,1].forEach(f=>{ const yy=y(top*f/1.2); s+='<line class="grid" x1="'+pL+'" x2="'+(W-pR)+'" y1="'+yy+'" y2="'+yy+'"/>'; });
  s+='<line class="grid" x1="'+pL+'" x2="'+(W-pR)+'" y1="'+y(0)+'" y2="'+y(0)+'"/>';
  vals.forEach((v,i)=>{
    const g=slots[i]||{}; const x=pL+i*bw+bw*0.14, w=bw*0.72;
    const head='<g data-act="bar" data-pid="'+pid+'" data-stat="'+st.key+'" data-i="'+i+'" style="cursor:pointer">';
    const hit='<rect x="'+(pL+i*bw)+'" y="'+pT+'" width="'+bw+'" height="'+(ih+pB-4)+'" fill="transparent"/>';
    const labs='<text x="'+(x+w/2)+'" y="'+(H-17)+'" font-size="7.5" text-anchor="middle">'+esc(g.opp||'')+'</text><text x="'+(x+w/2)+'" y="'+(H-8)+'" font-size="6.5" text-anchor="middle">'+(g.home?'home':'away')+'</text>';
    if(v==null){
      s+=head+'<rect class="dnp'+(i===sel?' sel':'')+'" x="'+x+'" y="'+(y(0)-18)+'" width="'+w+'" height="18" rx="2"><title>'+esc(fmtDate(g.date)+' '+(g.home?'vs ':'@ ')+g.opp+': did not play')+'</title></rect><text class="dnpt" x="'+(x+w/2)+'" y="'+(y(0)-7)+'" text-anchor="middle">DNP</text>'+hit+labs+'</g>';
      return;
    }
    const h=Math.max(1.5,(v/top)*ih);
    const cls=(v>st.line?'over':'under')+(g.model===false?' old':'');
    s+=head+'<rect class="'+cls+(i===sel?' sel':'')+'" x="'+x+'" y="'+(y(0)-h)+'" width="'+w+'" height="'+h+'" rx="2"><title>'+esc((g.date?fmtDate(g.date)+' '+(g.home?'vs ':'@ ')+g.opp+': ':'')+v)+'</title></rect>'+hit+
      '<text class="val" x="'+(x+w/2)+'" y="'+(y(0)-h-3)+'" font-size="8.5" text-anchor="middle">'+v+'</text>'+labs+'</g>';
  });
  s+='<line class="bk" x1="'+pL+'" x2="'+(W-pR)+'" y1="'+y(st.line)+'" y2="'+y(st.line)+'"/>';
  s+='<text class="bkl" x="'+(W-pR)+'" y="'+(y(st.line)-3)+'" font-size="9" text-anchor="end">'+(st.lineSrc==='DraftKings'?'book ':'model ')+st.line+'</text>';
  if(st.safeAdj!=null){
    s+='<line class="sf" x1="'+pL+'" x2="'+(W-pR)+'" y1="'+y(st.safeAdj)+'" y2="'+y(st.safeAdj)+'"/>';
    const near=Math.abs(y(st.safeAdj)-y(st.line))<12;
    s+='<text class="sfl" x="'+pL+'" y="'+(y(st.safeAdj)+(near?11:-3))+'" font-size="9">safe '+st.safeAdj+'</text>';
  }
  s+='</svg>';
  const g=slots[sel]||{};
  const detail = g.date ? fmtDate(g.date)+' '+(g.home?'vs ':'@ ')+g.opp+(g.res?' ('+g.res+')':'')+(g.post?' · playoffs':'')+': '+(vals[sel]==null?'did not play':vals[sel]+' '+st.label.toLowerCase())+(g.model===false&&!g.dnp?' · older than the model window':'') : '';
  return s+'<div class="small muted mono">'+esc(detail)+'</div>';
}

function gradeEl(g){ return '<span class="grade g-'+(/[A-F]/.test(g)?g:'x')+'">'+esc(g)+'</span>'; }

function playerCard(g,pl){
  const key=g.id+pl.id; const sk = S.pick[key]&&pl.stats.some(s=>s.key===S.pick[key]) ? S.pick[key] : pl.stats[0].key;
  const st=pl.stats.find(s=>s.key===sk);
  const kind=pl.status.kind; const bcls={ok:'ok',probable:'ok',questionable:'warn',dtd:'warn',doubtful:'bad',out:'bad',returning:'back'}[kind]||'';
  const dis = pl.avail===0;
  const hc = st.hot==='hot'?'<span class="badge hot" title="'+esc(st.hotNote)+'">Hot streak</span>':st.hot==='cold'?'<span class="badge cold" title="'+esc(st.hotNote)+'">Cold streak</span>':'<span class="badge">Steady</span>';
  const streak = st.streak>=2 ? st.streak+' straight '+(st.streakDir==='over'?'overs':'unders') : 'no run of 2+';
  const tabs = pl.stats.map(s=>'<button data-act="stat" data-key="'+key+'" data-stat="'+s.key+'" aria-pressed="'+(s.key===sk)+'">'+esc(s.label)+'</button>').join('');
  const tOver='p:'+g.id+':'+pl.id+':'+st.key+':over', tSafe='p:'+g.id+':'+pl.id+':'+st.key+':safe';
  const safeTxt = st.safe==null ? 'None (a zero in the window)' : (st.safeAdj!==st.safe ? st.safeAdj+'+ (raw '+st.safe+'+)' : st.safe+'+')+' · '+st.n15+' of '+st.n15;
  const alts = visMiles(st).map(m=>legBtn('p:'+g.id+':'+pl.id+':'+st.key+':m:'+m.t, m.t+'+', legSub('p:'+g.id+':'+pl.id+':'+st.key+':m:'+m.t)+' · '+m.hit+'/'+m.n, dis)).join('');
  const bookPrices = st.prices&&st.prices.length ? ' · DK prices '+st.prices.map(fo).join(' / ') : '';
  const notes=[];
  notes.push(esc(st.matchupNote));
  if(st.boost>0) notes.push('Teammate usage boost +'+Math.round(st.boost*100)+'% ('+esc(pl.boostNotes.join(', '))+')');
  if(st.anchorNote) notes.push('<span class="w">'+esc(st.anchorNote)+'</span>');
  pl.flags.forEach(f=>notes.push('<span class="w">'+esc(f)+'</span>'));
  if(pl.status.note && kind!=='ok') notes.push('<span class="w">'+esc(pl.status.label)+': '+esc(pl.status.note.length>170?pl.status.note.slice(0,167)+'...':pl.status.note)+'</span>');
  if(st.lineSrc!=='DraftKings') notes.push('No book line for this stat. The line shown is a model line from recent games.');
  return '<div class="pl" id="pl-'+key+'"><div class="pl-h"><div class="pl-n">'+esc(pl.name)+'<small>'+esc(pl.pos)+' · '+esc(pl.abbr)+(pl.jersey?' #'+esc(pl.jersey):'')+'</small></div>'+
    '<div class="badges"><span class="badge '+bcls+'">'+(kind==='ok'?'Active':esc(pl.status.label))+'</span></div></div>'+
    '<div class="tabs2" role="group" aria-label="Stat">'+tabs+'</div>'+
    chart(pl,st,pl.id)+
    '<div class="legend"><span><i style="background:var(--over)"></i>cleared the line</span><span><i style="background:var(--under)"></i>missed</span><span><i style="background:var(--ink);opacity:.7"></i>book line</span><span><i style="background:var(--safe)"></i>safe point</span><span>lighter bars: older than the 10-game model window</span><span>dashed: did not play</span></div>'+
    '<div class="mgrid">'+
      '<div class="kv"><div class="k">Line</div><div class="v">'+st.line+'</div><div class="s">'+(st.lineSrc==='DraftKings'?'DraftKings':'model')+bookPrices+'</div></div>'+
      '<div class="kv"><div class="k">Safe point</div><div class="v">'+(st.safeAdj!=null?st.safeAdj+'+':'none')+'</div><div class="s">'+esc(safeTxt)+'</div></div>'+
      '<div class="kv"><div class="k">Consistency</div><div class="v">'+gradeEl(st.grade)+'</div><div class="s">'+(st.gradePct!=null?st.gradePct+'% of games near his median':'small sample')+'</div></div>'+
      '<div class="kv"><div class="k">Form</div><div class="v" style="font-family:var(--f-body)">'+hc+'</div><div class="s">'+esc(st.hotNote)+'</div></div>'+
      '<div class="kv"><div class="k">Last '+st.n15+' vs line</div><div class="v">'+st.overHits15+'/'+st.n15+' over</div><div class="s">'+streak+'</div></div>'+
      '<div class="kv"><div class="k">Projection</div><div class="v">'+st.proj+'</div><div class="s">avg '+st.avg+(st.season!=null&&st.season!==st.avg?' · season '+st.season:'')+' · lean '+esc(st.lean)+'</div></div>'+
    '</div>'+
    '<div class="btnrow">'+legBtn(tOver,'Over '+st.line,legSub(tOver),dis)+(st.safeAdj!=null?legBtn(tSafe,'Safe '+st.safeAdj+'+',legSub(tSafe),dis):'')+'</div>'+
    (alts?'<div class="small muted">Alternate lines (hit count is for the last '+st.n15+' played)</div><div class="alt">'+alts+'</div>':'')+
    '<div class="pnotes">'+notes.map(x=>'<div>'+x+'</div>').join('')+'</div></div>';
}

function bestSafe(g){
  const arr=[];
  g.players.forEach(pl=>{ if(pl.avail===0) return; pl.stats.forEach(st=>{ if(st.safeAdj!=null && st.line>0) arr.push({pl,st,r:st.safeAdj/st.line}); }); });
  return arr.sort((a,b)=>b.r-a.r).slice(0,5);
}
function buildEight(g){
  const cands=[];
  g.players.forEach(pl=>{
    if(pl.avail<0.7) return;
    let best=null;
    pl.stats.forEach(st=>{
      if(st.safeAdj!=null && st.pSafe!=null && st.safeAdj/st.line>=0.4){ const sc=st.pSafe*Math.min(1,st.safeAdj/st.line); if(!best||sc>best.sc) best={tok:'p:'+g.id+':'+pl.id+':'+st.key+':safe',sc}; }
    });
    if(!best){
      pl.stats.forEach(st=>{ if(st.lean==='Over' && !st.anchorNote){ const sc=st.pOver*0.8; if(!best||sc>best.sc) best={tok:'p:'+g.id+':'+pl.id+':'+st.key+':over',sc}; } });
    }
    if(best) cands.push(Object.assign({pid:pl.id},best));
  });
  cands.sort((a,b)=>b.sc-a.sc);
  const pick=cands.slice(0,8);
  S.slip = S.slip.filter(l=>!(l.gid===g.id && l.pid));
  pick.forEach(c=>{ const leg=legFor(c.tok); if(leg){ const j=S.slip.findIndex(l=>l.group===leg.group); if(j>=0) S.slip.splice(j,1); S.slip.push(leg);} });
  return pick.length;
}

function drawer(g){
  const gl=(kind,side,title)=>{ const tok='g:'+g.id+':'+kind+':'+side; return legBtn(tok,title,legSub(tok)); };
  const a=g.teams.away,h=g.teams.home;
  const bs=bestSafe(g).map(x=>{ const tok='p:'+g.id+':'+x.pl.id+':'+x.st.key+':safe'; return '<button class="it" data-act="leg" data-tok="'+esc(tok)+'"><span><b>'+esc(surname(x.pl.name))+'</b> '+esc(x.st.label.toLowerCase())+' safe '+x.st.safeAdj+'+ <span class="muted">(line '+x.st.line+')</span></span><span class="mono">'+(inSlip(tok)?'added':fo(x.st.safePrice))+'</span></button>'; }).join('');
  const byTeam = side=>'<h4 class="sub">'+esc(g.teams[side].name)+'</h4>'+g.players.filter(p=>p.side===side).map(p=>playerCard(g,p)).join('');
  return '<div class="drawer"><div class="small muted">Lines and player numbers come from ESPN (DraftKings lines). Prices marked est. are my own estimates from the model, not sportsbook prices.</div>'+
    '<h4 class="sub">Game lines</h4><div class="legs">'+
      gl('ml','away',a.abbr+' moneyline')+gl('ml','home',h.abbr+' moneyline')+
      gl('spr','away',a.abbr+' '+sg(g.lines.sprAway))+gl('spr','home',h.abbr+' '+sg(g.lines.sprHome))+
      gl('tot','over','Over '+g.lines.total)+gl('tot','under','Under '+g.lines.total)+'</div>'+
    (g.players.length?'<h4 class="sub">Highest safe points vs the line</h4><div class="safelist">'+(bs||'<div class="small muted">No player has a safe point in this window.</div>')+'</div>'+
    '<div class="btnrow"><button class="btn pri" data-act="build" data-gid="'+g.id+'">Build 8-player SGP</button><button class="btn" data-act="clear">Clear slip</button></div>'+
    byTeam('away')+byTeam('home')
    :'<div class="small muted" style="margin-top:8px">Pick two or more game lines above to build a same-game parlay. The sportsbook feed has no player props for this league.</div><div class="btnrow"><button class="btn" data-act="clear">Clear slip</button></div>')+'</div>';
}

function infoBlock(){
  return '<details class="how"><summary>How the numbers work</summary><div class="body">'+
    '<div><b>Safe point</b> is the highest number a player reached in every game he played in the window (up to 15 games, shown in the chart; fewer when the season is shorter). Games he missed show as DNP and are not counted as zeros. If he had a zero in a game he played, there is no safe point. When the matchup is tough or he is coming back from a missed game, a lower matchup-adjusted safe point is used. It is never raised.</div>'+
    '<div><b>Crossroads</b> rates each team\'s offense and defense from 0 to 100 using ESPN scoring numbers, then lowers a rating when key players are out or doubtful. It lines up each offense against the other side\'s defense, projects a score, and compares it with the book. A player\'s projection moves up to about 18% with the strength of the defense he faces, more for dominant players.</div>'+
    '<div><b>Injuries</b> come from the latest ESPN report. Out players cost their team points in proportion to how much of its production they carry, questionable players cost a share of that, and teammates of an absent player get a usage bump. Absences that began before a team\'s last game are already in its recent results, so they are not counted twice. Players who missed games and then returned are flagged. The per-player numbers are my estimates.</div>'+
    '<div><b>Consistency grade</b> (A to F) blends how many games landed close to the player\'s median with how far the games swing around his average. <b>Hot / cold</b> compares the last 3 games (the last game when fewer than 6 are available) with his earlier games.</div>'+
    '<div><b>Model window</b>: the projections and chances use the last 10 games a player played, with this season weighted in, then adjust for the opponent, the injury report, teammates who are out and players returning from missed games. The chart and safe points look back further (up to 15) so you can see the pattern.</div><div><b>Live tab</b>: chances change with the clock and score. Remaining production is the model projection scaled to the time left, nudged by what the player has already done, and set to zero if he is out or leaves hurt. Practice prices come from a plain baseline (season averages and book totals) so you can see where the model disagrees.</div><div><b>Limits</b>: early in a season a player may have only a few games played, so a safe point can mean just 3 of 3. DraftKings publishes a price on both sides of a line but the feed does not say which is the Over, so Over and Safe prices marked est. are mine. Lines move, and this is a snapshot. Leans are model output, not advice, and past games do not guarantee the next one.</div>'+
  '</div></details>';
}

/* ================= game context: pace, penalties, offense struggles ================= */
// Reads the live team stats (feed doc .ts) and turns them into small, shrunk adjustments to what each team
// is still expected to score, plus plain-language notes that are shown with each live bet.
const CTXC={};
const CTX_NEUTRAL={on:false,home:{mult:1,add:0,notes:[],off:0},away:{mult:1,add:0,notes:[],off:0},pace:{mult:1,note:'',ratio:1},notes:[]};
function ctxOf(g,st){
  const fd=(typeof FEED!=='undefined')?FEED[g.id]:null;
  if(!fd||!fd.ts||!fd.ts.home||!fd.ts.away||st.final||st.f<=0.04||st.f>=0.995) return CTX_NEUTRAL;
  const key=g.id+'|'+(fd.t||0)+'|'+Math.round(st.f*1000)+'|'+st.home+'-'+st.away;
  if(CTXC[key]) return CTXC[key];
  const lg=g.lg, K=g.key||g.lg, f=st.f, r=1-f, cr=g.crossroads, T=fd.ts;
  const FBK={nfl:{plmin:2.1,ypp:5.4,peny:0.85,ppd:1.9,len:60},cfb:{plmin:2.3,ypp:5.8,peny:0.95,ppd:2.1,len:60}}[K]||{plmin:2.1,ypp:5.4,peny:0.85,ppd:1.9,len:60};
  const BBK={wnba:{len:40,pace:3.95,ppp:1.02,fl:0.425},nba:{len:48,pace:4.2,ppp:1.15,fl:0.43},cbb:{len:40,pace:3.4,ppp:1.03,fl:0.43}}[K]||{len:40,pace:3.95,ppp:1.02,fl:0.425};
  const out={on:true,home:{mult:1,add:0,notes:[],off:0},away:{mult:1,add:0,notes:[],off:0},pace:{mult:1,note:'',ratio:1},notes:[]};
  const cl=(x,a,b)=>Math.max(a,Math.min(b,x));
  const sides=['home','away'];
  if(lg==='nfl'){
    const em=f*FBK.len, rm=r*FBK.len;
    const totPl=T.home.pl+T.away.pl;
    if(em>=8&&totPl>0){
      const ratio=(totPl/em)/FBK.plmin; const w=Math.min(1,f/0.45)*0.5; const m=1+cl((ratio-1)*w,-0.1,0.1);
      out.pace={mult:m,ratio:ratio,note:ratio>=1.08?'Fast pace: '+totPl+' plays in '+Math.round(em)+' minutes ('+n1(ratio*FBK.plmin*FBK.len)+' per game pace).':ratio<=0.92?'Slow pace: only '+totPl+' plays in '+Math.round(em)+' minutes ('+n1(ratio*FBK.plmin*FBK.len)+' per game pace), so fewer chances to score.':''};
    }
    sides.forEach(sd=>{
      const o=out[sd], t=T[sd], sc=sd==='home'?st.home:st.away, ab=g.teams[sd].abbr;
      if(t.pl>=10){
        const sh=t.pl/(t.pl+45); const yEff=((t.ypp-FBK.ypp)/FBK.ypp)*sh;
        const ppd=t.dr>0?sc/t.dr:FBK.ppd; const pEff=t.dr>=3?((ppd-FBK.ppd)/FBK.ppd)*(t.dr/(t.dr+8)):0;
        let eff=0.6*yEff+0.4*pEff; eff-=0.03*Math.max(0,t.to)*sh*2; eff-=0.012*Math.max(0,t.sk-2);
        o.off=cl(eff,-0.22,0.22); o.mult=1+0.6*o.off;
        if(t.ypp<=4.6&&t.pl>=20) o.notes.push(ab+' offense is struggling: '+t.ypp.toFixed(1)+' yards per play'+(t.dr>=4?' and '+sc+' points on '+t.dr+' drives':'')+(t.a3>=3?', '+t.c3+' of '+t.a3+' on third down':'')+'.');
        else if(t.ypp>=6.4&&t.pl>=20) o.notes.push(ab+' offense is rolling: '+t.ypp.toFixed(1)+' yards per play'+(t.a3>=3?', '+t.c3+' of '+t.a3+' on third down':'')+'.');
        else if(t.dr>=5&&ppd<=1.0) o.notes.push(ab+' has only '+sc+' points on '+t.dr+' drives.');
        if(t.to>=2) o.notes.push(ab+' has '+t.to+' turnovers.');
        if(t.sk>=4) o.notes.push(ab+' quarterback has taken '+t.sk+' sacks.');
      }
      const rate=(t.peny+FBK.peny*10)/(em+10); const exc=Math.max(0,(rate-FBK.peny)*rm); o.add=-cl(0.05*exc,0,3);
      if(t.pen>=7||t.peny>=60) o.notes.push(ab+' is hurting itself with penalties: '+t.pen+' for '+t.peny+' yards (about 5 for 45 is normal).');
    });
  } else if(lg==='wnba'){
    const em=f*BBK.len, rm=r*BBK.len;
    const poss={}; sides.forEach(sd=>{ const t=T[sd]; poss[sd]=t.fga+0.44*t.fta+t.tov-t.orb; });
    const totP=poss.home+poss.away;
    if(em>=6&&totP>0){
      const ratio=(totP/em)/BBK.pace; const w=Math.min(1,f/0.4)*0.6; const m=1+cl((ratio-1)*w,-0.1,0.1);
      out.pace={mult:m,ratio:ratio,note:ratio>=1.06?'Fast pace: about '+Math.round(totP/2)+' possessions each in '+Math.round(em)+' minutes.':ratio<=0.94?'Slow, grinding pace: about '+Math.round(totP/2)+' possessions each in '+Math.round(em)+' minutes.':''};
    }
    sides.forEach(sd=>{
      const o=out[sd], t=T[sd], sc=sd==='home'?st.home:st.away, ab=g.teams[sd].abbr, ps=poss[sd];
      if(ps>=15){
        const ppp=sc/ps; const sh=ps/(ps+60); const eff=((ppp-BBK.ppp)/BBK.ppp)*sh;
        o.off=cl(eff,-0.2,0.2); o.mult=1+0.7*o.off;
        if(ppp<=BBK.ppp*0.86) o.notes.push(ab+' offense is stuck: '+ppp.toFixed(2)+' points per possession ('+t.fg+'-'+t.fga+' shooting, '+t.tov+' turnovers).');
        else if(ppp>=BBK.ppp*1.13) o.notes.push(ab+' offense is humming: '+ppp.toFixed(2)+' points per possession.');
        if(t.tov>=ps*0.2&&t.tov>=6) o.notes.push(ab+' is turning it over ('+t.tov+').');
      }
      const rate=(t.fl+BBK.fl*6)/(em+6); const exc=Math.max(0,(rate-BBK.fl)*rm); o.add=-cl(0.45*exc,0,3);
      if(t.fl>=em*0.6&&t.fl>=12) o.notes.push(ab+' is in foul trouble: '+t.fl+' team fouls in '+Math.round(em)+' minutes.');
    });
  } else if(lg==='mlb'){
    const inn=f*9;
    const totPa=T.home.pa+T.away.pa;
    if(f>=0.2&&totPa>0){
      const ratio=(totPa/(f*18))/4.3; const m=1+cl((ratio-1)*0.5*Math.min(1,f/0.4),-0.1,0.1);
      out.pace={mult:m,ratio:ratio,note:ratio>=1.1?'Lots of traffic: '+totPa+' plate appearances so far.':ratio<=0.9?'Pitchers are in control: only '+totPa+' plate appearances so far.':''};
    }
    sides.forEach(sd=>{
      const o=out[sd], t=T[sd], ab=g.teams[sd].abbr;
      if(t.pa>=10){
        const sh=inn/(inn+3); const br=(t.h+t.bb)/Math.max(1,inn); const kr=t.pa?t.k/t.pa:0.22;
        let eff=((br-1.26)/1.26)*sh-(kr-0.22)*0.5*sh; o.off=cl(eff,-0.2,0.2); o.mult=1+0.6*o.off;
        if(br<=0.95&&inn>=3) o.notes.push(ab+' bats are quiet: '+t.h+' hits, '+t.bb+' walks and '+t.k+' strikeouts so far.');
        else if(br>=1.6&&inn>=3) o.notes.push(ab+' is getting traffic: '+t.h+' hits and '+t.bb+' walks so far.');
        if(t.lob>=9) o.notes.push(ab+' has stranded '+t.lob+' runners, so runs may be due.');
      }
      if(t.e>=2) o.notes.push(ab+' has '+t.e+' errors.');
    });
  }
  sides.forEach(sd=>{ out.notes=out.notes.concat(out[sd].notes); });
  if(out.pace.note) out.notes.unshift(out.pace.note);
  CTXC[key]=out; return out;
}
// scales a player's remaining production by his team's offense and the game's pace (counting stats only)
function ctxPropMult(g,st,pl,s){
  const C=ctxOf(g,st); if(!C.on) return 1;
  if(g.lg==='mlb'&&pl.fam==='P') return 1;
  const side=pl.side; const tm=C[side]?C[side].mult:1;
  return clamp(1+0.8*(tm-1)+0.8*(C.pace.mult-1),0.85,1.15);
}
function ctxNotesFor(g,st,sides,withPace){
  const C=ctxOf(g,st); if(!C.on) return [];
  let n=[]; sides.forEach(sd=>{ n=n.concat(C[sd].notes); }); if(withPace&&C.pace.note) n.unshift(C.pace.note);
  return n.slice(0,3);
}

/* ================= math ================= */
function erf(x){ const s=x<0?-1:1; x=Math.abs(x); const t=1/(1+0.3275911*x); const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x); return s*y; }
const phi=x=>0.5*(1+erf(x/Math.SQRT2));
function poisGE(k,l){ if(k<=0) return 1; if(l<=0) return 0; let term=Math.exp(-l),cdf=term; for(let i=1;i<k;i++){ term*=l/i; cdf+=term; } return clamp(1-cdf,0,1); }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return((t^t>>>14)>>>0)/4294967296; }; }
function gauss(rng){ let u=0; while(u===0) u=rng(); const v=rng(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function poisson(rng,l){ if(l<=0) return 0; const L=Math.exp(-l); let k=0,p=1; do{ k++; p*=rng(); }while(p>L&&k<80); return k-1; }

/* ================= game clock ================= */
const SDM={nfl:13.5,wnba:11.5,mlb:4.3,cfb:18,nba:14.5,cbb:13.5,nhl:2.4,tennis:5.2};      // sd of a final margin
const SDT={nfl:13.5,wnba:17,mlb:4.4,cfb:16.5,nba:18.8,cbb:17.5,nhl:2.4,tennis:4.6};        // sd of a final total
const TEAM_SD={nfl:9.5,wnba:10.5,mlb:2.9,cfb:12,nba:11,cbb:9.5,nhl:1.7,tennis:3.4};
const SECS={nfl:3600,wnba:2400,cfb:3600,nba:2880,cbb:2400,nhl:3600,tennis:3600};
const KAPPA_T=0.6;
function clockLabel(lg,f){
  if(f>=1) return 'Final';
  if(f<=0) return 'Pregame';
  if(lg==='mlb'){ const h=Math.floor(f*18+1e-9); const inn=Math.floor(h/2)+1; const outs=Math.min(2,Math.floor((f*18-h)*3+1e-9)); return (h%2?'Bot ':'Top ')+inn+(inn===1?'st':inn===2?'nd':inn===3?'rd':'th')+', '+outs+' out'+(outs===1?'':'s'); }
  if(lg==='nhl'){ const el=f*3600, p=Math.min(3,Math.floor(el/1200)+1); const rem=Math.max(0,Math.round(1200-(el-(p-1)*1200))); return 'P'+p+' '+Math.floor(rem/60)+':'+String(rem%60).padStart(2,'0'); }
  if(lg==='tennis') return 'Set '+Math.min(3,Math.floor(f*3)+1);
  const tot=SECS[lg], len=tot/4, el=f*tot; const q=Math.min(4,Math.floor(el/len)+1); const rem=Math.max(0,Math.round(len-(el-(q-1)*len)));
  return 'Q'+q+' '+Math.floor(rem/60)+':'+String(rem%60).padStart(2,'0');
}
function fFromManual(lg,m){
  if(lg==='mlb'){ const inn=clamp(+m.inn||1,1,9), half=m.half==='bot'?1:0, outs=clamp(+m.outs||0,0,2); return clamp(((inn-1)*2+half+outs/3)/18,0,0.9999); }
  const tot=SECS[lg], len=tot/4; const q=clamp(+m.q||1,1,4); const rem=clamp((+m.min||0)*60+(+m.sec||0),0,len); return clamp(((q-1)*len+(len-rem))/tot,0,0.9999);
}

/* ================= practice game simulator ================= */
const COMP={pr:['passYds','rushYds'],rr:['rushYds','recYds'],pra:['pts','reb','ast'],hrr:['hits','runs','rbi']};
const YDS={passYds:1,rushYds:1,recYds:1};
const statOf=(pl,k)=>pl.stats.find(s=>s.key===k);
const muTruth=s=>0.65*s.proj+0.35*(s.season!=null?s.season:s.proj);
function drawStat(rng,s){ const m=Math.max(0.02,muTruth(s)); if(m<8) return poisson(rng,m); return Math.max(0,Math.round(m+s.sd*gauss(rng))); }
function unitEvents(rng,F,lo,hi){ const a=[]; for(let i=0;i<F;i++) a.push({t:lo+(hi-lo)*rng(),d:1}); return a.sort((x,y)=>x.t-y.t); }
function chunkEvents(rng,F){
  if(F<=0) return [];
  const k=clamp(Math.round(Math.sqrt(F)/1.6)+1,1,18); const w=[]; let sw=0; for(let i=0;i<k;i++){ const x=-Math.log(1-rng()*0.999)+0.15; w.push(x); sw+=x; }
  let used=0; const d=w.map((x,i)=>{ const v=i===k-1?F-used:Math.max(1,Math.round(F*x/sw)); used+=v; return v; });
  const ts=[]; for(let i=0;i<k;i++) ts.push(rng()); ts.sort((a,b)=>a-b);
  return ts.map((t,i)=>({t:0.01+0.98*t,d:d[i]})).filter(e=>e.d>0);
}
function genPlayer(g,pl,rng){
  const lg=g.lg; const rec={pid:pl.id,act:true,goneAt:null,ev:{}};
  if(pl.avail<=0) rec.act=false; else if(rng()>pl.avail) rec.act=false;
  if(!rec.act) return rec;
  const k=pl.status.kind; const pInj=0.03*(k==='ok'?1:k==='probable'?1.3:2.2);
  if(rng()<pInj) rec.goneAt=0.2+0.6*rng();
  const has=key=>statOf(pl,key);
  if(lg==='wnba'){
    const fg3=has('fg3')?drawStat(rng,has('fg3')):0; let pts=has('pts')?drawStat(rng,has('pts')):0;
    if(pts<3*fg3) pts=3*fg3+Math.floor(rng()*5);
    const rest=pts-3*fg3; let ft=Math.min(rest,poisson(rng,rest*0.17)); const twos=Math.floor((rest-ft)/2); ft+=(rest-ft)%2;
    const plays=[]; for(let i=0;i<fg3;i++) plays.push(3); for(let i=0;i<twos;i++) plays.push(2); for(let i=0;i<ft;i++) plays.push(1);
    const evs=plays.map(d=>({t:0.01+0.98*rng(),d:d})).sort((a,b)=>a.t-b.t);
    rec.ev.pts=evs; rec.ev.fg3=evs.filter(e=>e.d===3).map(e=>({t:e.t,d:1}));
    ['reb','ast'].forEach(key=>{ if(has(key)) rec.ev[key]=unitEvents(rng,drawStat(rng,has(key)),0.01,0.99); });
  } else if(lg==='mlb' && pl.fam==='P'){
    let outs=has('outs')?clamp(drawStat(rng,has('outs')),3,27):15; let kk=has('k')?drawStat(rng,has('k')):0; kk=Math.min(kk,outs);
    const span=Math.min(0.95,outs/27+0.1); const ot=[]; for(let i=0;i<outs;i++) ot.push({t:0.02+(i+rng())/outs*span,d:1});
    rec.ev.outs=ot; const idx=ot.map((_,i)=>i); for(let i=idx.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); const x=idx[i]; idx[i]=idx[j]; idx[j]=x; }
    rec.ev.k=idx.slice(0,kk).sort((a,b)=>a-b).map(i=>({t:ot[i].t,d:1}));
  } else if(lg==='mlb'){
    const hits=has('hits')?Math.min(5,drawStat(rng,has('hits'))):0; const he=unitEvents(rng,hits,0.02,0.98); rec.ev.hits=he;
    let extra=0; if(hits>0&&has('tb')&&has('hits')) extra=Math.min(3*hits,poisson(rng,Math.max(0.1,muTruth(has('tb'))-muTruth(has('hits')))));
    const tbE=he.map(e=>({t:e.t,d:1})); for(let i=0;i<extra;i++){ tbE[Math.floor(rng()*tbE.length)].d+=1; } rec.ev.tb=tbE;
    ['runs','rbi'].forEach(key=>{ if(has(key)) rec.ev[key]=unitEvents(rng,Math.min(4,drawStat(rng,has(key))),0.02,0.98); });
  } else {
    pl.stats.forEach(s=>{ if(COMP[s.key]) return; const F=drawStat(rng,s); rec.ev[s.key]=YDS[s.key]?chunkEvents(rng,F):unitEvents(rng,F,0.01,0.99); });
  }
  if(rec.goneAt!=null) Object.keys(rec.ev).forEach(key=>{ rec.ev[key]=rec.ev[key].filter(e=>e.t<=rec.goneAt); });
  return rec;
}
function genSim(g,seed){
  const rng=mulberry32(seed); const lg=g.lg, cr=g.crossroads, ln=g.lines;
  const sim={seed:seed,pl:{},plays:{home:[],away:[]},ot:false,final:null};
  g.players.forEach(pl=>{ sim.pl[pl.id]=genPlayer(g,pl,rng); });
  const bookM=-ln.sprHome, bookT=ln.total; const bH=(bookT+bookM)/2, bA=(bookT-bookM)/2;

function cumEv(arr,f){ let s=0; for(let i=0;i<arr.length;i++){ if(arr[i].t<=f) s+=arr[i].d; else break; } return s; }

/* ================= live probability engine ================= */
// useModel=true: my model (injury-adjusted projection, matchup, last-10 form, quick pace response).
// useModel=false: the practice "market" baseline: book totals / season averages with a slow pace response. Prices come from the baseline.
function teamProbs(g,st,useModel){
  const cr=g.crossroads, ln=g.lines, lg=g.key||g.lg;
  const f=st.f, r=Math.max(0,1-f); const m=st.home-st.away, tot=st.home+st.away;
  const muM=useModel?cr.projMargin:-ln.sprHome, muT=useModel?cr.projTotal:ln.total;
  let remM=r*muM; let remT=(muT*KAPPA_T+tot)/(KAPPA_T+f)*r - 0; // pace-adjusted remaining total
  const C=useModel?ctxOf(g,st):CTX_NEUTRAL; let dH=0,dA=0;
  if(C.on){
    const hRem=r*cr.projHome, aRem=r*cr.projAway;
    dH=hRem*(C.home.mult-1)+C.home.add; dA=aRem*(C.away.mult-1)+C.away.add;
    const dP=Math.max(0,remT+dH+dA)*(C.pace.mult-1);
    remM+=dH-dA; remT+=dH+dA+dP; dH+=dP/2; dA+=dP/2;

  const fm=m+remM, ft=tot+remT;
  const done=st.final||r<=0;
  const win=done?(m>0?1:m<0?0:0.5):phi(fm/sdM);
  const cover=line=>done?((m+line)>0?1:(m+line)<0?0:0.5):phi((fm+line)/sdM);
  const over=line=>done?(tot>line?1:0):1-phi((line-ft)/sdT);
  return {win:win,cover:cover,over:over,projMargin:fm,projTotal:ft,ctx:C,projHome:st.home+r*(useModel?cr.projHome:(ln.total-ln.sprHome)/2)+dH,projAway:st.away+r*(useModel?cr.projAway:(ln.total+ln.sprHome)/2)+dA};
}
function propProb(g,st,pl,s,T,useModel){
  // probability the final stat is at least T. returns null when bets are void (did not play)
  const a=st.act[pl.id]; if(a==='dnp'||a==='out') return null;
  const c=(st.cur[pl.id]||{})[s.key]||0; const need=T-c; if(need<=0) return 1;

  const prior=useModel?s.proj:(s.season!=null?s.season:s.proj); const kap=useModel?KAP_MODEL:KAP_BASE;
  const rate=(prior*kap+c)/(kap+f); const mu=rate*r*(useModel?ctxPropMult(g,st,pl,s):1);

  if(mu<8) p=poisGE(Math.ceil(need-1e-9),mu);
  else { const sd=Math.sqrt(Math.max(s.sd*s.sd*r,mu*0.9)); p=1-phi((need-0.5-mu)/sd); }
  if(useModel){ const h=histRate(pl,s,T); if(h!=null){ const w=0.3*r; p=(1-w)*p+w*h; } }   // last-10 history of reaching T in a full game

const KAP_MODEL=2.5, KAP_BASE=5;
const LIVE_P=0.60;
function LIVE_MIN_P(){ return (typeof S!=='undefined'&&S.lvAll)?0.06:LIVE_P; }
function histRate(pl,s,T){
  let n=0,h=0; for(let i=0;i<s.v15.length;i++){ const sl=pl.slots[i]; if(s.v15[i]==null||!sl||sl.model===false) continue; n++; if(s.v15[i]>=T) h++; }
  return n>=3?(h+0.5)/(n+1):null;
}
function propMu(g,st,pl,s,useModel){
  const c=(st.cur[pl.id]||{})[s.key]||0; const f=st.f, r=Math.max(0,1-f);
  const prior=useModel?s.proj:(s.season!=null?s.season:s.proj); const kap=useModel?KAP_MODEL:KAP_BASE;

  const step=mu>=150?25:mu>=60?10:mu>=22?5:mu>=9?2:1;
  const start=Math.max(step,Math.ceil((c+0.001)/step)*step);
  const lo=LIVE_MIN_P(), arr=[]; for(let k=0;k<9;k++){ const T=start+k*step; if(T<=c) continue; const p=propProb(g,st,pl,s,T,true); if(p==null) return []; if(p>=Math.min(lo,0.06)&&p<=0.97&&p>=lo) arr.push({T:T,p:p}); }

function liveLeg(tok){

  }

function gradeLeg(leg,F){
  const sp=leg.spec; if(!sp) return 'V';
  if(sp.k==='ml'){ const m=F.home-F.away; if(m===0) return 'V'; return ((sp.side==='home')===(m>0))?'W':'L'; }
  if(sp.k==='spr'){ const m=F.home-F.away; const v=(sp.side==='home'?m:-m)+sp.line; if(v===0) return 'V'; return v>0?'W':'L'; }
  if(sp.k==='tot'){ const t=F.home+F.away; if(t===sp.line) return 'V'; return ((sp.dir==='over')===(t>sp.line))?'W':'L'; }
  if(sp.k==='prop'){ if(!F.played[sp.pid]) return 'V'; const x=(F.stat[sp.pid]||{})[sp.stat]||0; return (sp.dir==='ge'?x>=sp.T:x<sp.T)?'W':'L'; }
  return 'V';
}
function settleBets(gid,F){
  let won=0,lost=0,paid=0,voided=0;
  P.bets.forEach(b=>{
    if(b.status!=='pending') return;
    b.legs.forEach(l=>{ if(l.gid===gid&&!l.res) l.res=gradeLeg(l,F); });
    if(b.legs.some(l=>l.res==='L')){ b.status='lost'; b.payout=0; lost++; return; }
    if(b.legs.every(l=>l.res)){
      const live=b.legs.filter(l=>l.res!=='V');
      if(!live.length){ b.status='void'; b.payout=b.stake; P.bank=r2(P.bank+b.stake); voided++; return; }
      b.status='won'; b.payout=r2(b.stake*boostedDec(decOfLegs(b.legs),(b.boost&&live.length>=b.boost.minLegs)?b.boost:null)); P.bank=r2(P.bank+b.payout); won++; paid+=b.payout;
    }
  });
  return {won,lost,paid,voided};
}
function finishGame(gid){
  const g=G[gid]; const L=LS(gid);
  const F=finalOf(g); L.done=true; if(L.mode==='sim') L.f=1; else L.man.final=true;
  const res=settleBets(gid,F); try{ settleCalls(gid,F); }catch(e){}
  const sim=RT[gid]&&RT[gid].sim; const ot=sim&&sim.ot?' (overtime)':'';
  L.msg='Final'+ot+': '+g.teams.away.abbr+' '+F.away+', '+g.teams.home.abbr+' '+F.home+'. '+(res.won+res.lost+res.voided? 'Settled '+(res.won?res.won+' won ('+money(res.paid)+' paid)':'')+(res.won&&res.lost?', ':'')+(res.lost?res.lost+' lost':'')+(res.voided?(res.won||res.lost?', ':'')+res.voided+' void':'')+'.':'No pending bets on this game.');
  persist();
}

/* ================= candidates: best live bets ================= */
function candidates(g,st){
  const out=[]; const M=teamProbs(g,st,true), B=teamProbs(g,st,false);
  const add=(tok,why,sides,pace)=>{ const l=legFor(tok); if(!l||l.closed) return; const dec=decOf(l.price); const ev=l.p*dec-1; const cn=ctxNotesFor(g,st,sides||['home','away'],pace); if(cn.length) why+=' Game flow: '+cn.join(' '); out.push({tok,leg:l,ev,why}); };
  ['home','away'].forEach(side=>{
    const t=g.teams[side]; add('l:'+g.id+':ml:'+side,'Model '+pct(side==='home'?M.win:1-M.win)+' vs baseline '+pct(side==='home'?B.win:1-B.win)+'. Projected final '+t.abbr+' '+(side==='home'?M.projHome:M.projAway).toFixed(1)+' with the time left and both injury reports.',['home','away'],true);
    add('l:'+g.id+':spr:'+side,'Model final margin '+g.teams.home.abbr+' '+sg(M.projMargin)+' vs baseline '+sg(B.projMargin)+'; the line is '+g.teams.home.abbr+' '+sg(-g.lines.sprHome)+'.',['home','away'],false);
  });
  const lineT=Math.floor(M.projTotal)+0.5;
  ['over','under'].forEach(d=>{ add('l:'+g.id+':tot:'+d+':'+g.lines.total,'Model total '+n1(M.projTotal)+' vs baseline '+n1(B.projTotal)+' (line '+g.lines.total+'), '+Math.round((1-st.f)*100)+'% of the game left.',['home','away'],true); if(lineT!==g.lines.total) add('l:'+g.id+':tot:'+d+':'+lineT,'Live line '+lineT+': model total '+n1(M.projTotal)+', baseline '+n1(B.projTotal)+'.',['home','away'],true); });
  g.players.forEach(pl=>{
    if(st.act[pl.id]==='dnp'||st.gone[pl.id]) return;
    pl.stats.forEach(s=>{
      const c=(st.cur[pl.id]||{})[s.key]||0; const mu=propMu(g,st,pl,s,true), mb=propMu(g,st,pl,s,false);
      const cand=ladder(g,st,pl,s).map(x=>x.T);
      cand.forEach(T=>{
        const h=s.v15.filter(x=>x!=null&&x>=T).length; const n=s.v15.filter(x=>x!=null).length;
        let why=surname(pl.name)+' has '+c+' and needs '+(T-c)+' more '+s.label.toLowerCase()+'. Model expects about '+n1(mu)+' more with '+Math.round((1-st.f)*100)+'% of the game left (baseline '+n1(mb)+'). Reached '+T+'+ in '+h+' of his last '+n+' games.';
        if(pl.boostNotes&&pl.boostNotes.length) why+=' Teammate absence boost: '+pl.boostNotes.join(', ')+'.';
        if(pl.status.kind!=='ok'&&st.act[pl.id]!=='in') why+=' Listed '+pl.status.label+'.';
        add('l:'+g.id+':p:'+pl.id+':'+s.key+':ge:'+T,why,[pl.side],true);
      });
    });
  });
  const seen={}; const picks=[];
  const lo=S.lvAll?0.4:LIVE_P;
  out.filter(o=>o.leg.p>=lo&&o.leg.p<=0.97&&(o.leg.pb==null||o.leg.pb<=0.9)&&o.ev>0.02).sort((a,b)=>b.ev-a.ev).forEach(o=>{ if(seen[o.leg.group]) return; seen[o.leg.group]=1; picks.push(o); });
  const top=picks.slice(0,6);
  if(top.length<3){ // not enough value spots: fill with the likeliest 60%+ legs, flagged as no price edge
    out.filter(o=>o.leg.p>=lo&&o.leg.p<=0.9&&!top.includes(o)&&!seen[o.leg.group]).sort((a,b)=>b.leg.p-a.leg.p).forEach(o=>{ if(top.length>=3||seen[o.leg.group]) return; seen[o.leg.group]=1; o.lean=true; top.push(o); });
  }
  try{ logLiveCalls(g,st,top); }catch(e){}
  return top;
}

const FEED={}, VIS={}; const FS={conn:'wait',last:0,err:''};

function parseClock(c){ c=String(c||''); let m=c.match(/^(\d+):(\d+)/); if(m) return [+m[1],+m[2]]; m=c.match(/^(\d+(?:\.\d+)?)$/); if(m) return [0,Math.floor(+m[1])]; return [0,0]; }
function syncMan(g,doc){
  const L=LS(g.id), m=L.man, st=doc.st;
  m.home=doc.hs; m.away=doc['as'];
  if(g.lg==='mlb'){
    const dm=String(st.det||'').match(/^(Top|Bottom|Bot|Middle|Mid|End)\s+(\d+)/i);
    let inn=Math.max(1,st.per||1), half='top', outs=(doc.sit&&doc.sit.o)||0;
    if(dm){ const w=dm[1].toLowerCase(); inn=+dm[2]; if(w==='bottom'||w==='bot') half='bot'; else if(w==='middle'||w==='mid'){ half='bot'; outs=0; } else if(w==='end'){ inn=inn+1; half='top'; outs=0; } }
    m.inn=Math.min(9,inn); m.half=half; m.outs=Math.min(2,outs);
  } else {
    const c=parseClock(st.clk); const per=st.per||1;
    if((g.key||g.lg)==='cbb'){ // two 20-minute halves: convert to quarter-equivalents
      const e=per>2?2400:Math.min(2400,(per-1)*1200+(1200-(c[0]*60+c[1]))); const q=Math.min(4,Math.floor(Math.min(e,2399)/600)+1); const rem=per>2?0:Math.max(0,600-(e-(q-1)*600));
      m.q=q; m.min=Math.floor(rem/60); m.sec=Math.round(rem%60);
    } else { m.q=Math.min(4,Math.max(1,per)); m.min=per>4?0:c[0]; m.sec=per>4?0:c[1]; }
  }
  const post=st.s==='post';
  g.players.forEach(pl=>{
    const row=doc.p&&doc.p[pl.id];
    m.cur[pl.id]=row?Object.assign({},row):(post?{}:(m.cur[pl.id]||{}));
    if(doc.dnp&&doc.dnp.indexOf(pl.id)>=0) m.act[pl.id]='out';
    else if(row) m.act[pl.id]='in';
    else if(post) m.act[pl.id]=(g.lg==='nfl'?(pl.status.kind==='out'?'out':'unk'):'out');
    else m.act[pl.id]=m.act[pl.id]||'unk';
  });
}
function feedIn(gid,doc){
  const g=G[gid]; if(!g||!doc||!doc.st||!Array.isArray(doc.plays)) return;
  const old=FEED[gid]; if(old&&(old.t||0)>=(doc.t||0)) return;
  FEED[gid]=doc; FS.last=Date.now(); FS.conn='on';
  syncMan(g,doc); ingestPlays(g,doc,!old);
  const V=vis(gid); const st=stateOf(g); const M=teamProbs(g,st,true);
  if(st.started&&!st.final){ V.mh.push([doc.t||Date.now(),Math.round(M.win*1000)/10]); if(V.mh.length>240) V.mh.shift(); }
  if(st.started&&!st.final&&doc.st.s==='in'){ try{ logLiveCalls(g,st,candidates(g,st)); }catch(e){} }
  const changed=!old||old.st.s!==doc.st.s;
  if(doc.st.s==='post'){ const L=LS(gid); if(!L.done&&!L.man.final){ finishGame(gid); renderBank(); renderSlip(); } }
  persist();
  if(changed){ if(['chat','battle','board','profile'].indexOf(S.view)>=0&&typeof isTypingNow==='function'&&isTypingNow()){ const n=document.getElementById('nav'); if(n) n.innerHTML=navHtml(); } else render(); return; }
  if(S.view==='live') refreshLive(gid,true); else syncLegButtons();
  if(S.view==='slips') render();
}
function subLive(db){

    db.collection('live').onSnapshot(snap=>{ FS.conn='on'; snap.docs.forEach(d=>{ try{ feedIn(d.id,d.data()); }catch(e){ FS.err=String(e&&e.message||e); } }); if(!snap.docs.length&&S.view==='live') RF('lv-status',statusHtml()); },
      e=>{ FS.conn='err'; FS.err=(e&&e.message)||''; if(S.view==='live') RF('lv-status',statusHtml()); });
  }catch(e){ FS.conn='err'; }
}

const MUS={on:false,t:null,beat:0,gain:null,kind:'',cap:null};
const mHz=m=>440*Math.pow(2,(m-69)/12);
const MCH=[[48,52,55,59],[45,48,52,55],[50,53,57,60],[43,47,50,53]];
function musicStep(){
  const c=SND.ctx; if(!c||!MUS.on||!SND.on) return; const b=MUS.beat++, ch=MCH[Math.floor(b/8)%4], k=b%8, d=MUS.gain;
  const arp=[0,2,1,3,2,3,1,2][k]; sTone(mHz(ch[arp]+12),mHz(ch[arp]+12)*.995,.55,.075,'triangle',0,d,2600);
  if(k===0||k===4) sTone(mHz(ch[0]-12),mHz(ch[0]-12),.5,.16,'sine',0,d);
  if(k===0) { sTone(mHz(ch[1]),mHz(ch[1]),1.2,.04,'sine',0,d); sTone(mHz(ch[2]),mHz(ch[2]),1.2,.04,'sine',0,d); }
  if(k%2===1) sNoise(.05,.05,'highpass',7000,7000,.7,0,.005,d);
  if(k===2||k===6) sNoise(.07,.06,'highpass',5000,5000,.7,0,.005,d);
}
function musicStart(kind){

  MUS.on=true; MUS.kind=kind||'to'; MUS.beat=0; MUS.gain=c.createGain(); MUS.gain.gain.setValueAtTime(.0001,c.currentTime); MUS.gain.gain.exponentialRampToValueAtTime(.8,c.currentTime+1.4); MUS.gain.connect(SND.master);

}

  if(!MUS.on) return; MUS.on=false; clearInterval(MUS.t); clearTimeout(MUS.cap); const c=SND.ctx, g=MUS.gain; MUS.kind='';
  if(c&&g){ try{ g.gain.cancelScheduledValues(c.currentTime); g.gain.setValueAtTime(Math.max(.0001,g.gain.value),c.currentTime); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.9); }catch(e){} setTimeout(()=>{ try{ g.disconnect(); }catch(e){} },1200); }
}

function loadVoices(){ if(!HAS_TTS) return; try{ SND.voices=(speechSynthesis.getVoices()||[]).filter(v=>/^en/i.test(v.lang)); }catch(e){} }

function voiceScore(v){
  const n=v.name||''; let s=0;
  if(/en[-_]US/i.test(v.lang)) s+=3; else if(/en[-_](GB|AU|CA|IE)/i.test(v.lang)) s+=2;
  if(/premium|enhanced|natural|neural|online|studio|wavenet/i.test(n)) s+=8;
  if(/siri/i.test(n)) s+=7;
  if(/\b(ava|zoe|evan|nathan|allison|tom|aaron|noelle)\b/i.test(n)) s+=5;
  if(/(aria|guy|jenny|davis|jason|andrew|brian|emma|ryan|steffan)/i.test(n)) s+=5;
  if(/google (us|uk) english/i.test(n)) s+=5;
  if(/\b(samantha|daniel|alex|karen|moira|serena|oliver)\b/i.test(n)) s+=3;
  if(/fred|zarvox|trinoids|whisper|bahh|bells|boing|bubbles|cellos|deranged|hysterical|organ|princess|ralph|junior|kathy|albert|bad news|good news|jester|superstar|wobble|espeak|compact/i.test(n)) s-=20;
  if(v.localService===false) s+=1;
  return s;
}
function bestVoice(){
  if(!SND.voices.length) loadVoices();
  if(SND.voiceName){ const v=SND.voices.find(x=>x.name===SND.voiceName); if(v) return v; }
  return SND.voices.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0]||null;
}
function speechMs(t){ return Math.round(String(t).split(/\s+/).length*300/SND.rate+500); }
function drainSpeech(){
  if(SND.busy||!SND.q.length||!HAS_TTS||!SND.on) return;
  const it=SND.q.shift(); const u=new SpeechSynthesisUtterance(it.t); const v=bestVoice(); try{ if(v){ u.voice=v; u.lang=v.lang; } else u.lang='en-US'; }catch(e){ u.lang='en-US'; }
  u.rate=SND.rate; u.pitch=1; u.volume=1; SND.busy=true;
  let done=false; const fin=()=>{ if(done) return; done=true; SND.busy=false; clearTimeout(SND.wd); setTimeout(drainSpeech,120); };
  u.onend=fin; u.onerror=fin; SND.wd=setTimeout(fin,Math.max(4000,speechMs(it.t)*2.2));
  try{ speechSynthesis.speak(u); }catch(e){ fin(); }
}
function say(text,hi){

  SND.q.push({t:text,hi:!!hi}); drainSpeech(); return speechMs(text);
}
