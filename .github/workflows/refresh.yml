name: Refresh data

on:
  schedule:
    - cron: "*/10 16-23,0-4 * * *"
    - cron: "7,37 5-15 * * *"
  workflow_dispatch:

concurrency:
  group: line-scout-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    env:
      PYTHONUNBUFFERED: "1"
      LS_DEADLINE: "150"
      LS_MIN_PUBLISH_GAP_MIN: ${{ vars.LS_MIN_PUBLISH_GAP_MIN || '0' }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDS_MIN_GAP_MIN: ${{ vars.ODDS_MIN_GAP_MIN || '120' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: ls-cache-${{ runner.os }}
          restore-keys: |
            ls-cache-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Refresh data
        id: refresh
        timeout-minutes: 4
        run: |
          set -e
          echo "Starting Line Scout data refresh..."
          python refresh.py
          echo "Line Scout data refresh completed successfully."

      - name: Verify refresh output
        run: |
          echo "Checking refreshed data..."

          if [ ! -d "data" ] && [ ! -d "store" ]; then
            echo "ERROR: Neither data/ nor store/ exists after refresh."
            exit 1
          fi

          echo "Refresh output verified."

      - name: Commit data
        run: |
          git config user.name line-scout-bot
          git config user.email bot@users.noreply.github.com

          mkdir -p data store

          git add -A data store

          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "data refresh"

          for i in 1 2 3; do
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME" || {
              git rebase --abort || true
              continue
            }

            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Push successful."
              exit 0
            fi

            sleep 5
          done

          echo "Push failed after 3 attempts."
          exit 1
