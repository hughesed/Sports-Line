name: Refresh data

on:
  schedule:
    - cron: "*/10 16-23,0-4 * * *"
    - cron: "7,37 5-15 * * *"
    - cron: "3,23,43 16-23,0-4 * * *"   # extra triggers: GitHub drops scheduled runs when busy, the gap check keeps these from over-pulling
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: line-scout-refresh
      cancel-in-progress: false

    env:
      PYTHONUNBUFFERED: "1"
      LS_DEADLINE: "150"
      LS_MIN_PUBLISH_GAP_MIN: ${{ vars.LS_MIN_PUBLISH_GAP_MIN || '0' }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDS_MIN_GAP_MIN: ${{ vars.ODDS_MIN_GAP_MIN || '60' }}
      ODDS_LIVE_GAP_MIN: ${{ vars.ODDS_LIVE_GAP_MIN || '4' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: ls-cache-${{ runner.os }}
          restore-keys: |
            ls-cache-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh data
        id: refresh
        timeout-minutes: 4
        run: |
          set -e
          echo "Starting Line Scout data refresh..."
          python refresh.py
          echo "Line Scout data refresh completed successfully."

      - name: Verify refresh output
        run: |
          echo "Checking refreshed data..."

          if [ ! -d "data" ] && [ ! -d "store" ]; then
            echo "ERROR: Neither data/ nor store/ exists after refresh."
            exit 1
          fi

          echo "Refresh output verified."

      - name: Commit data
        run: |
          git config user.name line-scout-bot
          git config user.email bot@users.noreply.github.com

          mkdir -p data store

          git add -A data store

          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "data refresh"

          for i in 1 2 3; do
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME" || {
              git rebase --abort || true
              continue
            }

            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Push successful."
              exit 0
            fi

            sleep 5
          done

          echo "Push failed after 3 attempts."
          exit 1

  # GitHub often skips scheduled runs for hours (it did 10:40-17:00 UTC on 2026-10-19). So every run books the next one itself:
  # it waits until ~10 min after this run started (30 min from 5 to 16 UTC, the quiet overnight hours) and dispatches refresh.yml again.
  # Only the newest run keeps the chain going (an older run sees a newer one and stops), so chains never pile up; the cron lines above
  # stay as a backup that restarts the chain if it ever breaks.
  next:
    needs: refresh
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Book the next refresh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
        run: |
          started=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .run_started_at)
          start_s=$(date -d "$started" +%s)
          hour=$(date -u +%H)
          if [ "$hour" -ge 5 ] && [ "$hour" -lt 16 ]; then period=1800; else period=600; fi
          wait=$(( start_s + period - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then echo "waiting ${wait}s"; sleep "$wait"; fi
          newer=$(gh api "repos/$REPO/actions/workflows/refresh.yml/runs?per_page=20" --jq "[.workflow_runs[] | select(.id != $RUN_ID) | select(.created_at > \"$started\")] | length")
          if [ "$newer" != "0" ]; then echo "a newer run exists ($newer); it keeps the chain going"; exit 0; fi
          gh workflow run refresh.yml --repo "$REPO" --ref "$REF"
          echo "next refresh booked"
