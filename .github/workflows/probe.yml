name: Probe feeds
on:
  push:
    paths: [".github/workflows/probe.yml", "tools/probe_feeds.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python tools/probe_feeds.py
      - run: |
          git config user.name line-scout-bot; git config user.email bot@users.noreply.github.com
          git add data/probe.json; git commit -m "probe results" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep 5; done
